"Correct. By creating several plausible completed datasets and combining results (Rubin's rules), multiple imputation adds a between-imputation component to the variance, so standard errors are not understated.", "B": "Incorrect. Standard multiple imputation assumes MAR; it does not remove MNAR bias by itself.", "C": "Incorrect. Multiple imputation relies on an explicit imputation model.", "D": "Incorrect. It produces several datasets, not one."}, "source": "Little & Rubin, Statistical Analysis with Missing Data; Eurostat Memobust Handbook on imputation"}, {"id": "B2-008", "block": 2, "topic": "Imputation", "difficulty": "hard", "question": "Multiple imputation with m = 5 gives point estimates 10, 12, 11, 13 and 14. The average within-imputation variance is 2.0. Using Rubin's rules, what is the total variance of the combined estimate?", "options": {"A": "4.5", "B": "2.5", "C": "5.0", "D": "3.0"}, "answer": "C", "explanations": {"A": "Incorrect. This adds W and B (2.0 + 2.5) but omits the (1 + 1/m) factor.", "B": "Incorrect. This is only the between-imputation variance B.", "C": "Correct. Mean = 12; B = (4 + 0 + 1 + 1 + 4) / 4 = 2.5; T = W + (1 + 1/m)·B = 2.0 + 1.2 × 2.5 = 5.0.", "D": "Incorrect. This ignores most of the between-imputation component."}, "source": "Little & Rubin, Statistical Analysis with Missing Data; Eurostat Memobust Handbook on imputation"}, {"id": "B2-009", "block": 2, "topic": "Imputation", "difficulty": "medium", "question": "A business reports three turnover components of 120, 80 and 50 (thousand EUR) but leaves the total blank. The questionnaire edit rule states that the total must equal the sum of the components. What is the most appropriate treatment?", "options": {"A": "Impute the total with the median total of similar businesses.", "B": "Delete the record because a key variable is missing.", "C": "Re-contact the business before any treatment, since all imputation is forbidden for totals.", "D": "Apply deductive imputation and set the total to 250, then flag the value as derived."}, "answer": "D", "explanations": {"A": "Incorrect. A model-based value would ignore information that determines the total exactly and would likely violate the edit rule.", "B": "Incorrect. Deleting the record discards valid component data and is unnecessary.", "C": "Incorrect. Re-contact is costly and not needed when the value can be derived with certainty.", "D": "Correct. When the missing value follows logically from other reported values and an edit rule, deductive (logical) imputation is preferred: 120 + 80 + 50 = 250."}, "source": "Eurostat Memobust Handbook on Methodology of Modern Business Statistics (editing, imputation, outliers)"}, {"id": "B2-010", "block": 2, "topic": "Quality indicators", "difficulty": "medium", "question": "A survey has 2,000 eligible sampled units, of which 1,500 respond. Among the respondents, 120 leave the income item blank. What are the unit non-response rate and the item non-response rate for income?", "options": {"A": "25% and 6%", "B": "75% and 8%", "C": "25% and 8%", "D": "6% and 25%"}, "answer": "C", "explanations": {"A": "Incorrect. 6% is 120/2,000; item non-response is computed over the units that responded to the survey.", "B": "Incorrect. 75% is the unit response rate, not the non-response rate.", "C": "Correct. Unit non-response = 500 / 2,000 = 25%. Item non-response = 120 / 1,500 = 8% (ESS indicators A4 and A5).", "D": "Incorrect. The figures are swapped and use the wrong denominator."}, "source": "ESS Handbook for Quality and Metadata Reports (Eurostat, 2021)"}, {"id": "B2-011", "block": 2, "topic": "Quality indicators", "difficulty": "hard", "question": "In a business survey, 90 of 100 sampled enterprises respond. The 10 non-respondents are the largest enterprises and account for 60% of the total turnover of the sample. What is the turnover-weighted response rate?", "options": {"A": "90%", "B": "40%", "C": "60%", "D": "10%"}, "answer": "B", "explanations": {"A": "Incorrect. This is the unweighted response rate, which ignores the size of the units.", "B": "Correct. Respondents cover 100% − 60% = 40% of turnover. Weighted response rates show how much of the target total the respondents represent, which matters greatly in skewed business populations.", "C": "Incorrect. 60% is the turnover share of the non-respondents.", "D": "Incorrect. 10% is the unweighted non-response rate."}, "source": "ESS Handbook for Quality and Metadata Reports (Eurostat, 2021)"}, {"id": "B2-012", "block": 2, "topic": "Duplicates", "difficulty": "medium", "question": "A business register contains 'Müller GmbH, Berlin, VAT DE123456789' and 'Mueller GmbH, Berlin, VAT DE123456789'. What is the most appropriate action?", "options": {"A": "Standardise names, link on the VAT number and treat as one unit after checking.", "B": "Keep both records, because an exact-match duplicate check on the name finds no duplicate.", "C": "Delete both records, because the identity of the enterprise is uncertain in the register.", "D": "Keep both records and average their reported values when computing the aggregates."}, "answer": "A", "explanations": {"A": "Correct. A shared unique identifier plus a spelling variant (ü/ue) strongly indicates a near-duplicate. Standardising and linking on the identifier resolves it; keeping both would double-count the enterprise.", "B": "Incorrect. Exact string comparison misses near-duplicates caused by spelling, transliteration or encoding differences.", "C": "Incorrect. Deleting both loses a real unit and causes under-coverage.", "D": "Incorrect. Averaging does not fix the duplication and still distorts unit counts."}, "source": "Fellegi & Sunter (1969); Eurostat ESSnet on Data Integration"}, {"id": "B2-013", "block": 2, "topic": "Duplicates", "difficulty": "hard", "question": "A table customer_updates(customer_id, updated_at, address) holds several rows per customer. Which approach keeps only the most recent row for each customer?", "options": {"A": "SELECT DISTINCT customer_id, updated_at, address FROM customer_updates", "B": "SELECT customer_id, MAX(updated_at), MAX(address) FROM customer_updates GROUP BY customer_id", "C": "SELECT * FROM customer_updates ORDER BY customer_id, updated_at DESC LIMIT 1", "D": "ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY updated_at DESC), keep 1"}, "answer": "D", "explanations": {"A": "Incorrect. DISTINCT removes only rows identical on all selected columns; different dates keep all versions.", "B": "Incorrect. MAX(address) returns the alphabetically largest address, which may not belong to the latest row.", "C": "Incorrect. LIMIT 1 returns a single row for the whole table, not one per customer.", "D": "Correct. The window function ranks rows within each customer by date, and filtering on rank 1 keeps the latest complete row per customer."}, "source": "ISO SQL standard semantics (three-valued logic, joins, aggregates)"}, {"id": "B2-014", "block": 2, "topic": "Data integration and record linkage", "difficulty": "medium", "question": "Two administrative datasets have no common identifier. An analyst compares name, date of birth and postcode, assigns agreement and disagreement weights to each field, sums them and classifies pairs as match, possible match or non-match using two thresholds. Which method is this?", "options": {"A": "Deterministic (exact) record linkage on keys", "B": "Probabilistic (Fellegi–Sunter) linkage", "C": "Statistical matching (data fusion) of units", "D": "Hot-deck imputation using donor records"}, "answer": "B", "explanations": {"A": "Incorrect. Deterministic linkage requires exact agreement on a defined set of keys and does not use weights.", "B": "Correct. Field-level weights, a summed score and upper/lower thresholds with a clerical-review zone are the core of the Fellegi–Sunter model.", "C": "Incorrect. Statistical matching combines different units that are similar, not the same units across sources.", "D": "Incorrect. Hot-deck is an imputation method, not a linkage method."}, "source": "Fellegi & Sunter (1969); Eurostat ESSnet on Data Integration"}, {"id": "B2-015", "block": 2, "topic": "Data integration and record linkage", "difficulty": "medium", "question": "In probabilistic record linkage, the upper threshold for accepting a pair as a match is raised. What is the expected effect?", "options": {"A": "More false matches are accepted, and fewer true matches are missed.", "B": "No change in linkage errors, only a change in the processing time needed.", "C": "Fewer false matches, but more missed matches or clerical reviews.", "D": "Both false matches and missed matches decrease at the same time."}, "answer": "C", "explanations": {"A": "Incorrect. A stricter threshold accepts fewer pairs, so false matches fall rather than rise.", "B": "Incorrect. Thresholds directly determine the balance between the two error types.", "C": "Correct. A higher threshold is more conservative: precision improves, but some true matches fall below it and are missed or need review.", "D": "Incorrect. With a fixed comparison model, there is a trade-off between the two errors; moving one threshold cannot reduce both."}, "source": "Fellegi & Sunter (1969); Eurostat ESSnet on Data Integration"}, {"id": "B2-016", "block": 2, "topic": "Duplicates", "difficulty": "medium", "question": "A table has 1,000 rows. 50 customer IDs appear exactly twice, 10 appear exactly three times, and every other ID appears once. How many distinct customers are in the table?", "options": {"A": "930", "B": "940", "C": "870", "D": "950"}, "answer": "A", "explanations": {"A": "Correct. Duplicated IDs use 50 × 2 + 10 × 3 = 130 rows for 60 customers. The remaining 870 rows are unique customers. 870 + 60 = 930.", "B": "Incorrect. This removes only one extra row per duplicated ID (1,000 − 60).", "C": "Incorrect. This counts only the customers that appear once.", "D": "Incorrect. This removes only the extra rows of the 50 double IDs."}, "source": "Data cleaning arithmetic"}, {"id": "B2-017", "block": 2, "topic": "Outliers", "difficulty": "medium", "question": "For a variable, Q1 = 20 and Q3 = 32. Using Tukey's rule with fences at 1.5 × IQR, which value is flagged as an outlier?", "options": {"A": "3", "B": "49", "C": "2.5", "D": "51"}, "answer": "D", "explanations": {"A": "Incorrect. The lower fence is 20 − 18 = 2, so 3 lies inside.", "B": "Incorrect. The upper fence is 32 + 18 = 50, so 49 lies inside.", "C": "Incorrect. 2.5 is above the lower fence of 2.", "D": "Correct. IQR = 12, upper fence = 32 + 1.5 × 12 = 50. Only 51 exceeds a fence."}, "source": "Tukey (1977), Exploratory Data Analysis"}, {"id": "B2-018", "block": 2, "topic": "Outliers", "difficulty": "medium", "question": "Why is the median absolute deviation (MAD) often preferred to the standard deviation when detecting outliers?", "options": {"A": "It is always larger than the SD, so fewer false alarms are raised in practice.", "B": "It is robust: extreme values barely affect it, so they cannot mask themselves.", "C": "It assumes the data are normally distributed, unlike the standard deviation.", "D": "It can be computed in a single pass without sorting or ordering the data."}, "answer": "B", "explanations": {"A": "Incorrect. MAD is usually smaller than the standard deviation for the same data; size is not the point.", "B": "Correct. Mean and standard deviation are pulled by outliers (masking). Median and MAD have a high breakdown point, so outliers stand out clearly.", "C": "Incorrect. MAD does not require normality. It is scaled by 1.4826 only to make it comparable to the SD under normality.", "D": "Incorrect. Computing medians requires ordering the data."}, "source": "Eurostat Memobust Handbook on Methodology of Modern Business Statistics (editing, imputation, outliers)"}, {"id": "B2-019", "block": 2, "topic": "Outliers", "difficulty": "hard", "question": "For the values 4, 6, 7, 8, 9, 10, 40, what is the median absolute deviation (MAD, unscaled)?", "options": {"A": "4", "B": "1", "C": "8", "D": "2"}, "answer": "D", "explanations": {"A": "Incorrect. 4 is one of the absolute deviations, not their median.", "B": "Incorrect. 1 is the second-smallest deviation, not the median.", "C": "Incorrect. 8 is the median of the data, not of the deviations.", "D": "Correct. Median = 8. Absolute deviations: 4, 2, 1, 0, 1, 2, 32. Sorted: 0, 1, 1, 2, 2, 4, 32. Their median is 2."}, "source": "Robust statistics (Hampel; Rousseeuw & Croux)"}, {"id": "B2-020", "block": 2, "topic": "Outliers", "difficulty": "easy", "question": "What does winsorisation of a variable at the 1st and 99th percentiles do?", "options": {"A": "Deletes all records below the 1st percentile and above the 99th percentile.", "B": "Replaces the extreme values below and above those percentiles with the variable's mean.", "C": "Caps values below the 1st and above the 99th percentile at those percentile values.", "D": "Applies a logarithmic transformation to the most extreme 2% of the observed values."}, "answer": "C", "explanations": {"A": "Incorrect. Deleting extremes is trimming, not winsorisation.", "B": "Incorrect. Replacing with the mean is a form of imputation, not winsorisation.", "C": "Correct. Winsorisation caps extreme values at chosen percentiles, keeping the record but limiting its influence.", "D": "Incorrect. Winsorisation does not transform the scale of the data."}, "source": "Eurostat Memobust Handbook on Methodology of Modern Business Statistics (editing, imputation, outliers)"}, {"id": "B2-021", "block": 2, "topic": "Outliers", "difficulty": "hard", "question": "A business survey value is extreme. The respondent confirms it is correct, and the enterprise is known to be unique in the population (no similar units exist). What is the most appropriate treatment?", "options": {"A": "Keep the value and give the unit a weight of 1, so that it represents only itself.", "B": "Delete the record, because a single extreme value distorts the estimate for the stratum.", "C": "Replace the value with the median of its stratum to limit its influence on totals.", "D": "Keep the value with its full design weight, multiplying it as for any other unit."}, "answer": "A", "explanations": {"A": "Correct. A confirmed, unique value is real data and must stay. Because it does not represent other units, letting its design weight multiply it would overstate the total; treating it as self-representing avoids that.", "B": "Incorrect. Deleting a verified value introduces bias and under-coverage.", "C": "Incorrect. Replacing a correct value with a median substitutes a wrong value for a right one.", "D": "Incorrect. Applying a large design weight implies that many similar units exist, which is false here and inflates the estimate."}, "source": "Eurostat Memobust Handbook on Methodology of Modern Business Statistics (editing, imputation, outliers)"}, {"id": "B2-022", "block": 2, "topic": "Data transformation", "difficulty": "medium", "question": "An analyst wants to log-transform a strongly right-skewed turnover variable, but some enterprises report zero turnover. Which approach is most appropriate?", "options": {"A": "Apply log(x) directly; statistical software will handle the zero values safely.", "B": "Use log(x + c), e.g. log(1 + x), and document c, or model zeros separately.", "C": "Square the variable instead, since squaring reduces right skewness in turnover.", "D": "Delete the zero-turnover enterprises first, then apply the log transformation."}, "answer": "B", "explanations": {"A": "Incorrect. log(0) is undefined (minus infinity), producing missing or invalid values.", "B": "Correct. Adding a constant keeps zeros in the data. The constant affects results, so it must be documented; a two-part model is an alternative.", "C": "Incorrect. Squaring increases right skewness.", "D": "Incorrect. Dropping valid zeros biases the analysis."}, "source": "Standard data transformation practice"}, {"id": "B2-023", "block": 2, "topic": "Data transformation", "difficulty": "easy", "question": "A variable ranges from 10 to 60. Using min–max scaling to [0, 1], what is the scaled value of 35?", "options": {"A": "0.70", "B": "0.58", "C": "0.25", "D": "0.50"}, "answer": "D", "explanations": {"A": "Incorrect. This is 35 / 50, forgetting to subtract the minimum.", "B": "Incorrect. This is 35 / 60, dividing by the maximum.", "C": "Incorrect. This is 25 / 100 and uses the wrong range.", "D": "Correct. (35 − 10) / (60 − 10) = 25 / 50 = 0.50."}, "source": "Standard data transformation practice"}, {"id": "B2-024", "block": 2, "topic": "Data transformation", "difficulty": "easy", "question": "A variable has mean 200 and standard deviation 25. What is the z-score of the value 240?", "options": {"A": "1.6", "B": "0.16", "C": "40", "D": "−1.6"}, "answer": "A", "explanations": {"A": "Correct. z = (240 − 200) / 25 = 1.6.", "B": "Incorrect. This misplaces the decimal point.", "C": "Incorrect. 40 is the raw difference, not divided by the standard deviation.", "D": "Incorrect. The value is above the mean, so the z-score is positive."}, "source": "Standard data transformation practice"}, {"id": "B2-025", "block": 2, "topic": "SQL and NULL handling", "difficulty": "medium", "question": "A table contains 30 rows where region is NULL. The query SELECT * FROM t WHERE region = NULL returns no rows. Why?", "options": {"A": "The table has an index on region that automatically excludes all NULL values.", "B": "NULL values are dropped automatically whenever the table is queried with a WHERE clause.", "C": "A comparison with NULL yields UNKNOWN, never TRUE; the test must be region IS NULL.", "D": "The equality operator is wrong; the query should be written as region == NULL."}, "answer": "C", "explanations": {"A": "Incorrect. Indexes affect performance, not the logical result of a query.", "B": "Incorrect. NULLs remain stored and can be selected with the correct predicate.", "C": "Correct. In SQL's three-valued logic, any comparison with NULL using =, <>, < etc. is UNKNOWN. Only IS NULL / IS NOT NULL test for missing values.", "D": "Incorrect. '==' is not standard SQL, and any equality test against NULL still yields UNKNOWN."}, "source": "ISO SQL standard semantics (three-valued logic, joins, aggregates)"}, {"id": "B2-026", "block": 2, "topic": "SQL and NULL handling", "difficulty": "hard", "question": "A table has a status column with 40 rows 'A', 25 rows 'B' and 15 rows NULL. What does SELECT COUNT(*) FROM t WHERE status <> 'A' return?", "options": {"A": "15", "B": "40", "C": "80", "D": "25"}, "answer": "D", "explanations": {"A": "Incorrect. This counts only the NULL rows.", "B": "Incorrect. This counts 'B' plus NULL, assuming NULL <> 'A' is true.", "C": "Incorrect. This is the whole table.", "D": "Correct. NULL <> 'A' is UNKNOWN, so NULL rows are filtered out. Only the 25 'B' rows qualify. To include them, add OR status IS NULL."}, "source": "ISO SQL standard semantics (three-valued logic, joins, aggregates)"}, {"id": "B2-027", "block": 2, "topic": "SQL and NULL handling", "difficulty": "hard", "question": "The query SELECT id FROM a WHERE id NOT IN (SELECT ref_id FROM b) returns no rows, although many values of a.id do not appear in b. What is the most likely cause?", "options": {"A": "Table b contains duplicate ref_id values, which cancel each other out in NOT IN.", "B": "A NULL in b.ref_id makes every NOT IN comparison evaluate to UNKNOWN or FALSE.", "C": "NOT IN cannot be combined with a subquery and silently returns an empty set.", "D": "The columns a.id and b.ref_id have different names, so no comparison is made."}, "answer": "B", "explanations": {"A": "Incorrect. Duplicates in the subquery do not change the result of NOT IN.", "B": "Correct. x NOT IN (…, NULL) expands to x <> … AND x <> NULL; the last term is UNKNOWN, so no row can be TRUE. Use NOT EXISTS or filter out NULLs in the subquery.", "C": "Incorrect. NOT IN with a subquery is valid SQL.", "D": "Incorrect. The columns compared do not need the same name."}, "source": "ISO SQL standard semantics (three-valued logic, joins, aggregates)"}, {"id": "B2-028", "block": 2, "topic": "SQL joins", "difficulty": "hard", "question": "An analyst runs: SELECT c.id, o.amount FROM customers c LEFT JOIN orders o ON c.id = o.customer_id WHERE o.order_date >= '2026-01-01'. Customers without 2026 orders are missing from the result. How should the query be corrected to keep all customers?", "options": {"A": "Move the date condition from WHERE into the ON clause.", "B": "Replace the LEFT JOIN with an INNER JOIN on the same key.", "C": "Add DISTINCT to the SELECT clause to keep each customer once.", "D": "Replace the WHERE clause with a HAVING clause on the date."}, "answer": "A", "explanations": {"A": "Correct. The WHERE filter is applied after the join; rows with NULL order_date fail it, turning the LEFT JOIN into an inner join in effect. A condition in the ON clause restricts matching orders but keeps unmatched customers.", "B": "Incorrect. An INNER JOIN would explicitly drop customers without matching orders.", "C": "Incorrect. DISTINCT removes duplicate rows but does not restore missing customers.", "D": "Incorrect. HAVING filters groups after aggregation; it would still remove the NULL rows."}, "source": "ISO SQL standard semantics (three-valued logic, joins, aggregates)"}, {"id": "B2-029", "block": 2, "topic": "SQL joins", "difficulty": "hard", "question": "Table A has key values 1, 1, 2, 3. Table B has key values 1, 1, 1, 2, 4. How many rows does A LEFT JOIN B ON A.key = B.key return?", "options": {"A": "4", "B": "7", "C": "8", "D": "9"}, "answer": "C", "explanations": {"A": "Incorrect. A LEFT JOIN can return more rows than the left table when keys are duplicated.", "B": "Incorrect. 7 is the INNER JOIN result (2 × 3 for key 1 plus 1 × 1 for key 2).", "C": "Correct. Matches: 2 × 3 = 6 for key 1, 1 for key 2, plus 1 unmatched row for key 3 = 8.", "D": "Incorrect. 9 is the FULL OUTER JOIN result, which also keeps key 4 from B."}, "source": "ISO SQL standard semantics (three-valued logic, joins, aggregates)"}, {"id": "B2-030", "block": 2, "topic": "SQL and NULL handling", "difficulty": "medium", "question": "A column x holds the values 10, NULL, 30, NULL. What do AVG(x) and AVG(COALESCE(x, 0)) return, respectively?", "options": {"A": "10 and 10", "B": "20 and 20", "C": "10 and 20", "D": "20 and 10"}, "answer": "D", "explanations": {"A": "Incorrect. AVG ignores NULLs, so AVG(x) averages only 10 and 30.", "B": "Incorrect. COALESCE turns NULLs into zeros, which then enter the average.", "C": "Incorrect. The two results are swapped.", "D": "Correct. AVG(x) = (10 + 30) / 2 = 20. AVG(COALESCE(x, 0)) = (10 + 0 + 30 + 0) / 4 = 10. Replacing NULL with 0 is an imputation decision that changes the result."}, "source": "ISO SQL standard semantics (three-valued logic, joins, aggregates)"}, {"id": "B2-031", "block": 2, "topic": "SQL and NULL handling", "difficulty": "medium", "question": "A query uses GROUP BY country on a table where 12 rows have country = NULL. How are these rows treated?", "options": {"A": "They are excluded from the result.", "B": "They form a single group with a NULL country value.", "C": "Each forms its own group, giving 12 groups.", "D": "The query fails with an error."}, "answer": "B", "explanations": {"A": "Incorrect. GROUP BY does not drop NULLs; only a WHERE condition would.", "B": "Correct. For grouping, SQL treats all NULLs as belonging to one group, even though NULL = NULL is not true in comparisons.", "C": "Incorrect. NULLs are grouped together, not separately.", "D": "Incorrect. Grouping on a column with NULLs is valid."}, "source": "ISO SQL standard semantics (three-valued logic, joins, aggregates)"}, {"id": "B2-032", "block": 2, "topic": "SQL and data integration", "difficulty": "medium", "question": "Table T1 has 100 rows and table T2 has 80 rows. Neither has internal duplicates, and 20 rows are identical in both. How many rows do T1 UNION T2 and T1 UNION ALL T2 return, respectively?", "options": {"A": "160 and 180", "B": "180 and 160", "C": "160 and 160", "D": "140 and 180"}, "answer": "A", "explanations": {"A": "Correct. UNION removes duplicates: 100 + 80 − 20 = 160. UNION ALL keeps all rows: 180.", "B": "Incorrect. The figures are swapped.", "C": "Incorrect. UNION ALL does not remove duplicates.", "D": "Incorrect. 140 subtracts the 20 common rows twice."}, "source": "ISO SQL standard semantics (three-valued logic, joins, aggregates)"}, {"id": "B2-033", "block": 2, "topic": "SQL joins", "difficulty": "medium", "question": "An analyst needs the enterprises listed in register r that do not appear in survey frame f. Which query pattern achieves this?", "options": {"A": "SELECT r.* FROM r INNER JOIN f ON r.id = f.id", "B": "SELECT r.* FROM r RIGHT JOIN f ON r.id = f.id WHERE r.id IS NULL", "C": "SELECT r.* FROM r LEFT JOIN f ON r.id = f.id WHERE f.id IS NULL", "D": "SELECT r.* FROM r CROSS JOIN f"}, "answer": "C", "explanations": {"A": "Incorrect. An inner join returns enterprises present in both tables.", "B": "Incorrect. This returns frame records with no match in the register, the opposite direction.", "C": "Correct. This is an anti-join: keep every register row, and those with no frame match have NULL in f.id. NOT EXISTS is an equivalent option.", "D": "Incorrect. A cross join returns every combination of rows and is not a matching operation."}, "source": "ISO SQL standard semantics (three-valued logic, joins, aggregates)"}, {"id": "B2-034", "block": 2, "topic": "Data integration and harmonisation", "difficulty": "medium", "question": "Two sources to be integrated code economic activity with different versions of the NACE classification. What is the most appropriate approach?", "options": {"A": "Keep both codings side by side and add the totals across the two versions anyway.", "B": "Match the codes of the two versions by comparing their label text word by word.", "C": "Drop the activity variable from the integrated dataset to avoid inconsistencies.", "D": "Apply the official correspondence table and document how splits were allocated."}, "answer": "D", "explanations": {"A": "Incorrect. Adding totals from different classification versions produces incoherent, non-comparable aggregates.", "B": "Incorrect. Labels can change or be ambiguous; official correspondence tables define the mapping.", "C": "Incorrect. Dropping the variable discards key information unnecessarily.", "D": "Correct. Official correspondence tables convert between versions. Where a code splits into several, the allocation rule (e.g. by employment shares) must be documented for transparency."}, "source": "Eurostat NACE Rev. 2 / Rev. 2.1 correspondence tables"}, {"id": "B2-035", "block": 2, "topic": "Data integration and harmonisation", "difficulty": "medium", "question": "Source A reports a value of 4,250 in thousand EUR. Source B reports 3,900,000 in EUR. After harmonising units, what is the combined total in million EUR?", "options": {"A": "3,904.25", "B": "8.15", "C": "4,254", "D": "81.5"}, "answer": "B", "explanations": {"A": "Incorrect. This adds the two figures without converting units consistently.", "B": "Correct. A: 4,250 thousand EUR = 4.25 million EUR. B: 3,900,000 EUR = 3.9 million EUR. Total = 8.15 million EUR.", "C": "Incorrect. This treats B as 3.9 thousand and mixes units.", "D": "Incorrect. The decimal point is misplaced by a factor of ten."}, "source": "Data integration practice: unit-of-measure harmonisation (SDMX UNIT_MULT attribute)"}, {"id": "B2-036", "block": 2, "topic": "Data validation", "difficulty": "easy", "question": "The rule 'if age is below 15, then marital status cannot be married' is an example of which type of validation check?", "options": {"A": "A consistency check", "B": "A range check on age", "C": "A format check on status", "D": "A completeness check"}, "answer": "A", "explanations": {"A": "Correct. The rule relates the values of two variables in the same record; it is a logical consistency edit.", "B": "Incorrect. A range check tests a single variable against allowed limits.", "C": "Incorrect. A format check tests the structure of a value (e.g. a date pattern).", "D": "Incorrect. A completeness check tests whether required values are present."}, "source": "ESS Methodology for data validation (ESSnet ValiDat Foundation, 2016)"}, {"id": "B2-037", "block": 2, "topic": "Data validation", "difficulty": "medium", "question": "A validation rule flags records where the reported hourly wage exceeds EUR 200. Such wages are rare but possible. What kind of edit is this?", "options": {"A": "A hard (fatal) edit: the flagged value is certainly wrong and must be corrected.", "B": "A soft (query) edit: the value is suspicious and should be verified, not changed.", "C": "A structural edit that checks the layout and format of the transmitted file.", "D": "A deductive edit that derives the correct value from other reported variables."}, "answer": "B", "explanations": {"A": "Incorrect. Hard edits identify values that are certainly wrong (e.g. negative age). A high wage can be genuine.", "B": "Correct. Soft edits identify implausible but possible values that need verification before any change.", "C": "Incorrect. Structural edits check format and file layout, not plausibility.", "D": "Incorrect. A deductive edit derives a value logically; this rule only flags it."}, "source": "Eurostat Memobust Handbook on Methodology of Modern Business Statistics (editing, imputation, outliers)"}, {"id": "B2-038", "block": 2, "topic": "Data validation", "difficulty": "medium", "question": "A statistical office cannot follow up every record that fails an edit. It uses a score function combining the size of the suspected error and the unit's weight, and only follows up records with high scores. What is this approach called?", "options": {"A": "Macro-editing", "B": "Listwise deletion", "C": "Automatic imputation", "D": "Selective editing"}, "answer": "D", "explanations": {"A": "Incorrect. Macro-editing checks aggregates first and then drills down; it does not score individual records in this way.", "B": "Incorrect. Listwise deletion removes incomplete records, it is not an editing strategy.", "C": "Incorrect. Automatic imputation corrects without follow-up; here, high-score records are followed up manually.", "D": "Correct. Selective editing focuses manual effort on the records with the largest expected impact on the estimates, saving resources and reducing respondent burden."}, "source": "Eurostat Memobust Handbook on Methodology of Modern Business Statistics (editing, imputation, outliers)"}, {"id": "B2-039", "block": 2, "topic": "Data validation", "difficulty": "hard", "question": "Under the ESS data validation framework, a check that a transmitted file has the expected number of columns, separators and data types, before any content is examined, belongs to which validation level?", "options": {"A": "Level 1", "B": "Level 3", "C": "Level 0", "D": "Level 5"}, "answer": "C", "explanations": {"A": "Incorrect. Level 1 checks content consistency within a single dataset (e.g. cell values, cross-field rules).", "B": "Incorrect. Level 3 compares datasets in the same domain from different providers (e.g. mirror checks).", "C": "Correct. Level 0 covers file format and structure: column counts, delimiters, data types.", "D": "Incorrect. Level 5 compares data across domains from different providers."}, "source": "ESS Methodology for data validation (ESSnet ValiDat Foundation, 2016)"}, {"id": "B2-040", "block": 2, "topic": "Data validation", "difficulty": "hard", "question": "Automatic error localisation based on the Fellegi–Holt paradigm chooses which fields to change in a record that fails edits. What principle does it follow?", "options": {"A": "Change the field that the respondent reported last in the questionnaire.", "B": "Always change the variable with the highest variance among the failed edits.", "C": "Change every field that is involved in at least one of the failed edits.", "D": "Change the fewest (weighted) fields that let the record pass all edits."}, "answer": "D", "explanations": {"A": "Incorrect. Reporting order plays no role in Fellegi–Holt.", "B": "Incorrect. Variance is not the criterion.", "C": "Incorrect. Changing all involved fields would destroy more reported data than needed.", "D": "Correct. Fellegi–Holt assumes errors are rare, so it localises the smallest (weighted) set of fields whose change allows all edits to pass; values are then imputed."}, "source": "Fellegi & Holt (1976), A Systematic Approach to Automatic Edit and Imputation"}, {"id": "B2-041", "block": 2, "topic": "Documentation of transformations", "difficulty": "medium", "question": "An auditor wants to trace a published indicator back through each aggregation, imputation and filtering step to the raw source records. Which concept describes the documentation needed?", "options": {"A": "Data lineage (provenance)", "B": "Data minimisation", "C": "Statistical disclosure control", "D": "Seasonal adjustment"}, "answer": "A", "explanations": {"A": "Correct. Data lineage records where data came from and every transformation applied, making outputs traceable and auditable.", "B": "Incorrect. Data minimisation is a data-protection principle about collecting only necessary data.", "C": "Incorrect. Disclosure control protects confidentiality; it does not document processing.", "D": "Incorrect. Seasonal adjustment is a time-series method."}, "source": "GSBPM v5.1; ESS Code of Practice Principle 8"}, {"id": "B2-042", "block": 2, "topic": "Documentation of transformations", "difficulty": "medium", "question": "Which practice best supports reproducibility of a data-cleaning process?", "options": {"A": "Correcting values by hand in a spreadsheet and saving over the original file.", "B": "Writing the cleaning steps as scripts under version control, keeping the raw data unchanged.", "C": "Describing the cleaning steps verbally to colleagues.", "D": "Keeping only the final clean dataset to avoid confusion."}, "answer": "B", "explanations": {"A": "Incorrect. Manual, overwritten edits leave no record and cannot be repeated or checked.", "B": "Correct. Scripts document each transformation, can be re-run on new or corrected inputs, and version control records changes. Keeping raw data intact allows full re-processing.", "C": "Incorrect. Verbal descriptions are incomplete and not auditable.", "D": "Incorrect. Discarding raw data and intermediate steps makes the process impossible to reproduce or audit."}, "source": "European Statistics Code of Practice (ESS, revised 2017), Principle 8 (appropriate statistical procedures)"}, {"id": "B2-043", "block": 2, "topic": "Metadata", "difficulty": "medium", "question": "Which of the following is an example of structural metadata?", "options": {"A": "A quality report describing the accuracy and reliability of a survey.", "B": "A press release explaining recent trends in the published statistics.", "C": "An SDMX data structure definition with dimensions and code lists.", "D": "A user satisfaction survey report on the statistical office's products."}, "answer": "C", "explanations": {"A": "Incorrect. Quality reports are reference metadata: they describe content and quality.", "B": "Incorrect. A press release is a dissemination product, not metadata.", "C": "Correct. Structural metadata identify and describe the data's structure (dimensions, codes, attributes) so they can be processed and exchanged.", "D": "Incorrect. This is a user-feedback product, not structural metadata."}, "source": "SDMX Content-Oriented Guidelines"}, {"id": "B2-044", "block": 2, "topic": "Metadata", "difficulty": "medium", "question": "What is the purpose of Eurostat's Single Integrated Metadata Structure (SIMS)?", "options": {"A": "To give one set of concepts for both reference metadata (ESMS) and quality reports.", "B": "To define the file format and layout for transmitting microdata to Eurostat.", "C": "To replace the European Statistics Code of Practice with a metadata standard.", "D": "To classify economic activities consistently across all EU Member States."}, "answer": "A", "explanations": {"A": "Correct. SIMS merges the concepts of the Euro-SDMX Metadata Structure (ESMS) and the ESS Standard for Quality Reports Structure (ESQRS), so metadata and quality reporting use one consistent structure.", "B": "Incorrect. Data transmission formats are defined by SDMX data structures, not SIMS.", "C": "Incorrect. SIMS is a reporting structure; the Code of Practice remains the quality framework.", "D": "Incorrect. That is the role of NACE."}, "source": "ESS Handbook for Quality and Metadata Reports (Eurostat, 2021)"}, {"id": "B2-045", "block": 2, "topic": "ESS quality framework", "difficulty": "easy", "question": "In the European Statistics Code of Practice, the principles of relevance, accuracy and reliability, timeliness and punctuality, coherence and comparability, and accessibility and clarity belong to which group?", "options": {"A": "Institutional environment", "B": "Statistical processes", "C": "Statistical output", "D": "Cost effectiveness"}, "answer": "C", "explanations": {"A": "Incorrect. Institutional environment covers principles such as professional independence, mandate, resources, confidentiality and impartiality.", "B": "Incorrect. Statistical processes cover sound methodology, appropriate procedures, non-excessive burden and cost effectiveness.", "C": "Correct. Principles 11–15 form the statistical output group and match the ESS quality dimensions.", "D": "Incorrect. Cost effectiveness is a single principle (10) within statistical processes."}, "source": "European Statistics Code of Practice (ESS, revised 2017)"}, {"id": "B2-046", "block": 2, "topic": "ESS quality dimensions", "difficulty": "hard", "question": "Annual statistics for reference year 2025 were announced in the release calendar for 15 March 2026 and were actually published on 18 March 2026. Which statement is correct?", "options": {"A": "Timeliness is 3 days and punctuality is 77 days after the reference period.", "B": "Both timeliness and punctuality are 3 days, measured from the announced date.", "C": "Punctuality cannot be measured without knowing the date of data collection.", "D": "Punctuality: 3 days late. Timeliness: 77 days after the reference period."}, "answer": "D", "explanations": {"A": "Incorrect. The two concepts are swapped.", "B": "Incorrect. Timeliness is measured from the end of the reference period, not from the announced date.", "C": "Incorrect. Punctuality compares the actual release date with the announced (target) date.", "D": "Correct. Punctuality: 18 March − 15 March = 3 days late. Timeliness: from 31 December 2025 to 18 March 2026 = 31 + 28 + 18 = 77 days."}, "source": "European Statistics Code of Practice (ESS, revised 2017), Principle 13; ESS Handbook for Quality and Metadata Reports (Eurostat, 2021) (TP1, TP3)"}, {"id": "B2-047", "block": 2, "topic": "ESS quality dimensions", "difficulty": "medium", "question": "The four quarterly values of a national accounts aggregate do not add up to the published annual value for the same year. Which quality dimension is mainly concerned?", "options": {"A": "Relevance", "B": "Coherence", "C": "Accessibility", "D": "Punctuality"}, "answer": "B", "explanations": {"A": "Incorrect. Relevance concerns whether statistics meet users' needs.", "B": "Correct. Coherence is the degree to which statistics can be reliably combined; inconsistency between sub-annual and annual figures is an internal coherence problem.", "C": "Incorrect. Accessibility concerns how easily users can find and obtain the data.", "D": "Incorrect. Punctuality concerns release dates."}, "source": "European Statistics Code of Practice (ESS, revised 2017), Principle 14"}, {"id": "B2-048", "block": 2, "topic": "ESS quality dimensions", "difficulty": "medium", "question": "A change in survey methodology creates a break in a time series. What is the best way to protect comparability over time?", "options": {"A": "Flag the break in metadata and back-calculate the series where possible.", "B": "Publish the new series without comment, since the new method is more accurate.", "C": "Stop publishing the series until enough data on the new basis are available.", "D": "Adjust the new values so that they continue the trend of the old series."}, "answer": "A", "explanations": {"A": "Correct. Code of Practice indicator 14.4 asks for comparability over a reasonable period; breaks should be flagged and explained, with back-casting where feasible.", "B": "Incorrect. Unflagged breaks mislead users who compare periods.", "C": "Incorrect. Discontinuing harms relevance and is not needed.", "D": "Incorrect. Forcing new data to follow the old trend falsifies the data."}, "source": "European Statistics Code of Practice (ESS, revised 2017), Principle 14"}, {"id": "B2-049", "block": 2, "topic": "ESS quality dimensions", "difficulty": "medium", "question": "Which of the following is a non-sampling error?", "options": {"A": "The difference between a sample estimate and the population value due to selecting only part of the population.", "B": "The standard error of a mean from a simple random sample.", "C": "Coverage error caused by a frame that still includes enterprises that have ceased activity.", "D": "The width of a 95% confidence interval."}, "answer": "C", "explanations": {"A": "Incorrect. This is sampling error by definition.", "B": "Incorrect. The standard error measures sampling variability.", "C": "Correct. Coverage (frame) errors, measurement, processing and non-response errors are non-sampling errors; they would occur even in a census.", "D": "Incorrect. Confidence intervals summarise sampling error."}, "source": "ESS Handbook for Quality and Metadata Reports (Eurostat, 2021)"}, {"id": "B2-050", "block": 2, "topic": "Quality indicators", "difficulty": "medium", "question": "A survey frame contains 10,000 units. During fieldwork, 400 are found to be out of scope (e.g. ceased or outside the target population). What is the over-coverage rate?", "options": {"A": "4%", "B": "4.17%", "C": "96%", "D": "0.4%"}, "answer": "A", "explanations": {"A": "Correct. Over-coverage rate (ESS indicator A2) = units in the frame not belonging to the target population / units in the frame = 400 / 10,000 = 4%.", "B": "Incorrect. This divides by the 9,600 in-scope units instead of the frame.", "C": "Incorrect. 96% is the in-scope share.", "D": "Incorrect. The decimal point is misplaced."}, "source": "ESS Handbook for Quality and Metadata Reports (Eurostat, 2021) (A2)"}, {"id": "B2-051", "block": 2, "topic": "Quality indicators", "difficulty": "hard", "question": "First estimates of quarterly growth were 2.0, 1.5, −0.5 and 1.0 (%). Later estimates are 2.3, 1.1, −0.3 and 1.0. What is the mean absolute revision?", "options": {"A": "0.025 percentage points", "B": "0.225 percentage points", "C": "0.9 percentage points", "D": "0.3 percentage points"}, "answer": "B", "explanations": {"A": "Incorrect. 0.025 is the mean revision, where positive and negative revisions cancel.", "B": "Correct. Revisions: +0.3, −0.4, +0.2, 0. Absolute values sum to 0.9; 0.9 / 4 = 0.225 (ESS indicator A6).", "C": "Incorrect. This is the sum of absolute revisions, not the mean.", "D": "Incorrect. This is the largest positive revision only."}, "source": "ESS Handbook for Quality and Metadata Reports (Eurostat, 2021) (A6)"}, {"id": "B2-052", "block": 2, "topic": "Quality indicators", "difficulty": "medium", "question": "After processing, a turnover variable has values for all 1,200 records. 210 of these values were imputed; the imputed values account for 12% of total turnover. What is the unweighted imputation rate?", "options": {"A": "12%", "B": "82.5%", "C": "21%", "D": "17.5%"}, "answer": "D", "explanations": {"A": "Incorrect. 12% is the weighted (by value) imputation rate.", "B": "Incorrect. 82.5% is the share of reported values.", "C": "Incorrect. 21% does not correspond to any correct ratio here.", "D": "Correct. Unweighted imputation rate = 210 / 1,200 = 17.5% (ESS indicator A7)."}, "source": "ESS Handbook for Quality and Metadata Reports (Eurostat, 2021) (A7)"}, {"id": "B2-053", "block": 2, "topic": "Quality indicators", "difficulty": "easy", "question": "A regulation requires a country to deliver 250 data cells. The country delivers 230. What is the data completeness rate, the ESS indicator for relevance?", "options": {"A": "8%", "B": "108.7%", "C": "92%", "D": "230"}, "answer": "C", "explanations": {"A": "Incorrect. 8% is the share of missing cells.", "B": "Incorrect. This divides required cells by delivered cells.", "C": "Correct. Data completeness rate (R1) = 230 / 250 = 92%.", "D": "Incorrect. The indicator is a rate, not a count."}, "source": "ESS Handbook for Quality and Metadata Reports (Eurostat, 2021) (R1)"}, {"id": "B2-054", "block": 2, "topic": "Quality indicators", "difficulty": "medium", "question": "Which ESS quality indicator relates to the dimension of accessibility and clarity?", "options": {"A": "Unit non-response rate", "B": "Time lag of first results", "C": "Asymmetry for mirror flow statistics", "D": "Metadata completeness rate"}, "answer": "D", "explanations": {"A": "Incorrect. Unit non-response is an accuracy indicator.", "B": "Incorrect. Time lag measures timeliness.", "C": "Incorrect. Mirror flow asymmetry measures coherence.", "D": "Correct. Metadata completeness rate (AC3), together with consultations of data tables and metadata (AC1, AC2), measures accessibility and clarity."}, "source": "ESS Handbook for Quality and Metadata Reports (Eurostat, 2021)"}, {"id": "B2-055", "block": 2, "topic": "Data integration and coherence", "difficulty": "hard", "question": "Country X reports exports to country Y of EUR 500 million. Country Y reports imports from X of EUR 560 million for the same goods and period. Apart from errors, what is a common legitimate cause of such an asymmetry?", "options": {"A": "Imports are usually valued CIF (with freight and insurance) and exports FOB.", "B": "Exports are always recorded one full year later than the corresponding imports.", "C": "None: mirror statistics must be identical, so any gap is a reporting error.", "D": "Imports are recorded in volume terms while exports are recorded in value terms."}, "answer": "A", "explanations": {"A": "Correct. Valuation differences (CIF vs FOB), along with timing, confidentiality and partner-allocation differences, explain part of mirror asymmetries. Analysing them is a coherence check.", "B": "Incorrect. Timing gaps can exist but are not systematic in this way.", "C": "Incorrect. Methodological differences make some asymmetry normal, so not every gap is an error.", "D": "Incorrect. Both flows are recorded in value (with quantities as supplementary data)."}, "source": "Eurostat international trade in goods statistics, asymmetry analysis; ESS Handbook for Quality and Metadata Reports (Eurostat, 2021) (CC1)"}, {"id": "B2-056", "block": 2, "topic": "Documentation of transformations", "difficulty": "medium", "question": "Why should a dataset keep flags that mark which values were imputed or edited?", "options": {"A": "Flags are required so that the dataset can be encrypted before it is transmitted.", "B": "They show which values were treated and support imputation-rate indicators.", "C": "They reduce the size of the dataset by replacing imputed values with codes.", "D": "They allow imputed values to be published as if they were reported values."}, "answer": "B", "explanations": {"A": "Incorrect. Flags have nothing to do with encryption.", "B": "Correct. Flags document processing, support quality indicators (e.g. imputation rate) and let users run sensitivity analyses or exclude imputed values.", "C": "Incorrect. Flags add columns; they do not reduce size.", "D": "Incorrect. The point is transparency, i.e. not presenting imputed values as reported."}, "source": "ESS Handbook for Quality and Metadata Reports (Eurostat, 2021); GSBPM 5.4"}, {"id": "B2-057", "block": 2, "topic": "Data cleaning", "difficulty": "medium", "question": "A date column contains values such as 03/04/2026, 2026-04-03 and 4.3.2026 from different sources. What is the best cleaning approach?", "options": {"A": "Let the software infer each date format automatically and accept its output as is.", "B": "Delete every row whose date is not already written in the YYYY-MM-DD format.", "C": "Convert all dates to ISO 8601, using each source's documented format to resolve them.", "D": "Store all dates as plain text so that no conversion errors can be introduced."}, "answer": "C", "explanations": {"A": "Incorrect. Automatic inference can silently swap day and month in values like 03/04.", "B": "Incorrect. Deleting valid records causes data loss and possible bias.", "C": "Correct. A single unambiguous standard simplifies validation and joins; source metadata tell whether 03/04 means 3 April or 4 March.", "D": "Incorrect. Text dates cannot be validated, sorted or used in date calculations reliably."}, "source": "ISO 8601; standard data cleaning practice"}, {"id": "B2-058", "block": 2, "topic": "Data cleaning", "difficulty": "medium", "question": "Joining two tables on a country code returns far fewer matches than expected. Inspection shows codes like 'be', 'BE ' and 'BE'. What should be done?", "options": {"A": "Switch to a FULL OUTER JOIN so that all rows are kept.", "B": "Remove the rows that fail to match from both tables.", "C": "Join on the full country name instead of the code.", "D": "Apply TRIM and UPPER to the keys before joining."}, "answer": "D", "explanations": {"A": "Incorrect. An outer join keeps unmatched rows but does not fix the mismatch.", "B": "Incorrect. Removing rows loses valid data.", "C": "Incorrect. Names have even more spelling and language variation than codes.", "D": "Correct. Case and trailing spaces make otherwise identical keys differ. Cleaning them, and validating against the official code list, restores the matches."}, "source": "Standard data cleaning practice"}, {"id": "B2-059", "block": 2, "topic": "ESS quality framework", "difficulty": "medium", "question": "What is the main role of the ESS Quality Assurance Framework (QAF)?", "options": {"A": "It sets legally binding penalties for Member States that miss transmission deadlines.", "B": "It lists methods and tools to implement the Code of Practice indicators.", "C": "It replaces national quality frameworks with one common Eurostat procedure.", "D": "It defines the statistical classifications that all ESS members must apply."}, "answer": "B", "explanations": {"A": "Incorrect. The QAF is a supporting framework, not a sanctions instrument.", "B": "Correct. The QAF lists practical methods and tools (e.g. quality reports, self-assessments, user surveys) at institutional and product/process level to implement the Code of Practice.", "C": "Incorrect. National statistical institutes can keep their own frameworks consistent with the Code.", "D": "Incorrect. Classifications are defined in separate legal acts (e.g. NACE)."}, "source": "ESS Quality Assurance Framework (QAF) v2.0"}, {"id": "B2-060", "block": 2, "topic": "ESS quality dimensions", "difficulty": "medium", "question": "In the ESS quality framework, how is 'reliability' distinguished from 'accuracy'?", "options": {"A": "Reliability is how close first estimates are to later ones, assessed through revisions.", "B": "Reliability is how close an estimate is to the true value in the population.", "C": "Reliability refers to how quickly statistics are published after the reference period.", "D": "Reliability and accuracy are two names for exactly the same quality concept."}, "answer": "A", "explanations": {"A": "Correct. Accuracy is closeness to the true value; reliability is closeness of initial to subsequent estimates, which is why revisions are regularly analysed (Code of Practice indicator 12.3).", "B": "Incorrect. That describes accuracy.", "C": "Incorrect. Speed of publication is timeliness.", "D": "Incorrect. Principle 12 names both because they are distinct."}, "source": "European Statistics Code of Practice (ESS, revised 2017), Principle 12"}, {"id": "B3-001", "block": 3, "topic": "Metadata: structural vs reference", "difficulty": "easy", "question": "A Eurostat dataset on regional unemployment is published together with several kinds of metadata. Which item is reference metadata rather than structural metadata?", "options": {"A": "The list of dimensions (GEO, TIME_PERIOD, SEX, AGE) in the Data Structure Definition of the dataset", "B": "A description of the method used to seasonally adjust the series and its known breaks", "C": "The code list of NUTS 2 regions used for the GEO dimension", "D": "The identifier of the dataflow used to transmit the data"}, "answer": "B", "explanations": {"A": "Incorrect. The dimensions of a Data Structure Definition are the core of structural metadata: they are needed to identify each observation.", "B": "Correct. Reference metadata describe the content and quality of statistics (concepts, methodology, quality). A seasonal adjustment description is methodological reference metadata.", "C": "Incorrect. A code list attached to a dimension identifies the data and is structural metadata.", "D": "Incorrect. Dataflow identifiers are structural artefacts used to locate and process the data, not to explain its methodology or quality."}, "source": "Eurostat, Metadata (ESS reference metadata) web pages; SDMX Glossary"}, {"id": "B3-002", "block": 3, "topic": "Metadata: SIMS", "difficulty": "medium", "question": "What best describes the Single Integrated Metadata Structure (SIMS) used in the European Statistical System?", "options": {"A": "A classification of economic activities used to code business statistics", "B": "One set of concepts merging the user-oriented ESMS and the producer-oriented quality report structure (ESQRS)", "C": "An SDMX Data Structure Definition that every ESS dataset must use to define its dimensions, codes and measures", "D": "A legally binding regulation replacing Regulation (EC) No 223/2009 for metadata"}, "answer": "B", "explanations": {"A": "Incorrect. That describes NACE. SIMS is a metadata structure, not a statistical classification.", "B": "Correct. SIMS merges the concepts of the Euro SDMX Metadata Structure (reference metadata for users) and the ESS Standard for Quality Reports Structure (quality reports for producers) so both can be produced from one set of concepts.", "C": "Incorrect. SIMS concerns reference and quality metadata, not the dimensional structure of datasets, which is defined in DSDs.", "D": "Incorrect. SIMS is a metadata standard, not a regulation, and it does not replace the framework regulation on European statistics."}, "source": "Eurostat, ESS Handbook for Quality and Metadata Reports (EHQMR); SIMS documentation"}, {"id": "B3-003", "block": 3, "topic": "Metadata: ESMS", "difficulty": "medium", "question": "Which act is the reference text recommending the Euro SDMX Metadata Structure (ESMS) for reference metadata in the ESS?", "options": {"A": "Regulation (EU) 2022/868 (Data Governance Act)", "B": "Regulation (EU) 2018/1725 on the processing of personal data by Union institutions and bodies", "C": "Directive (EU) 2019/1024 on open data", "D": "Commission Recommendation 2009/498/EC on reference metadata for the ESS"}, "answer": "D", "explanations": {"A": "Incorrect. The Data Governance Act concerns re-use of protected public sector data and data intermediation, not ESMS.", "B": "Incorrect. Regulation 2018/1725 concerns the protection of personal data processed by Union institutions, not statistical metadata.", "C": "Incorrect. The Open Data Directive concerns re-use of public sector information, not the structure of ESS reference metadata.", "D": "Correct. Commission Recommendation 2009/498/EC of 23 June 2009 recommends the use of ESMS for reference metadata in the ESS."}, "source": "Commission Recommendation 2009/498/EC (OJ L 168, 30.6.2009)"}, {"id": "B3-004", "block": 3, "topic": "Metadata: SDMX components", "difficulty": "medium", "question": "In an SDMX dataset, an observation of 4.7 for Belgium in 2025-Q2 is marked as provisional. In the Data Structure Definition, how is the provisional status normally modelled?", "options": {"A": "As an attribute attached to the observation, such as an observation status flag", "B": "As an additional dimension, so the provisional and final values have different keys", "C": "As the primary measure, replacing the numeric value", "D": "As a separate dataflow for provisional data"}, "answer": "A", "explanations": {"A": "Correct. Attributes carry qualifying information (status, confidentiality, unit multiplier) without being part of the key that identifies the observation.", "B": "Incorrect. Making status a dimension would create two series for the same concept and break the identification logic. Status is qualifying information, so it is an attribute.", "C": "Incorrect. The primary measure holds the observed value (4.7). The status qualifies it.", "D": "Incorrect. A separate dataflow is not needed. SDMX handles status at observation level through attributes."}, "source": "SDMX 2.1/3.0 Information Model, Data Structure Definition"}, {"id": "B3-005", "block": 3, "topic": "Metadata: GSBPM", "difficulty": "medium", "question": "In the Generic Statistical Business Process Model (GSBPM, version 5.1), in which phase is the sub-process 'Apply disclosure control' located?", "options": {"A": "Process", "B": "Collect", "C": "Evaluate", "D": "Analyse"}, "answer": "D", "explanations": {"A": "Incorrect. Process covers integration, classification, editing, imputation, derivation and weighting, not disclosure control.", "B": "Incorrect. The Collect phase covers selecting samples, setting up and running collection and finalising collection. Disclosure control is applied to outputs.", "C": "Incorrect. Evaluate gathers inputs and agrees an action plan after the cycle, long after disclosure control should have been applied.", "D": "Correct. GSBPM 5.1 places 'Apply disclosure control' (6.4) in phase 6 Analyse, before outputs are finalised and disseminated."}, "source": "UNECE, Generic Statistical Business Process Model v5.1"}, {"id": "B3-006", "block": 3, "topic": "Metadata: standards", "difficulty": "medium", "question": "A team wants its datasets to be harvested automatically by the official EU open data portal so that users can discover them through a catalogue. Which metadata standard is most appropriate for describing the datasets in that catalogue?", "options": {"A": "GSIM, the Generic Statistical Information Model developed under the UNECE modernisation work", "B": "DDI, the Data Documentation Initiative standard for documenting surveys and microdata", "C": "DCAT-AP, the application profile of the Data Catalogue Vocabulary for European data portals", "D": "ISO 3166"}, "answer": "C", "explanations": {"A": "Incorrect. GSIM is a conceptual reference model for statistical information objects, not a catalogue exchange format.", "B": "Incorrect. DDI documents survey and microdata in detail (questionnaires, variables). It is not the standard used for portal catalogue harvesting.", "C": "Correct. DCAT-AP is the specification used to describe datasets and distributions in European data portals, including data.europa.eu, enabling harvesting across catalogues.", "D": "Incorrect. ISO 3166 is a code list of country codes. It can be used inside metadata but it is not a dataset description standard."}, "source": "SEMIC, DCAT-AP specification; data.europa.eu documentation"}, {"id": "B3-007", "block": 3, "topic": "Metadata: ESMS concepts", "difficulty": "easy", "question": "In the ESMS/SIMS reference metadata, under which concept would you document the rules applied to suppress or perturb cells before publication?", "options": {"A": "Timeliness and punctuality", "B": "Release policy, including the release calendar and user access", "C": "Confidentiality (data treatment)", "D": "Unit of measure"}, "answer": "C", "explanations": {"A": "Incorrect. This concept records the time lag between reference period and release and adherence to release dates.", "B": "Incorrect. Release policy describes the release calendar and user access to releases, not the treatment of confidential cells.", "C": "Correct. The Confidentiality concept has sub-concepts on the confidentiality policy and on confidentiality data treatment, which describes rules such as suppression or perturbation.", "D": "Incorrect. This concept records units such as euro, tonnes or percentage."}, "source": "Eurostat, ESMS/SIMS concepts and guidelines"}, {"id": "B3-008", "block": 3, "topic": "Metadata: classifications", "difficulty": "medium", "question": "An analyst merges two business statistics files: one coded to NACE Rev. 2 and one coded to NACE Rev. 2.1. What is the most appropriate first step?", "options": {"A": "Recode both files to ISCO-08", "B": "Join the files on the code values, since the codes have the same format", "C": "Map the codes with the official correspondence table and document it", "D": "Drop all codes that differ between versions"}, "answer": "C", "explanations": {"A": "Incorrect. ISCO-08 classifies occupations, not economic activities, so it cannot replace NACE.", "B": "Incorrect. Identical code formats do not mean identical content. Some classes were split, merged or redefined between versions.", "C": "Correct. Classification versions are structural metadata. Correspondence tables give the official mapping, and the conversion and any break must be documented.", "D": "Incorrect. Dropping records biases totals and loses information. Mapping, not deletion, is the standard approach."}, "source": "Eurostat, RAMON / Classifications server; Commission Delegated Regulation (EU) 2023/137 (NACE Rev. 2.1)"}, {"id": "B3-009", "block": 3, "topic": "Metadata: Eurostat flags", "difficulty": "easy", "question": "In Eurostat's online database, a cell shows no value and carries the flag 'c'. What does this mean?", "options": {"A": "The value is corrected after a revision", "B": "The value is not available because the country did not collect it", "C": "The value is confidential and has not been disseminated", "D": "The value is calculated by Eurostat"}, "answer": "C", "explanations": {"A": "Incorrect. Revisions are not flagged with 'c'. The flag signals confidentiality.", "B": "Incorrect. Missing values are shown with ':' (not available). 'c' specifically indicates confidentiality.", "C": "Correct. The flag 'c' marks confidential data that are withheld to protect statistical units.", "D": "Incorrect. The 'c' flag does not stand for a calculation by Eurostat."}, "source": "Eurostat, Database guide: codes and flags"}, {"id": "B3-010", "block": 3, "topic": "Metadata: SDMX", "difficulty": "hard", "question": "A national authority transmits quarterly data to Eurostat using SDMX. Eurostat changes the code list for one dimension by adding two new codes, while existing codes keep their meaning. What is the best practice regarding the code list?", "options": {"A": "Overwrite the existing code list without changing the version number, so all users see the new codes", "B": "Delete the dimension and move the new codes into a free-text attribute", "C": "Issue a new version of the code list and reference it in the structures, so earlier messages remain valid", "D": "Ask each reporting country to define its own local codes for the new categories and send them separately"}, "answer": "C", "explanations": {"A": "Incorrect. Silent changes break reproducibility and validation of earlier transmissions. Versioning exists to avoid exactly this.", "B": "Incorrect. Free text cannot be validated and the dimension would no longer identify observations consistently.", "C": "Correct. SDMX artefacts are versioned. A new version preserves the validity of data already exchanged with the previous structure and makes the change traceable.", "D": "Incorrect. Local codes defeat the purpose of a common code list and harm comparability."}, "source": "SDMX 3.0 Technical Standards, versioning of structural metadata"}, {"id": "B3-011", "block": 3, "topic": "Data governance: roles", "difficulty": "medium", "question": "In a data governance framework, who is typically responsible for defining the business meaning of a dataset, its quality rules and who may access it, while the IT team runs the storage and backups?", "options": {"A": "The external software vendor of the database", "B": "Any end user who downloads the dataset", "C": "The data custodian, because it hosts the data and controls the infrastructure it runs on", "D": "The data owner, supported by a data steward who applies the rules day to day"}, "answer": "D", "explanations": {"A": "Incorrect. A vendor supplies tools. It is not accountable for the institution's data.", "B": "Incorrect. Users consume data. Accountability for definitions and access must be clearly assigned to designated roles.", "C": "Incorrect. The custodian manages the technical environment (storage, backups, security controls) but does not decide on business meaning or access.", "D": "Correct. Data owners are accountable for a dataset (meaning, access, quality). Data stewards implement and monitor these rules, while custodians or IT handle the technical operation."}, "source": "European Commission, Data governance and data policies at the European Commission (2020); DAMA-DMBOK"}, {"id": "B3-012", "block": 3, "topic": "Data governance: FAIR", "difficulty": "easy", "question": "What do the FAIR principles for scientific data management stand for?", "options": {"A": "Formatted, Archived, Indexed, Released", "B": "Fair, Accurate, Independent, Relevant", "C": "Free, Anonymous, Integrated, Reliable", "D": "Findable, Accessible, Interoperable, Reusable"}, "answer": "D", "explanations": {"A": "Incorrect. These are generic data handling steps, not the FAIR principles.", "B": "Incorrect. Accuracy and relevance are statistical quality criteria, not the FAIR acronym.", "C": "Incorrect. FAIR does not require data to be free or anonymous. Access can be restricted while the metadata stay findable.", "D": "Correct. FAIR data are Findable, Accessible, Interoperable and Reusable, with emphasis on machine-actionable metadata."}, "source": "Wilkinson et al. (2016), The FAIR Guiding Principles, Scientific Data 3:160018"}, {"id": "B3-013", "block": 3, "topic": "Data governance: lineage", "difficulty": "medium", "question": "A published indicator changes unexpectedly after a pipeline update. Which governance capability lets the team trace which source tables and transformations produced the published figure?", "options": {"A": "Role-based access control", "B": "A business glossary only", "C": "Data lineage documentation", "D": "A data retention schedule"}, "answer": "C", "explanations": {"A": "Incorrect. Access control determines who can see or change data. It does not document derivations.", "B": "Incorrect. A glossary defines terms but does not trace the technical flow from sources to outputs.", "C": "Correct. Lineage records where data come from and which transformations they went through, enabling impact analysis and root-cause tracing.", "D": "Incorrect. Retention schedules decide how long data are kept, not how a figure was derived."}, "source": "DAMA-DMBOK, metadata management and data lineage"}, {"id": "B3-014", "block": 3, "topic": "Data governance: EU open data", "difficulty": "medium", "question": "Under Directive (EU) 2019/1024 (Open Data Directive), which of the following is one of the thematic categories of 'high-value datasets'?", "options": {"A": "Personnel files of public bodies", "B": "Statistics", "C": "Health records of patients", "D": "Classified information"}, "answer": "B", "explanations": {"A": "Incorrect. Personal data in personnel files are not a high-value dataset category and would be subject to data protection rules.", "B": "Correct. The Directive's Annex I lists six categories: geospatial, earth observation and environment, meteorological, statistics, companies and company ownership, and mobility.", "C": "Incorrect. Individual health records are special category personal data, not a high-value dataset category.", "D": "Incorrect. Classified information is excluded from re-use obligations."}, "source": "Directive (EU) 2019/1024, Article 13 and Annex I; Implementing Regulation (EU) 2023/138"}, {"id": "B3-015", "block": 3, "topic": "Data governance: Data Governance Act", "difficulty": "hard", "question": "A public sector body holds business microdata protected by statistical confidentiality. A researcher requests re-use under the Data Governance Act (Regulation (EU) 2022/868). Which statement is correct?", "options": {"A": "The researcher may receive the raw microdata if they sign a non-disclosure agreement, with no other conditions", "B": "The DGA obliges the body to publish the microdata as open data", "C": "Statistically confidential data are entirely outside the scope of the DGA, since only Regulation 223/2009 and national law govern them", "D": "It may allow re-use under conditions preserving the data's protection, e.g. anonymisation or a secure processing environment"}, "answer": "D", "explanations": {"A": "Incorrect. An NDA alone does not satisfy the DGA's conditions. The protected nature must be preserved through technical and legal safeguards.", "B": "Incorrect. The DGA does not create an obligation to allow re-use, and it certainly does not require protected data to be published openly.", "C": "Incorrect. Statistical confidentiality is expressly one of the grounds of protection listed for data falling under Chapter II.", "D": "Correct. Chapter II of the DGA covers data protected on grounds including statistical confidentiality and lets public sector bodies impose conditions such as anonymisation, modification or remote or on-premises secure processing."}, "source": "Regulation (EU) 2022/868, Articles 3 and 5"}, {"id": "B3-016", "block": 3, "topic": "Data governance: data quality", "difficulty": "medium", "question": "A team receives a monthly file in which 'country' is sometimes 'DE', sometimes 'Germany' and sometimes 'GER'. Which governance measure addresses the root cause rather than the symptom?", "options": {"A": "Deleting rows with non-standard values", "B": "Storing the column as free text so all values are accepted", "C": "Manually correcting the values each month before publication, using a shared lookup spreadsheet", "D": "Agree a reference code list (e.g. ISO 3166) and validate files against it on arrival"}, "answer": "D", "explanations": {"A": "Incorrect. Deleting rows loses data and biases results.", "B": "Incorrect. This makes the problem worse because no validation is possible.", "C": "Incorrect. Manual correction treats the symptom, is error-prone and must be repeated every month.", "D": "Correct. A shared reference list plus automated validation prevents inconsistent values from entering the system in the first place."}, "source": "DAMA-DMBOK, reference and master data management"}, {"id": "B3-017", "block": 3, "topic": "Data governance: master data", "difficulty": "hard", "question": "Two directorates maintain separate lists of the same external organisations with different identifiers, causing double counting in a combined report. Which approach is most appropriate?", "options": {"A": "Let each directorate keep its list and sum both reports", "B": "Match organisations on their names only and merge the two lists automatically into one", "C": "Keep only the longer list and discard the other", "D": "Set up master data management with one authoritative identifier per organisation"}, "answer": "D", "explanations": {"A": "Incorrect. Summing reports keeps the duplicates, which is exactly the double-counting problem.", "B": "Incorrect. Name-only matching produces false matches and misses spelling variants. It needs controlled identifiers and review.", "C": "Incorrect. The longer list is not necessarily more accurate. Records unique to the shorter list would be lost.", "D": "Correct. Master data management creates a 'golden record' and maps local identifiers to it, which resolves duplicates without breaking existing systems."}, "source": "DAMA-DMBOK, master data management"}, {"id": "B3-018", "block": 3, "topic": "Data governance: documentation", "difficulty": "easy", "question": "A dataset is shared with another unit. Which document best helps the receiving unit understand each variable's name, definition, type and allowed values?", "options": {"A": "A data dictionary", "B": "A service level agreement", "C": "An incident report", "D": "A release calendar"}, "answer": "A", "explanations": {"A": "Correct. A data dictionary lists variables with their definitions, types, formats and valid values.", "B": "Incorrect. An SLA sets service commitments such as availability, not variable definitions.", "C": "Incorrect. Incident reports describe security or operational events.", "D": "Incorrect. A release calendar announces publication dates."}, "source": "DAMA-DMBOK, metadata management"}, {"id": "B3-019", "block": 3, "topic": "Data protection: supervision", "difficulty": "easy", "question": "Which body supervises the application of Regulation (EU) 2018/1725 to the processing of personal data by Eurostat?", "options": {"A": "The European Data Protection Supervisor (EDPS)", "B": "The European Data Protection Board (EDPB)", "C": "The Luxembourg national data protection authority", "D": "The European Ombudsman"}, "answer": "A", "explanations": {"A": "Correct. The EDPS is the independent supervisory authority for Union institutions, bodies, offices and agencies under Regulation 2018/1725.", "B": "Incorrect. The EDPB ensures consistent application of the GDPR and issues guidelines. It is not the supervisor of EU institutions.", "C": "Incorrect. National authorities supervise the GDPR in their Member State. EU institutions, including Eurostat, fall under the EDPS.", "D": "Incorrect. The Ombudsman handles maladministration complaints. Data protection supervision belongs to the EDPS."}, "source": "Regulation (EU) 2018/1725, Articles 52 and 57"}, {"id": "B3-020", "block": 3, "topic": "Data protection: lawful basis", "difficulty": "hard", "question": "An EU agency's contractor proposes basing a new analytics processing of personal data on 'legitimate interests', as private companies do under the GDPR. What is the correct assessment?", "options": {"A": "No lawful basis is needed if the data are only used internally", "B": "Legitimate interests is not a lawful basis under Regulation 2018/1725; a public interest task is normally used", "C": "Consent is always the preferred basis for EU institutions", "D": "Legitimate interests is available, provided that the agency documents a balancing test weighing its interests against the data subjects' rights"}, "answer": "B", "explanations": {"A": "Incorrect. Every processing of personal data needs a lawful basis, whether internal or not.", "B": "Correct. Article 5(1) of Regulation 2018/1725 lists public interest task, legal obligation, contract, consent and vital interests. Legitimate interests is not among them.", "C": "Incorrect. Consent is possible but often inappropriate where there is an imbalance of power. Most EUI processing relies on a public interest task.", "D": "Incorrect. Unlike Article 6(1)(f) GDPR, Regulation 2018/1725 contains no legitimate interests ground, so no balancing test can create one."}, "source": "Regulation (EU) 2018/1725, Article 5(1)"}, {"id": "B3-021", "block": 3, "topic": "Data protection: statistical purposes", "difficulty": "medium", "question": "A Commission unit wants to reuse personal data collected for managing a grant programme to produce aggregate statistics on beneficiaries. Under Regulation 2018/1725, how is this further processing treated?", "options": {"A": "It is allowed only after fresh, specific consent is obtained from every beneficiary whose data would be reused", "B": "It is allowed without any safeguards because statistics are in the public interest", "C": "It is always prohibited because the data were collected for another purpose", "D": "It is not considered incompatible, provided appropriate safeguards such as pseudonymisation apply"}, "answer": "D", "explanations": {"A": "Incorrect. Fresh consent is not required for compatible further processing for statistical purposes.", "B": "Incorrect. Compatibility depends on appropriate safeguards being in place.", "C": "Incorrect. The Regulation expressly treats statistical further processing as compatible, subject to safeguards.", "D": "Correct. Article 4(1)(b) states that further processing for statistical purposes is not incompatible, in accordance with the safeguards of Article 13 (e.g. data minimisation, pseudonymisation)."}, "source": "Regulation (EU) 2018/1725, Articles 4(1)(b) and 13"}, {"id": "B3-022", "block": 3, "topic": "Data protection: breach", "difficulty": "medium", "question": "An EU institution discovers that a file with the names and salaries of 300 staff members was e-mailed to an external address by mistake. Under Regulation 2018/1725, what must the controller do?", "options": {"A": "Inform only the DPO, since external notification is reserved for classified information and security incidents affecting IT systems", "B": "Notify the national data protection authority of the recipient's country", "C": "Notify the EDPS within 30 days, and only if the recipient misused the data", "D": "Notify the EDPS within 72 hours where feasible, unless risk is unlikely; tell staff without undue delay if risk is high"}, "answer": "D", "explanations": {"A": "Incorrect. The DPO should be informed, but personal data breaches must be notified to the EDPS. This has nothing to do with classification.", "B": "Incorrect. For EU institutions the competent authority is the EDPS.", "C": "Incorrect. The deadline is 72 hours where feasible, and the duty depends on risk, not on proven misuse.", "D": "Correct. Article 34 sets the 72-hour notification to the EDPS. Article 35 requires communication to data subjects when the breach is likely to result in a high risk."}, "source": "Regulation (EU) 2018/1725, Articles 34 and 35"}, {"id": "B3-023", "block": 3, "topic": "Data protection: pseudonymisation", "difficulty": "medium", "question": "A dataset replaces staff names with random codes, and the key linking codes to names is kept by another unit. Under EU data protection law, how is this dataset classified?", "options": {"A": "Special category data, because codes are used", "B": "Anonymous data, as long as the key is stored in another building under the control of a different unit", "C": "Anonymous data, outside the scope of data protection law", "D": "Still personal data, because the individuals can be re-identified using additional information"}, "answer": "D", "explanations": {"A": "Incorrect. Special categories depend on content (health, ethnicity, etc.), not on the use of codes.", "B": "Incorrect. Physical separation of the key is a good safeguard but does not make the data anonymous.", "C": "Incorrect. Data are anonymous only if individuals can no longer be identified by any means reasonably likely to be used. A key exists here.", "D": "Correct. Pseudonymised data remain personal data. Pseudonymisation reduces risk but does not take data outside the scope of data protection law."}, "source": "Regulation (EU) 2018/1725, Article 3(6) and Recital 16; GDPR Article 4(5) and Recital 26"}, {"id": "B3-024", "block": 3, "topic": "Data protection: DPO", "difficulty": "medium", "question": "Which statement about the Data Protection Officer (DPO) of an EU institution under Regulation 2018/1725 is correct?", "options": {"A": "The DPO acts independently and cannot be dismissed or penalised for performi
