s": {"A": "Some systems allow this as an extension, but in standard SQL an alias defined in SELECT is not visible in WHERE.", "B": "The logical order of processing is FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY. Column aliases can be used in ORDER BY but not in WHERE. The fix is to repeat the expression: WHERE amount * 1.2 > 100.", "C": "SQL does not silently ignore an invalid clause. The query fails.", "D": "Expressions in SELECT are allowed. The problem is the use of the alias in WHERE."}, "source": "EPSO/AST/158/26 Annex: data processing, analytics and statistics duties; SQL query processing order"}, {"id": "B4-042", "block": 4, "topic": "SQL", "difficulty": "medium", "question": "Table staff has 6 rows: 4 in department 'A' and 2 in department 'B'. How many rows does this query return?\n\nSELECT dept, salary, AVG(salary) OVER (PARTITION BY dept) AS dept_avg\nFROM staff;", "options": {"A": "2 rows, one per department", "B": "6 rows, each showing its department's average salary", "C": "1 row with the overall average", "D": "None: it fails because salary is not in a GROUP BY clause"}, "answer": "B", "explanations": {"A": "That would be GROUP BY dept. PARTITION BY in a window function keeps every row.", "B": "A window function does not collapse rows. Each row keeps its own salary and gets the average of its partition.", "C": "PARTITION BY dept computes a separate average for each department, and every row is kept.", "D": "There is no GROUP BY here. Window functions can be combined with ordinary columns."}, "source": "EPSO/AST/158/26 Annex: data processing, analytics and statistics duties; SQL window functions"}, {"id": "B4-043", "block": 4, "topic": "SQL", "difficulty": "easy", "question": "Table a has column x with values 1, 2, 2. Table b has column x with values 2, 3. How many rows does each of these return?\n\n(1) SELECT x FROM a UNION SELECT x FROM b;\n(2) SELECT x FROM a UNION ALL SELECT x FROM b;", "options": {"A": "(1) 4 rows; (2) 5 rows", "B": "(1) 5 rows; (2) 3 rows", "C": "(1) 3 rows; (2) 5 rows", "D": "(1) 3 rows; (2) 4 rows"}, "answer": "C", "explanations": {"A": "UNION removes all duplicates, not only those appearing in both tables. 2 appears once in the result.", "B": "This reverses the two operators. UNION ALL is the one that keeps duplicates.", "C": "UNION removes duplicates, including those within a table, leaving 1, 2, 3. UNION ALL keeps all 3 + 2 = 5 rows.", "D": "UNION ALL does not remove anything, so it returns all 5 rows."}, "source": "EPSO/AST/158/26 Annex: data processing, analytics and statistics duties; SQL set operations"}, {"id": "B4-044", "block": 4, "topic": "Python (pandas)", "difficulty": "medium", "question": "import pandas as pd, numpy as np\ndf = pd.DataFrame({'unit': ['A', 'B', 'A', 'B', 'C'],\n                   'cases': [4, 7, 6, np.nan, 5]})\nprint(df.groupby('unit')['cases'].mean())\n\nWhat values are shown for A, B and C?", "options": {"A": "A 5.0, B 3.5, C 5.0", "B": "A 5.0, B 7.0, C 5.0", "C": "A 10.0, B 7.0, C 5.0", "D": "A 5.0, B NaN, C 5.0"}, "answer": "B", "explanations": {"A": "This treats NaN as 0. pandas excludes missing values from the mean instead.", "B": "pandas skips NaN by default (skipna=True). B's mean uses only the value 7.", "C": "These are the group sums, not the means.", "D": "B's mean would be NaN only if all its values were missing or skipna=False were used."}, "source": "Python Data Science Handbook (VanderPlas), ch. 3 (Aggregation and grouping)"}, {"id": "B4-045", "block": 4, "topic": "Python (pandas)", "difficulty": "hard", "question": "import pandas as pd\ns = pd.Series([10, 20, 30, 40, 50], index=[1, 2, 3, 4, 5])\nprint(s.loc[2:4].sum(), s.iloc[2:4].sum())\n\nWhat is printed?", "options": {"A": "70 90", "B": "90 90", "C": "90 70", "D": "50 70"}, "answer": "C", "explanations": {"A": "This reverses the two. .loc is label-based and inclusive; .iloc is position-based and exclusive.", "B": ".iloc[2:4] uses positions 2 and 3 (values 30 and 40) only, giving 70.", "C": ".loc slices by label and includes the end label: 20 + 30 + 40 = 90. .iloc slices by position and excludes the end: positions 2 and 3 are 30 + 40 = 70.", "D": ".loc[2:4] includes labels 2, 3 and 4, giving 90."}, "source": "Python Data Science Handbook (VanderPlas), ch. 3 (Data indexing and selection)"}, {"id": "B4-046", "block": 4, "topic": "Python (pandas)", "difficulty": "medium", "question": "import pandas as pd\ns = pd.Series(['x', 'y', 'x', None, 'x'])\nprint(s.value_counts(normalize=True)['x'])\n\nWhat is printed?", "options": {"A": "0.6", "B": "0.75", "C": "3", "D": "0.8"}, "answer": "B", "explanations": {"A": "3/5 would count the missing value in the denominator, which happens only with dropna=False.", "B": "value_counts drops missing values by default (dropna=True), so the shares are computed over 4 values: 3/4 = 0.75.", "C": "With normalize=True the result is a share, not a count.", "D": "There are 3 'x' values among 4 non-missing values, giving 0.75."}, "source": "Python Data Science Handbook (VanderPlas), ch. 3 (Handling missing data)"}, {"id": "B4-047", "block": 4, "topic": "Python (pandas)", "difficulty": "medium", "question": "import pandas as pd\ndf = pd.DataFrame({'region': ['N', 'N', 'S', 'N'],\n                   'year': [2023, 2024, 2023, 2023],\n                   'value': [10, 12, 7, 5]})\np = pd.pivot_table(df, index='region', columns='year', values='value', aggfunc='sum')\nprint(p.loc['S', 2024], p.loc['N', 2023])\n\nWhat is printed?", "options": {"A": "0 15", "B": "nan 10.0", "C": "0 7.5", "D": "nan 15.0"}, "answer": "D", "explanations": {"A": "Missing combinations are NaN unless fill_value=0 is passed.", "B": "aggfunc='sum' adds both N/2023 rows (10 and 5).", "C": "7.5 would be the mean of 10 and 5, but aggfunc='sum' is used, and the missing cell is NaN, not 0.", "D": "S has no row for 2024, so that cell is NaN (fill_value is not set). N has two 2023 rows: 10 + 5 = 15. The column is float because it contains NaN."}, "source": "Python Data Science Handbook (VanderPlas), ch. 3 (Pivot tables)"}, {"id": "B4-048", "block": 4, "topic": "Python (pandas)", "difficulty": "medium", "question": "import pandas as pd\ns = pd.Series([1, 2, None])\nprint(s.dtype, s.sum())\n\nWhat is printed?", "options": {"A": "int64 3", "B": "float64 nan", "C": "float64 3.0", "D": "object 3"}, "answer": "C", "explanations": {"A": "The default int64 type cannot hold NaN, so pandas upcasts the series to float64.", "B": "pandas' sum() skips NaN by default (skipna=True).", "C": "None becomes NaN, and NaN is a float, so the integers are upcast to float64. sum() skips NaN: 1.0 + 2.0 = 3.0.", "D": "Numbers combined with None are converted to float64, not object."}, "source": "Python Data Science Handbook (VanderPlas), ch. 3 (Handling missing data)"}, {"id": "B4-049", "block": 4, "topic": "Python (pandas)", "difficulty": "hard", "question": "An analyst writes df[df['a'] > 2 & df['b'] < 5] to filter a DataFrame with numeric columns a and b, and gets a ValueError ('The truth value of a Series is ambiguous'). Why?", "options": {"A": "pandas does not support combining conditions; two separate filters must be applied.", "B": "The keyword and must be used instead of &, because & only works on integers.", "C": "& binds more tightly than > and <; each condition needs parentheses.", "D": "Column names must be accessed with df.a, not df['a'], in filters."}, "answer": "C", "explanations": {"A": "Conditions can be combined with &, | and ~ as long as each one is in parentheses.", "B": "and needs single True/False values and raises the same error on Series. Element-wise logic uses &.", "C": "Python evaluates 2 & df['b'] first, so the expression becomes a chained comparison involving Series, which needs a single True/False value and raises the error. Correct form: df[(df['a'] > 2) & (df['b'] < 5)].", "D": "Both forms of column access work. The problem is operator precedence."}, "source": "Python Data Science Handbook (VanderPlas), ch. 2 (Comparisons, masks and Boolean logic)"}, {"id": "B4-050", "block": 4, "topic": "Python (pandas)", "difficulty": "medium", "question": "import pandas as pd\ns = pd.Series([200, 250, 200])\nprint(s.pct_change().round(2).tolist())\n\nWhat is printed?", "options": {"A": "[nan, 0.25, -0.25]", "B": "[0.0, 0.25, -0.2]", "C": "[nan, 50.0, -50.0]", "D": "[nan, 0.25, -0.2]"}, "answer": "D", "explanations": {"A": "The fall is measured against the previous value of 250, so it is −50/250 = −0.20.", "B": "The first value is NaN, not 0, because there is nothing to compare it with.", "C": "These are the absolute differences, which s.diff() would return.", "D": "pct_change computes value/previous − 1: 250/200 − 1 = 0.25 and 200/250 − 1 = −0.20. The first element has no previous value."}, "source": "Python Data Science Handbook (VanderPlas), ch. 3 (Working with time series)"}, {"id": "B4-051", "block": 4, "topic": "Python (pandas)", "difficulty": "medium", "question": "import pandas as pd\ndf = pd.DataFrame({'id': [1, 1, 2, 2, 3], 'v': [5, 6, 7, 7, 8]})\nprint(df.drop_duplicates(subset='id', keep='last')['v'].sum())\n\nWhat is printed?", "options": {"A": "21", "B": "20", "C": "26", "D": "33"}, "answer": "A", "explanations": {"A": "One row per id is kept, the last one: id 1 → 6, id 2 → 7, id 3 → 8. 6 + 7 + 8 = 21.", "B": "This keeps the first row per id (5 + 7 + 8), which is keep='first'.", "C": "This removes only fully identical rows (the second (2, 7)). With subset='id', rows are compared on id only.", "D": "This is the sum of all rows, with no duplicates removed."}, "source": "Python Data Science Handbook (VanderPlas), ch. 3 (Data manipulation with pandas)"}, {"id": "B4-052", "block": 4, "topic": "R (dplyr)", "difficulty": "medium", "question": "library(dplyr)\ndf <- tibble(id = 1:5, score = c(10, NA, 30, 40, NA))\ndf %>% filter(score > 15) %>% nrow()\n\nWhat is returned?", "options": {"A": "4", "B": "3", "C": "An error, because score contains NA", "D": "2"}, "answer": "D", "explanations": {"A": "filter() does not keep NA rows. They would be kept only with an explicit is.na(score) condition.", "B": "Neither NA row is kept, and 10 does not exceed 15, leaving 2 rows.", "C": "filter() handles NA without an error: it treats a missing condition as not TRUE and drops the row.", "D": "Only the rows with 30 and 40 meet the condition. For NA, score > 15 is NA, and filter() drops rows where the condition is not TRUE."}, "source": "R for Data Science (2nd ed.), ch. 3 (Data transformation)"}, {"id": "B4-053", "block": 4, "topic": "R (dplyr)", "difficulty": "easy", "question": "library(dplyr)\ndf <- tibble(dept = c('A', 'B', 'A', 'C', 'A'), cost = c(5, 3, 7, 2, 6))\ndf %>% group_by(dept) %>% summarise(n = n(), total = sum(cost)) %>% filter(n > 1)\n\nWhat is the result?", "options": {"A": "One row: dept A, n = 3, total = 18", "B": "Three rows, one per department", "C": "One row: dept A, n = 3, total = 6", "D": "Two rows: A (3, 18) and B (1, 3)"}, "answer": "A", "explanations": {"A": "A has three rows (5 + 7 + 6 = 18). B and C have one row each and are removed by filter(n > 1).", "B": "filter(n > 1) runs after summarise and removes B and C.", "C": "6 is the mean cost of A. sum() gives 18.", "D": "B has n = 1, which does not satisfy n > 1."}, "source": "R for Data Science (2nd ed.), ch. 3 (Data transformation)"}, {"id": "B4-054", "block": 4, "topic": "R (dplyr)", "difficulty": "medium", "question": "library(dplyr)\ndf <- tibble(g = c('x', 'x', 'y'), value = c(1, 3, 4))\ndf %>% group_by(g) %>% mutate(share = value / sum(value)) %>% pull(share)\n\nWhat is returned?", "options": {"A": "0.125 0.375 0.500", "B": "0.25 0.75 0.50", "C": "0.25 0.75 1.00", "D": "An error, because mutate cannot be used after group_by"}, "answer": "C", "explanations": {"A": "This divides by the overall total of 8. Inside a grouped mutate, sum() works per group.", "B": "y is a group on its own, so its share is 4/4 = 1.", "C": "After group_by, sum(value) is computed within each group: x gives 1/4 and 3/4, and y gives 4/4.", "D": "mutate works with grouped data and computes summaries within each group, keeping all rows."}, "source": "R for Data Science (2nd ed.), ch. 3 (Data transformation: groups)"}, {"id": "B4-055", "block": 4, "topic": "R (dplyr)", "difficulty": "medium", "question": "library(dplyr)\nx <- tibble(id = c(1, 2, 3))\ny <- tibble(id = c(3, 3, 4), v = c('p', 'q', 'r'))\nnrow(left_join(x, y, by = 'id'))\n\nWhat is returned?", "options": {"A": "4", "B": "3", "C": "2", "D": "5"}, "answer": "A", "explanations": {"A": "Ids 1 and 2 are kept with v = NA (2 rows). Id 3 matches two rows in y (2 rows). Id 4 exists only in y and is dropped. 2 + 2 = 4.", "B": "A left join can return more rows than x when keys are duplicated in y. Id 3 appears twice.", "C": "A left join keeps every row of x, including ids 1 and 2 with no match.", "D": "Id 4 is only in y. A left join does not add rows from y that have no match in x."}, "source": "R for Data Science (2nd ed.), ch. 19 (Joins)"}, {"id": "B4-056", "block": 4, "topic": "R (dplyr)", "difficulty": "hard", "question": "library(dplyr)\nx <- c(10, 20, 75, NA)\ncase_when(x >= 50 ~ 'high', x >= 20 ~ 'mid', TRUE ~ 'low')\n\nWhat is returned?", "options": {"A": "\"low\" \"mid\" \"high\" NA", "B": "\"low\" \"mid\" \"high\" \"low\"", "C": "\"low\" \"low\" \"high\" NA", "D": "\"low\" \"mid\" \"mid\" \"low\""}, "answer": "B", "explanations": {"A": "case_when treats NA conditions as not met and moves on, so the final TRUE branch assigns 'low'. To keep NA, add is.na(x) ~ NA first.", "B": "Conditions are checked in order, and the first TRUE one wins. For NA, both comparisons are NA (not TRUE), so the catch-all TRUE ~ 'low' applies.", "C": "20 >= 20 is TRUE, so 20 is 'mid'.", "D": "75 meets the first condition (>= 50), so it is 'high'. Only the first matching branch applies."}, "source": "R for Data Science (2nd ed.), ch. 12 (Logical vectors)"}, {"id": "B4-057", "block": 4, "topic": "R (base)", "difficulty": "easy", "question": "x <- c(4, 8, 15)\nsum(x[-1])\n\nWhat does R return?", "options": {"A": "23", "B": "12", "C": "27", "D": "15"}, "answer": "A", "explanations": {"A": "In R a negative index removes that element. x[-1] drops the first element, leaving 8 and 15, which sum to 23.", "B": "This drops the last element. In R, x[-1] removes the first element, not the last (unlike Python's x[-1]).", "C": "This is the sum of all elements. The negative index removes the first one.", "D": "That is x[3], the last element. x[-1] is the vector without the first element."}, "source": "R for Data Science (2nd ed.), ch. 27 (A field guide to base R)"}, {"id": "B4-058", "block": 4, "topic": "Machine learning", "difficulty": "medium", "question": "A classification model reaches 99% accuracy on its training data but only 72% on a validation set drawn from the same population. What is the most likely diagnosis and remedy?", "options": {"A": "Overfitting; simplify the model, add regularisation or get more training data.", "B": "Underfitting; add more features and complexity.", "C": "Data leakage; the validation score is too high.", "D": "The model is fine; validation scores are always much lower than training scores."}, "answer": "A", "explanations": {"A": "A large gap between training and validation performance shows that the model has learned noise specific to the training data.", "B": "An underfitted model performs poorly on the training data too. Here training accuracy is very high.", "C": "Leakage typically makes validation scores look too good. Here the validation score is the low one.", "D": "Some gap is normal, but 27 points indicates poor generalisation."}, "source": "EPSO/AST/158/26 Annex: data processing, analytics and statistics duties; Python Data Science Handbook (VanderPlas), ch. 5 (Hyperparameters and model validation)"}, {"id": "B4-059", "block": 4, "topic": "Machine learning", "difficulty": "hard", "question": "A classifier produces TP = 40, FP = 10 and FN = 40. What is its F1 score, to two decimals?", "options": {"A": "0.65", "B": "0.62", "C": "0.50", "D": "0.80"}, "answer": "B", "explanations": {"A": "This is the arithmetic mean of precision and recall. F1 is the harmonic mean, which is pulled towards the lower value.", "B": "Precision = 40/50 = 0.80 and recall = 40/80 = 0.50. F1 = 2 × 0.8 × 0.5/(0.8 + 0.5) = 0.8/1.3 ≈ 0.62.", "C": "0.50 is the recall.", "D": "0.80 is the precision."}, "source": "EPSO/AST/158/26 Annex: data processing, analytics and statistics duties; Python Data Science Handbook (VanderPlas), ch. 5 (Model evaluation)"}, {"id": "B4-060", "block": 4, "topic": "Machine learning", "difficulty": "medium", "question": "In a dataset of claims, 2% are fraudulent. A model that labels every claim as 'not fraud' is evaluated. Which statement is correct?", "options": {"A": "Its 98% accuracy shows it is a strong model that can be deployed as it is.", "B": "It has 98% accuracy but 0% recall for fraud.", "C": "Its precision for fraud is 100% because it makes no false positives.", "D": "Its accuracy is only 2%, because it misses every single fraud case in the data."}, "answer": "B", "explanations": {"A": "Any model can reach 98% by always predicting the majority class, which has no practical value.", "B": "Predicting the majority class gets 98% right but finds no fraud, so accuracy is misleading on imbalanced data. Recall, precision, F1 or PR-AUC are more informative here.", "C": "With no positive predictions, precision is undefined (0/0), not 100%.", "D": "Accuracy counts all correct predictions, including the 98% of correct 'not fraud' labels."}, "source": "EPSO/AST/158/26 Annex: data processing, analytics and statistics duties; Python Data Science Handbook (VanderPlas), ch. 5 (Model evaluation)"}, {"id": "B4-061", "block": 4, "topic": "Machine learning", "difficulty": "medium", "question": "An analyst runs 5-fold cross-validation on a dataset of 1,000 rows. Which statement is correct?", "options": {"A": "Five models are trained on 800 rows each; every row is validated once.", "B": "One model is trained on 800 rows and tested five times on the same 200 rows.", "C": "Five models are trained, each on 200 rows and validated on 800.", "D": "The reported final score is the best of the five validation scores obtained."}, "answer": "A", "explanations": {"A": "The data is split into 5 folds of 200. Each fold serves once as the validation set while the other 4 folds (800 rows) are used for training.", "B": "That repeats a single hold-out split. Cross-validation rotates the validation fold.", "C": "The roles are reversed. Training uses k − 1 folds, here 800 rows.", "D": "The usual summary is the average (and spread) of the fold scores. Picking the best is optimistic."}, "source": "Python Data Science Handbook (VanderPlas), ch. 5 (Hyperparameters and model validation)"}, {"id": "B4-062", "block": 4, "topic": "Machine learning", "difficulty": "medium", "question": "An analyst wants to forecast monthly import volumes from five years of monthly data and evaluate the model with ordinary shuffled k-fold cross-validation. What is the main problem?", "options": {"A": "k-fold cross-validation cannot be used at all when the target is a numeric quantity.", "B": "Five years of monthly data is too little for any kind of validation to work.", "C": "Shuffling lets future months inform predictions of past ones.", "D": "Shuffling makes the folds too similar, so scores are too pessimistic."}, "answer": "C", "explanations": {"A": "Cross-validation works for regression as well as classification. The issue is the time order.", "B": "60 observations allow time-ordered validation. The problem is how the data is split, not how much there is.", "C": "Shuffled folds leak future information into training. For time series, validation data must come after the training data (a time-ordered or rolling-origin split) to mimic real forecasting.", "D": "Leakage of future information usually makes scores too optimistic, not pessimistic."}, "source": "EPSO/AST/158/26 Annex: data processing, analytics and statistics duties; Python Data Science Handbook (VanderPlas), ch. 5 (Model validation)"}, {"id": "B4-063", "block": 4, "topic": "Machine learning", "difficulty": "medium", "question": "In ridge regression, the regularisation strength λ is increased. What is the expected effect?", "options": {"A": "Coefficients shrink, but bias decreases and variance increases.", "B": "Coefficients grow, so the model fits the training data better.", "C": "Several coefficients are set exactly to zero, as in variable selection.", "D": "Coefficients shrink; bias rises and variance falls."}, "answer": "D", "explanations": {"A": "This is the effect of reducing λ, which makes the model more flexible.", "B": "The penalty shrinks coefficients. Training fit usually gets worse as λ grows.", "C": "Exact zeros are typical of the lasso (L1 penalty). Ridge (L2) shrinks coefficients but rarely makes them exactly zero.", "D": "A larger penalty constrains the coefficients, making the model simpler: less sensitive to the sample (lower variance) but more systematically off (higher bias)."}, "source": "Python Data Science Handbook (VanderPlas), ch. 5 (Linear regression, regularisation)"}, {"id": "B4-064", "block": 4, "topic": "Machine learning", "difficulty": "medium", "question": "Which of the following tasks is an example of unsupervised learning?", "options": {"A": "Predicting whether a grant application will be approved, using past approved and rejected applications.", "B": "Grouping survey respondents into segments based on their answers, with no predefined categories.", "C": "Estimating next year's travel costs from past costs and staff numbers.", "D": "Training a spam filter on e-mails that staff have marked as spam or not spam."}, "answer": "B", "explanations": {"A": "Past outcomes are labels, so this is supervised classification.", "B": "Clustering (for example k-means) finds structure in data without a target variable, which makes it unsupervised.", "C": "A known numeric target is predicted, so this is supervised regression.", "D": "The marked e-mails are labelled examples, so this is supervised classification."}, "source": "Python Data Science Handbook (VanderPlas), ch. 5 (What is machine learning?)"}, {"id": "B4-065", "block": 4, "topic": "Machine learning", "difficulty": "hard", "question": "Two binary classifiers are compared on the same test set. Model P has ROC AUC = 0.85 and model Q has ROC AUC = 0.50. Which statement is correct?", "options": {"A": "P ranks a random positive above a random negative 85% of the time; Q is at chance level.", "B": "P classifies 85% of the test cases correctly, while Q classifies only 50% correctly.", "C": "Q is the worst possible model, because an AUC of 0.5 is the minimum.", "D": "P is better than Q at every possible classification threshold, by definition of AUC."}, "answer": "A", "explanations": {"A": "AUC is the probability that the model ranks a random positive above a random negative. 0.5 corresponds to random guessing.", "B": "AUC is not accuracy. It summarises ranking performance over all thresholds.", "C": "AUC can go below 0.5 (systematically wrong ranking). 0.5 is chance level, not the minimum.", "D": "A higher AUC does not guarantee that one ROC curve is above the other everywhere. The curves can cross."}, "source": "Python Data Science Handbook (VanderPlas), ch. 5 (Model evaluation)"}, {"id": "B5-001", "block": 5, "topic": "Chart selection", "difficulty": "easy", "question": "An analyst must show how the monthly unemployment rate of one Member State evolved over the last ten years. Which chart is most appropriate?", "options": {"A": "A radar chart with one spoke per year.", "B": "A stacked area chart with one layer per month.", "C": "A line chart with time on the horizontal axis.", "D": "A pie chart with one slice per year."}, "answer": "C", "explanations": {"A": "Incorrect. Radar charts distort trends because the eye compares areas and angles rather than positions on a common scale.", "B": "Incorrect. Stacking months would add rates together, which has no meaning, and hides the trend.", "C": "Correct. Line charts emphasise continuity and trend across an ordered time axis, which is exactly what a long monthly series needs.", "D": "Incorrect. Pie charts show parts of a whole at one moment; rates in different years do not add up to a meaningful total."}, "source": "General visualisation principles (Cleveland & McGill, Tufte, Few); Eurostat visualisation practice"}, {"id": "B5-002", "block": 5, "topic": "Chart selection", "difficulty": "medium", "question": "A unit must compare the 2025 GDP per capita (in PPS) of all 27 Member States so that readers can quickly see the ranking. Which design is best?", "options": {"A": "A word cloud where font size reflects the value.", "B": "A horizontal bar chart sorted from highest to lowest value.", "C": "A line chart connecting the countries in alphabetical order.", "D": "A pie chart with 27 slices ordered alphabetically."}, "answer": "B", "explanations": {"A": "Incorrect. Font size is a poor visual encoding; word length also distorts the perceived size.", "B": "Correct. Sorted horizontal bars give a common baseline for precise length comparison and leave room for 27 country labels.", "C": "Incorrect. Lines imply continuity between points; countries are unordered categories, so the line has no meaning.", "D": "Incorrect. GDP per capita values are not parts of a whole, and 27 slices are impossible to compare accurately."}, "source": "General visualisation principles (Cleveland & McGill, Tufte, Few); Eurostat visualisation practice"}, {"id": "B5-003", "block": 5, "topic": "Chart selection", "difficulty": "medium", "question": "An analyst wants to explore whether regional R&D expenditure (% of GDP) is associated with regional employment rates across 240 NUTS 2 regions. Which chart fits this purpose?", "options": {"A": "A line chart of both variables with regions on the horizontal axis.", "B": "A clustered bar chart with two bars per region.", "C": "A scatter plot with one point per region.", "D": "Two pie charts, one for each variable."}, "answer": "C", "explanations": {"A": "Incorrect. Regions are not an ordered axis, and two lines do not show how the variables co-vary.", "B": "Incorrect. 480 bars cannot show the relationship between the two variables; the reader would have to match pairs mentally.", "C": "Correct. A scatter plot displays the joint distribution of two quantitative variables and reveals direction, strength, clusters and outliers of an association.", "D": "Incorrect. Pie charts show composition, not association between variables."}, "source": "General visualisation principles (Cleveland & McGill, Tufte, Few); Eurostat visualisation practice"}, {"id": "B5-004", "block": 5, "topic": "Chart selection", "difficulty": "medium", "question": "A report must compare the distribution of hourly earnings (median, quartiles and outliers) across eight economic sectors. Which chart is most suitable?", "options": {"A": "A bar chart of the mean earnings per sector.", "B": "A pie chart of the total earnings paid in each of the eight sectors.", "C": "A single histogram pooling all sectors.", "D": "Box plots, one per sector, on a common scale."}, "answer": "D", "explanations": {"A": "Incorrect. A single mean hides spread and skewness, and is pulled by outliers.", "B": "Incorrect. Totals by sector say nothing about the distribution of individual hourly earnings.", "C": "Incorrect. Pooling the data removes the sector comparison the report requires.", "D": "Correct. Box plots summarise median, interquartile range and outliers and allow side-by-side comparison of several distributions."}, "source": "General visualisation principles (Cleveland & McGill, Tufte, Few); Eurostat visualisation practice"}, {"id": "B5-005", "block": 5, "topic": "Chart selection", "difficulty": "hard", "question": "An analyst must show the share of renewable energy in gross final energy consumption for 2015 and 2024 for each of 27 countries, highlighting the change. Which chart communicates the change most directly?", "options": {"A": "A dumbbell dot plot: two connected dots per country on one axis.", "B": "A 3D clustered column chart with one pair of columns per country.", "C": "A stacked bar per country with 2015 and 2024 stacked on top of each other.", "D": "Two pie charts, one for 2015 and one for 2024, placed side by side."}, "answer": "A", "explanations": {"A": "Correct. Two dots joined by a line show both levels and the size and direction of change on a common scale while staying uncluttered for 27 rows.", "B": "Incorrect. The third dimension adds distortion and occlusion without adding information.", "C": "Incorrect. Stacking two years adds shares together, producing a meaningless total and an unaligned second segment.", "D": "Incorrect. Shares by country are not parts of a single whole, and comparing slices across two pies is very imprecise."}, "source": "General visualisation principles (Cleveland & McGill, Tufte, Few); Eurostat visualisation practice"}, {"id": "B5-006", "block": 5, "topic": "Chart selection", "difficulty": "medium", "question": "A chart must show how total EU energy imports evolved over 20 years and how the contribution of four product groups changed. The total is the main message. Which chart is most appropriate?", "options": {"A": "A stacked area chart with the total as the top boundary.", "B": "Four separate pie charts for selected years.", "C": "A 100% stacked bar chart for each year.", "D": "A scatter plot of imports against years for each product."}, "answer": "A", "explanations": {"A": "Correct. A stacked area keeps the total visible as the upper edge while showing the composition over time; the bottom layer is also readable on a common baseline.", "B": "Incorrect. Pies lose the continuous time dimension and the total level.", "C": "Incorrect. Normalising to 100% removes the level of the total, which is the key message.", "D": "Incorrect. A scatter plot does not show the total, which is the main message."}, "source": "General visualisation principles (Cleveland & McGill, Tufte, Few); Eurostat visualisation practice"}, {"id": "B5-007", "block": 5, "topic": "Chart selection", "difficulty": "hard", "question": "A news release must show the composition of household consumption by six categories for one year, but the categories have very similar shares (14% to 19%). Which choice is best?", "options": {"A": "A pie chart, because the values add up to 100%.", "B": "A treemap of the six categories, shown without any labels.", "C": "A sorted horizontal bar chart labelled with the percentages.", "D": "A donut chart with 3D perspective to separate the slices visually."}, "answer": "C", "explanations": {"A": "Incorrect. Adding to 100% makes a pie possible, but similar slices are judged poorly by angle.", "B": "Incorrect. Areas of similar size are hard to compare, and without labels the values cannot be read.", "C": "Correct. Similar shares are very hard to distinguish by angle or area; aligned bars encode values by position and length, which the eye judges more accurately.", "D": "Incorrect. 3D perspective distorts the apparent size of slices in front and behind."}, "source": "General visualisation principles (Cleveland & McGill, Tufte, Few); Eurostat visualisation practice"}, {"id": "B5-008", "block": 5, "topic": "Chart selection", "difficulty": "medium", "question": "A series grows from 100 to 12,800 over 30 years and the analyst wants readers to compare growth rates between periods. Which axis choice supports this?", "options": {"A": "Two vertical axes, one for each half of the thirty-year period.", "B": "A linear axis truncated to start at 5,000.", "C": "A logarithmic vertical axis, clearly labelled as such.", "D": "A linear axis starting at 12,800 and decreasing."}, "answer": "C", "explanations": {"A": "Incorrect. Dual axes for the same series create arbitrary visual comparisons and confuse readers.", "B": "Incorrect. Truncation hides the early part of the series and does not make growth rates comparable.", "C": "Correct. On a log scale equal vertical distances represent equal percentage changes, so constant growth appears as a straight line.", "D": "Incorrect. Reversing the axis confuses readers and does not help compare growth rates."}, "source": "General visualisation principles (Cleveland & McGill, Tufte, Few); Eurostat visualisation practice"}, {"id": "B5-009", "block": 5, "topic": "Chart selection", "difficulty": "hard", "question": "A dashboard must show actual performance against a target and qualitative ranges (poor, satisfactory, good) for ten KPIs in a small space. Which visual is designed for this purpose?", "options": {"A": "Bullet graphs.", "B": "Word clouds of KPIs.", "C": "Gauges.", "D": "Pie charts of target met."}, "answer": "A", "explanations": {"A": "Correct. Bullet graphs, proposed by Stephen Few, display a measure, a target marker and qualitative background bands in a compact linear form.", "B": "Incorrect. Word clouds show no values, targets or ranges.", "C": "Incorrect. Gauges use a lot of space for a single value and encode it by angle, which is less precise.", "D": "Incorrect. A pie per KPI wastes space and cannot show qualitative ranges clearly."}, "source": "Stephen Few, Information Dashboard Design; general visualisation principles"}, {"id": "B5-010", "block": 5, "topic": "Chart selection", "difficulty": "medium", "question": "A statistician wants to show the shape of the distribution of a single continuous variable (household income) for one country, including skewness. Which chart is the standard choice?", "options": {"A": "A bar chart of the mean and median only.", "B": "A pie chart of income bands without labels.", "C": "A line chart of household incomes sorted by household ID number.", "D": "A histogram with appropriately chosen bin widths."}, "answer": "D", "explanations": {"A": "Incorrect. Two summary values cannot show the full shape of the distribution.", "B": "Incorrect. A pie hides the order of bands and makes the shape of the distribution invisible.", "C": "Incorrect. Household IDs are arbitrary; the line shows no distributional shape.", "D": "Correct. A histogram shows frequencies over contiguous intervals and reveals skewness and modality; bin width affects what is visible."}, "source": "General visualisation principles (Cleveland & McGill, Tufte, Few); Eurostat visualisation practice"}, {"id": "B5-011", "block": 5, "topic": "Visualisation errors and good practice", "difficulty": "easy", "question": "A column chart of inflation rates for five countries has a vertical axis starting at 2.0% instead of 0%. The values range from 2.3% to 2.9%. What is the main problem?", "options": {"A": "Each country's column must be shown in a different colour.", "B": "Rates should always be plotted on a logarithmic scale instead.", "C": "Column charts are not suitable for showing percentage values.", "D": "The bars exaggerate the differences between countries."}, "answer": "D", "explanations": {"A": "Incorrect. Colour per country is unnecessary; the axis baseline is the problem.", "B": "Incorrect. A log scale is for multiplicative changes over wide ranges, not for comparing five close values.", "C": "Incorrect. Percentages can be shown in column charts; the issue is the truncated baseline.", "D": "Correct. Bars encode values by length from the baseline; truncating the axis makes 2.9% look several times larger than 2.3%."}, "source": "General visualisation principles (Cleveland & McGill, Tufte, Few); Eurostat visualisation practice"}, {"id": "B5-012", "block": 5, "topic": "Visualisation errors and good practice", "difficulty": "medium", "question": "For a line chart showing small month-to-month variations in a price index between 103 and 108, the analyst asks whether the axis must start at zero. What is the best guidance?", "options": {"A": "The series should be converted into a bar chart to show the variations.", "B": "The vertical axis must start at zero whatever the type of chart.", "C": "The vertical axis must always start at zero, whatever the type of chart.", "D": "A non-zero baseline is fine for a line chart if the axis is clearly labelled."}, "answer": "D", "explanations": {"A": "Incorrect. Bars would require a zero baseline and would hide small variations.", "B": "Incorrect. The zero rule applies to bars and areas that encode length/area, not strictly to line charts.", "C": "Incorrect. The base of the index does not dictate the axis start.", "D": "Correct. Line charts are read by position and slope; zooming in on the relevant range is accepted practice as long as the axis is clearly labelled."}, "source": "General visualisation principles (Cleveland & McGill, Tufte, Few); Eurostat visualisation practice"}, {"id": "B5-013", "block": 5, "topic": "Visualisation errors and good practice", "difficulty": "hard", "question": "According to Cleveland and McGill's research on graphical perception, which encoding allows readers to compare quantitative values most accurately?", "options": {"A": "Position along a common scale.", "B": "The area of proportional circles.", "C": "The angle of slices in a pie chart.", "D": "Variations in colour saturation."}, "answer": "A", "explanations": {"A": "Correct. Their experiments ranked position along a common scale highest, followed by position on non-aligned scales, length, angle/slope, area, and colour saturation/volume.", "B": "Incorrect. Area is judged much less accurately than position or length; people tend to underestimate area differences.", "C": "Incorrect. Angle ranks below position and length in accuracy.", "D": "Incorrect. Colour saturation is among the least accurate encodings for quantitative values."}, "source": "Cleveland, W.S. & McGill, R. (1984), Graphical Perception, JASA"}, {"id": "B5-014", "block": 5, "topic": "Visualisation errors and good practice", "difficulty": "medium", "question": "A chart uses two vertical axes: GDP growth (left, -2% to 4%) and unemployment (right, 5% to 11%). The two lines appear to cross in 2021. What is the main risk?", "options": {"A": "The apparent relationship depends on arbitrary axis scaling.", "B": "Dual-axis charts are forbidden by the EU web accessibility directive.", "C": "Both lines would need to share the same colour to be read.", "D": "Percentage values cannot be plotted as lines on any chart."}, "answer": "A", "explanations": {"A": "Correct. With dual axes the analyst can make lines cross, diverge or move together just by changing either scale; visual relationships are artefacts.", "B": "Incorrect. There is no such legal prohibition; the issue is interpretive.", "C": "Incorrect. Using the same colour would make it even harder to read.", "D": "Incorrect. Percentages are commonly shown on line charts."}, "source": "General visualisation principles (Cleveland & McGill, Tufte, Few); Eurostat visualisation practice"}, {"id": "B5-015", "block": 5, "topic": "Visualisation errors and good practice", "difficulty": "medium", "question": "Edward Tufte's 'data-ink ratio' principle recommends which of the following?", "options": {"A": "Removing gridlines, 3D effects and decoration that carry no data.", "B": "Adding a 3D effect to bars so that the chart appears to have depth.", "C": "Using as many colours as possible to attract the reader's eye.", "D": "Fitting the maximum number of charts on each page of the report."}, "answer": "A", "explanations": {"A": "Correct. Tufte argues that most ink in a graphic should present data; non-data ink and chartjunk should be minimised.", "B": "Incorrect. 3D effects are a classic example of chartjunk.", "C": "Incorrect. Extra colours that encode nothing are non-data ink.", "D": "Incorrect. The principle concerns the ink within a graphic, not packing pages."}, "source": "Tufte, E. (1983), The Visual Display of Quantitative Information"}, {"id": "B5-016", "block": 5, "topic": "Visualisation errors and good practice", "difficulty": "hard", "question": "A pictogram represents a doubling of public R&D spending by drawing a second coin icon with twice the diameter of the first. What error does this introduce?", "options": {"A": "The distortion only matters if the icons are printed in colour.", "B": "The area quadruples, so the increase looks twice as large as it is.", "C": "None: doubling the diameter correctly represents a doubling of spending.", "D": "The area only doubles, which slightly understates the real increase."}, "answer": "B", "explanations": {"A": "Incorrect. The distortion is geometric and independent of colour.", "B": "Correct. Scaling both dimensions by 2 multiplies the area by 4; readers perceive area, so the change appears about four times larger instead of two.", "C": "Incorrect. Readers perceive the icon's area, which grows with the square of the diameter.", "D": "Incorrect. Doubling the diameter quadruples, not doubles, the area."}, "source": "Tufte, E. (1983), lie factor; general visualisation principles"}, {"id": "B5-017", "block": 5, "topic": "Visualisation errors and good practice", "difficulty": "medium", "question": "A chart uses red and green to distinguish 'below target' and 'above target'. Which accessibility issue is most relevant?", "options": {"A": "Screen readers cannot interpret colour, so the chart must be greyscale.", "B": "Red and green are not allowed in official EU publications.", "C": "By convention, green should be used for values below target.", "D": "Colour-blind readers may not tell them apart; add labels or shapes."}, "answer": "D", "explanations": {"A": "Incorrect. Greyscale is not required; text alternatives and redundant encoding are.", "B": "Incorrect. There is no such ban; the guidance is not to rely on colour alone.", "C": "Incorrect. Conventions vary, and the question concerns accessibility, not convention.", "D": "Correct. Red-green deficiency is the most common type; colour should not be the only means of conveying information."}, "source": "Web Content Accessibility Guidelines (WCAG) 2.1, criterion 1.4.1 Use of Color; Directive (EU) 2016/2102"}, {"id": "B5-018", "block": 5, "topic": "Visualisation errors and good practice", "difficulty": "hard", "question": "An analyst shows the total number of road deaths per country in a bar chart and concludes that Germany has the least safe roads in the EU. What is the main methodological flaw?", "options": {"A": "The bars should have been sorted alphabetically by country.", "B": "Totals are not adjusted for population or traffic volume.", "C": "Bar charts are not suitable for showing counts of events.", "D": "Road deaths should have been displayed in a pie chart."}, "answer": "B", "explanations": {"A": "Incorrect. Sorting does not fix the lack of normalisation.", "B": "Correct. Comparisons of risk need rates (e.g. deaths per million inhabitants or per vehicle-km); totals mainly reflect country size.", "C": "Incorrect. Bar charts are suitable for counts; the issue is the indicator.", "D": "Incorrect. A pie would still show unnormalised counts."}, "source": "General visualisation principles (Cleveland & McGill, Tufte, Few); Eurostat visualisation practice"}, {"id": "B5-019", "block": 5, "topic": "Dashboards and KPIs", "difficulty": "medium", "question": "A director wants a dashboard to monitor the timeliness of statistical releases at a glance. Which design principle is most important?", "options": {"A": "Show the few key indicators on one screen, with the main KPI at top left.", "B": "Add animations to every chart so that they attract users' attention.", "C": "Put detailed tables of raw data on the first screen of the dashboard as well.", "D": "Include every available indicator so that nothing important is missing."}, "answer": "A", "explanations": {"A": "Correct. Dashboards are for monitoring at a glance; Few defines them as the most important information arranged on a single screen, and readers scan from top-left in Western layouts.", "B": "Incorrect. Animation distracts and slows reading when monitoring.", "C": "Incorrect. Raw tables belong to drill-down views, not the overview.", "D": "Incorrect. Overloading dilutes attention; a dashboard should prioritise."}, "source": "Stephen Few, Information Dashboard Design"}, {"id": "B5-020", "block": 5, "topic": "Dashboards and KPIs", "difficulty": "medium", "question": "Which of the following is a leading indicator for the objective 'reduce delays in publishing quarterly statistics'?", "options": {"A": "The share of national data transmissions received after the deadline.", "B": "The number of releases published late during the previous year.", "C": "The total number of statistical releases published in the year.", "D": "The average delay of last quarter's publications, measured in working days."}, "answer": "A", "explanations": {"A": "Correct. Late inputs predict future publication delays, so they act as an early warning signal (leading indicator).", "B": "Incorrect. This measures past outcomes, which is a lagging indicator.", "C": "Incorrect. Volume does not predict delays and is not linked to the objective.", "D": "Incorrect. This is also an outcome measure (lagging)."}, "source": "Performance measurement principles (leading vs lagging indicators)"}, {"id": "B5-021", "block": 5, "topic": "Dashboards and KPIs", "difficulty": "easy", "question": "Which formulation of a KPI best follows the SMART criteria?", "options": {"A": "Improve the overall quality of all our statistical products.", "B": "Publish 95% of news releases on the announced date in 2027.", "C": "Publish our news releases faster than we did before.", "D": "Become the best statistical office in the whole world."}, "answer": "B", "explanations": {"A": "Incorrect. Vague and not measurable or time-bound.", "B": "Correct. It is Specific, Measurable (95%), Achievable, Relevant to the release calendar and Time-bound (2027).", "C": "Incorrect. No target value or deadline.", "D": "Incorrect. Not measurable, nor clearly achievable or time-bound."}, "source": "SMART objectives framework"}, {"id": "B5-022", "block": 5, "topic": "Dashboards and KPIs", "difficulty": "hard", "question": "An interactive dashboard shows EU totals. Users ask to click a Member State and see its NUTS 2 regions, then click a region to see NUTS 3 values. Which feature is required?", "options": {"A": "Pivoting the rows and columns of a table.", "B": "Drill-down along a geographic hierarchy.", "C": "Conditional formatting of the values shown.", "D": "Scheduled refresh of the underlying data."}, "answer": "B", "explanations": {"A": "Incorrect. Pivoting changes the layout, not the level of detail along a hierarchy.", "B": "Correct. Drill-down lets users move from aggregated to more detailed levels along a defined hierarchy (EU, country, NUTS 2, NUTS 3).", "C": "Incorrect. Conditional formatting changes appearance based on values, not detail level.", "D": "Incorrect. Scheduling updates data but does not allow hierarchical navigation."}, "source": "BI concepts; NUTS classification (Regulation (EC) No 1059/2003)"}, {"id": "B5-023", "block": 5, "topic": "Dashboards and KPIs", "difficulty": "medium", "question": "A KPI tile shows '87%' for data-quality compliance in large font with no other information. What is the main weakness?", "options": {"A": "KPI tiles should always be displayed as pie charts instead of numbers.", "B": "There is no target, previous value or trend to judge it against.", "C": "Percentages should never be displayed on a dashboard.", "D": "The figure should be in a smaller font than the tile title."}, "answer": "B", "explanations": {"A": "Incorrect. A pie is not required and often less effective.", "B": "Correct. A single number needs comparison (target, prior value, sparkline) to be interpretable on a dashboard.", "C": "Incorrect. Percentages are common KPI formats.", "D": "Incorrect. Prominent display is fine; the issue is the missing context."}, "source": "Stephen Few, Information Dashboard Design"}, {"id": "B5-024", "block": 5, "topic": "Dashboards and KPIs", "difficulty": "hard", "question": "A dashboard calculates an EU average unemployment rate as the simple average of the 27 national rates. What is the issue?", "options": {"A": "Nothing, because a simple average of percentages is always valid.", "B": "The median of the national rates should be used for any rate.", "C": "Rates cannot be aggregated to EU level under any method.", "D": "Countries should be weighted by their labour force, not equally."}, "answer": "D", "explanations": {"A": "Incorrect. Unweighted averages of rates misrepresent the aggregate when denominators differ.", "B": "Incorrect. The median does not produce the EU aggregate rate either.", "C": "Incorrect. They can be aggregated correctly using the underlying totals.", "D": "Correct. An unweighted mean of rates treats Malta and Germany equally; the EU aggregate is total unemployed divided by total labour force."}, "source": "Eurostat methodology for EU aggregates (weighted by underlying totals)"}, {"id": "B5-025", "block": 5, "topic": "Dashboards and KPIs", "difficulty": "medium", "question": "When designing a dashboard for senior management, which use of colour is most appropriate?", "options": {"A": "Gradient backgrounds to visually separate the different sections.", "B": "A different bright colour for every chart to make it look lively.", "C": "Mostly neutral colours, with strong colours kept for exceptions.", "D": "Red throughout the dashboard to convey a sense of urgency."}, "answer": "C", "explanations": {"A": "Incorrect. Gradients add non-data ink and can affect colour perception.", "B": "Incorrect. Arbitrary colours compete for attention and imply non-existent categories.", "C": "Correct. Restrained colour makes alerts stand out; if everything is bright, nothing is.", "D": "Incorrect. Constant red loses its alerting meaning."}, "source": "Stephen Few, Information Dashboard Design"}, {"id": "B5-026", "block": 5, "topic": "Dashboards and KPIs", "difficulty": "hard", "question": "A dashboard shows a strong positive correlation between the number of digital tools used by EU agencies and their staff satisfaction. A manager wants to conclude that buying tools causes satisfaction. What is the best response?", "options": {"A": "Causation can be assumed because the data come from an official source.", "B": "The correlation proves causation because it is strong.", "C": "Causation is proven once a trend line is added to the chart.", "D": "Correlation is not causation; agency size or budget may drive both."}, "answer": "D", "explanations": {"A": "Incorrect. Data provenance does not change the inferential limitation.", "B": "Incorrect. Strength of correlation does not rule out confounding or reverse causality.", "C": "Incorrect. A fitted line describes association, not cause.", "D": "Correct. Observational associations on a dashboard require further analysis (controls, design) before a causal claim."}, "source": "General statistical principles"}, {"id": "B5-027", "block": 5, "topic": "BI tools (Power BI, Tableau)", "difficulty": "medium", "question": "In Power BI, an analyst needs a value that responds dynamically to slicers selected by the user, such as total expenditure for the selected countries. What should they create?", "options": {"A": "A Power Query step.", "B": "A static Excel table.", "C": "A calculated column.", "D": "A DAX measure."}, "answer": "D", "explanations": {"A": "Incorrect. Power Query transformations run at refresh, not in response to slicers.", "B": "Incorrect. Static values do not recalculate with user selections.", "C": "Incorrect. Calculated columns are computed row by row at data refresh and stored; they do not react to the filter context in the same way.", "D": "Correct. Measures are evaluated at query time in the current filter context, so they respond to slicers and visuals."}, "source": "Microsoft Power BI documentation (DAX measures vs calculated columns)"}, {"id": "B5-028", "block": 5, "topic": "BI tools (Power BI, Tableau)", "difficulty": "medium", "question": "In Power BI, which component is primarily used to connect to sources and clean, reshape and combine data before it is loaded into the model?", "options": {"A": "Power Query (M).", "B": "DAX formulas.", "C": "Row-level security.", "D": "The Q&A visual."}, "answer": "A", "explanations": {"A": "Correct. Power Query is the ETL layer of Power BI, used for extraction and transformation before loading.", "B": "Incorrect. DAX is used for calculations in the model after loading.", "C": "Incorrect. RLS restricts which rows users see; it does not transform data.", "D": "Incorrect. Q&A answers natural-language questions on a loaded model."}, "source": "Microsoft Power BI documentation"}, {"id": "B5-029", "block": 5, "topic": "BI tools (Power BI, Tableau)", "difficulty": "hard", "question": "A data model for a BI tool contains a central table of statistical observations linked to separate tables for time, geography and indicator. What is this structure called and why is it recommended?", "options": {"A": "A hierarchical XML schema, which is used to define the visual layout.", "B": "A snowflake of facts, which stores all measures inside dimension tables.", "C": "A star schema, which separates facts from dimensions for fast filtering.", "D": "A flat file, which avoids relationships between tables altogether."}, "answer": "C", "explanations": {"A": "Incorrect. The structure described is a relational modelling pattern, not a layout format.", "B": "Incorrect. Measures belong in the fact table; the description is not of this structure.", "C": "Correct. A star schema has a fact table surrounded by dimension tables; BI engines are optimised for it and filters propagate clearly.", "D": "Incorrect. A single flat table duplicates attributes and is not what is described."}, "source": "Kimball dimensional modelling; Microsoft Power BI guidance on star schemas"}, {"id": "B5-030", "block": 5, "topic": "BI tools (Power BI, Tableau)", "difficulty": "medium", "question": "Several Member State correspondents use the same Power BI report, but each must see only their own country's confidential data. Which feature should be configured?", "options": {"A": "Conditional formatting rules.", "B": "Row-level security (RLS).", "C": "Report bookmarks.", "D": "Drill-through pages."}, "answer": "B", "explanations": {"A": "Incorrect. Formatting changes appearance only.", "B": "Correct. RLS applies filters by user role so that each user sees only permitted rows within the same report.", "C": "Incorrect. Bookmarks save views; they do not enforce access restrictions.", "D": "Incorrect. Drill-through navigates to detail pages but does not secure data."}, "source": "Microsoft Power BI documentation (row-level security)"}, {"id": "B5-031", "block": 5, "topic": "BI tools (Power BI, Tableau)", "difficulty": "hard", "question": "In Tableau, an analyst needs the average sales per customer computed at customer level, while the view is displayed by region. Which feature handles calculations at a level of detail different from the view?", "options": {"A": "Data extracts (.hyper files).", "B": "Story points in a story.", "C": "Dashboard filter actions.", "D": "LOD expressions such as FIXED."}, "answer": "D", "explanations": {"A": "Incorrect. Extracts are data snapshots for performance, not a calculation feature.", "B": "Incorrect. Stories sequence views for narration.", "C": "Incorrect. Actions link interactions between sheets; they do not change the calculation granularity.", "D": "Correct. LOD expressions (FIXED, INCLUDE, EXCLUDE) compute aggregations at a specified granularity independent of the view's dimensions."}, "source": "Tableau documentation (LOD expressions)"}, {"id": "B5-032", "block": 5, "topic": "BI tools (Power BI, Tableau)", "difficulty": "medium", "question": "In Tableau, fields are typically divided into two types. Which statement is correct?", "options": {"A": "Dimensions can only be used to set the colour of marks.", "B": "Dimensions slice the data; measures are numeric and aggregated.", "C": "Dimensions are always numeric fields and measures are always text fields.", "D": "Measures cannot be aggregated and are shown row by row."}, "answer": "B", "explanations": {"A": "Incorrect. Dimensions can be placed on rows, columns, filters and marks.", "B": "Correct. Dimensions (e.g. country, year) define the level of detail; measures (e.g. value) are aggregated, typically SUM or AVG.", "C": "Incorrect. Dimensions are often text or dates; measures are numeric.", "D": "Incorrect. Measures are aggregated by default."}, "source": "Tableau documentation"}, {"id": "B5-033", "block": 5, "topic": "BI tools (Power BI, Tableau)", "difficulty": "hard", "question": "A Power BI report on a very large and frequently updated database must show near-real-time values without importing the data. Which connection mode fits, and what is the main trade-off?", "options": {"A": "Hourly CSV exports: they remove the need for any data model at all.", "B": "Publish to web: it makes the source database update faster.", "C": "DirectQuery: fresh data from the source, but usually slower visuals.", "D": "Import mode: it always shows real-time data, with no trade-off."}, "answer": "C", "explanations": {"A": "Incorrect. Manual exports are not a connection mode and add latency and risk.", "B": "Incorrect. Publish to web is a sharing feature, unsuitable for confidential data, and does not affect freshness.", "C": "Correct. DirectQuery does not store data in the model, so freshness improves while performance depends on the source and some DAX/transformations are restricted.", "D": "Incorrect. Import stores a snapshot refreshed on a schedule, so it is not real-time."}, "source": "Microsoft Power BI documentation (Import vs DirectQuery)"}, {"id": "B5-034", "block": 5, "topic": "Maps and GIS", "difficulty": "hard", "question": "An analyst wants to map the number of tourist nights by NUTS 2 region on a choropleth map. A colleague objects. What is the best advice?", "options": {"A": "Use only absolute numbers on choropleths, as rates are hard to read.", "B": "Replace the map with a pie chart showing the share of each NUTS 2 region.", "C": "Add more colour classes so that the size of regions is corrected.", "D": "Map a rate such as nights per inhabitant, or use proportional symbols."}, "answer": "D", "explanations": {"A": "Incorrect. The opposite: absolute counts on choropleths are misleading.", "B": "Incorrect. Maps preserve the geographic pattern; the issue is the indicator type.", "C": "Incorrect. More classes do not remove the bias caused by area size.", "D": "Correct. Choropleths colour whole areas, so absolute counts are visually inflated for large regions; normalised values or proportional symbols avoid this."}, "source": "Eurostat/GISCO cartographic practice; general thematic cartography"}, {"id": "B5-035", "block": 5, "topic": "Maps and GIS", "difficulty": "medium", "question": "Which coordinate reference system does Eurostat/GISCO commonly use for statistical maps of Europe because it preserves area?", "options": {"A": "Universal Transverse Mercator zone 32N for the whole of Europe.", "B": "ETRS89 Lambert Azimuthal Equal-Area (EPSG:3035).", "C": "Web Mercator (EPSG:3857).", "D": "WGS 84 geographic coordinates (EPSG:4326) shown as a plain grid."}, "answer": "B", "explanations": {"A": "Incorrect. A single UTM zone distorts heavily outside its narrow band.", "B": "Correct. EPSG:3035 is the pan-European equal-area projection recommended for statistical mapping and used for the European population grid.", "C": "Incorrect. Web Mercator greatly enlarges northern areas, distorting comparisons of area.", "D": "Incorrect. Plotting latitude/longitude directly as x/y is not equal-area."}, "source": "Eurostat GISCO; INSPIRE guidance on ETRS89-LAEA"}, {"id": "B5-036", "block": 5, "topic": "Maps and GIS", "difficulty": "medium", "question": "Under the NUTS classification, which statement is correct about the population thresholds for NUTS 2 regions?", "options": {"A": "They should have between 150,000 and 800,000 inhabitants.", "B": "They should have between 3 million and 7 million inhabitants.", "C": "They should have between 800,000 and 3 million inhabitants.", "D": "The NUTS Regulation sets no population threshold for them."}, "answer": "C", "explanations": {"A": "Incorrect. Those are the NUTS 3 thresholds.", "B": "Incorrect. Those are the NUTS 1 thresholds.", "C": "Correct. Regulation (EC) No 1059/2003 sets thresholds: NUTS 1 3-7 million, NUTS 2 800,000-3 million, NUTS 3 150,000-800,000.", "D": "Incorrect. The Regulation does set thresholds for each level."}, "source": "Regulation (EC) No 1059/2003 (NUTS), Art. 3"}, {"id": "B5-037", "block": 5, "topic": "Maps and GIS", "difficulty": "hard", "question": "The same data aggregated to NUTS 3 and to NUTS 2 regions produce maps that suggest different spatial patterns. What is this phenomenon called?", "options": {"A": "Map projection distortion.", "B": "The modifiable areal unit problem.", "C": "Positive spatial autocorrelation.", "D": "Simpson's paradox in time series."}, "answer": "B", "explanations": {"A": "Incorrect. Projection affects shape/area on the map, not the aggregated values.", "B": "Correct. MAUP describes how results of spatial analysis change with the scale and shape of the areal units used for aggregation.", "C": "Incorrect. Autocorrelation refers to similarity of nearby values, not to changes caused by the choice of units.", "D": "Incorrect. Simpson's paradox concerns reversal of associations when groups are combined, not specifically spatial units."}, "source": "Openshaw (1984), The Modifiable Areal Unit Problem; GIS principles"}, {"id": "B5-038", "block": 5, "topic": "Maps and GIS", "difficulty": "medium", "question": "For a choropleth map of a skewed variable, an analyst wants each colour class to contain roughly the same number of regions. Which classification method achieves this?", "options": {"A": "Quantiles.", "B": "Jenks breaks.", "C": "Standard deviation.", "D": "Equal interval."}, "answer": "A", "explanations": {"A": "Correct. Quantile classification places an equal number of observations in each class.", "B": "Incorrect. Jenks minimises variance within classes; class counts vary.", "C": "Incorrect. Classes are defined by distance from the mean, not equal counts.", "D": "Incorrect. Equal intervals divide the value range into equal widths; with skewed data most regions fall in one class."}, "source": "Thematic cartography principles"}, {"id": "B5-039", "block": 5, "topic": "Maps and GIS", "difficulty": "medium", "question": "Which pair correctly matches spatial data models?", "options": {"A": "Vector data are always satellite images; raster data are always boundaries.", "B": "Raster data cannot store numeric values in their cells, only display colours.", "C": "Vector features cannot be linked to attribute tables of any kind.", "D": "Vector data use points, lines and polygons; raster data use a grid of cells."}, "answer": "D", "explanations": {"A": "Incorrect. This reverses the typical uses.", "B": "Incorrect. Each raster cell stores a value, often numeric.", "C": "Incorrect. Vector features typically have attribute tables.", "D": "Correct. Administrative boundaries are typically vector; satellite imagery and population grids are raster."}, "source": "GIS fundamentals"}, {"id": "B5-040", "block": 5, "topic": "Maps and GIS", "difficulty": "hard", "question": "An analyst has a table of 50,000 enterprise addresses and needs to assign each enterprise to its NUTS 3 region. Which sequence of GIS operations is appropriate?", "options": {"A": "Geocode the addresses, then spatially join the points to NUTS 3 polygons.", "B": "Buffer the NUTS 3 polygons by 1 km and then count the addresses alphabetically.", "C": "Join the address table to NUTS 3 by the first letters of the street.", "D": "Rasterise the NUTS 3 boundaries and match addresses by colour name."}, "answer": "A", "explanations": {"A": "Correct. Geocoding converts addresses into points; a spatial join assigns each point to the polygon containing it, provided both layers share a CRS.", "B": "Incorrect. Buffering and alphabetic order do not assign locations.", "C": "Incorrect. Street names have no relationship to NUTS codes.", "D": "Incorrect. This is not a valid method of spatial assignment."}, "source": "GIS fundamentals; Eurostat GISCO"}, {"id": "B5-041", "block": 5, "topic": "Maps and GIS", "difficulty": "medium", "question": "Which EU legal act established an infrastructure for spatial information in the European Community to support environmental policies?", "options": {"A": "Regulation (EU) 2016/679.", "B": "Regulation (EC) No 223/2009.", "C": "Directive 2007/2/EC (INSPIRE).", "D": "Directive (EU) 2019/1024."}, "answer": "C", "explanations": {"A": "Incorrect. This is the General Data Protection Regulation.", "B": "Incorrect. This is the Regulation on European statistics.", "C": "Correct. The INSPIRE Directive sets rules for interoperable spatial data sets and services across the EU.", "D": "Incorrect. This is the Open Data Directive on re-use of public sector information; it is not the spatial data infrastructure act."}, "source": "Directive 2007/2/EC (INSPIRE)"}, {"id": "B5-042", "block": 5, "topic": "Communicating results", "difficulty": "medium", "question": "An analyst writes the title of a chart for a news release on regional unemployment. Which title follows good practice for communicating to non-specialists?", "options": {"A": "'lfst_r_lfu3rt, NUTS 2, 2025, percentage'.", "B": "'Data for regions, selected indicator'.", "C": "'Unemployment highest in southern regions'.", "D": "'Figure 3: Chart of regional statistics'."}, "answer": "C", "explanations": {"A": "Incorrect. Database codes are useful in sources/metadata, not as titles for the public.", "B": "Incorrect. Gives no information at all.", "C": "Correct. A message-oriented title states the key finding so readers immediately know what to take from the chart.", "D": "Incorrect. A label with no content gives no message."}, "source": "Eurostat dissemination practice; general visualisation principles"}, {"id": "B5-043", "block": 5, "topic": "Communicating results", "difficulty": "hard", "question": "A flash estimate of quarterly GDP growth is 0.3%, but its typical revision range is about ±0.2 percentage points. How should this be communicated to policy experts?", "options": {"A": "Give the estimate together with its typical revision range.", "B": "Withhold the figure until it can no longer be revised.", "C": "Report 0.300% with three decimals to show precision.", "D": "State that 0.3% is the final figure so as to avoid any confusion."}, "answer": "A", "explanations": {"A": "Correct. Communicating uncertainty prevents over-interpretation; experts need to know how much the figure may change.", "B": "Incorrect. Timely flash estimates are valuable; uncertainty should be explained, not hidden.", "C": "Incorrect. Extra decimals suggest false precision.", "D": "Incorrect. This is misleading because flash estimates are revised."}, "source": "ESS Code of Practice (accuracy and reliability; accessibility and clarity)"}, {"id": "B5-044", "block": 5, "topic": "Communicating results", "difficulty": "medium", "question": "An analyst must present technical results to a mixed audience of experts and policymakers. Which structure is most effective?", "options": {"A": "Main conclusion first, then evidence, then methodological detail.", "B": "Full methodology first, with the conclusion presented at the very end.", "C": "As much technical jargon as possible, to demonstrate scientific rigour.", "D": "Only the raw data tables, so that the audience draws its own conclusions."}, "answer": "A", "explanations": {"A": "Correct. The 'inverted pyramid' puts the key message first so busy readers get it immediately; details follow for those who need them.", "B": "Incorrect. Busy readers may never reach the conclusion.", "C": "Incorrect. Jargon reduces clarity for policymakers.", "D": "Incorrect. Without interpretation the main message is lost."}, "source": "Communication principles; Eurostat dissemination practice"}, {"id": "B5-045", "block": 5, "topic": "Communicating results", "difficulty": "hard", "question": "Which element of the ESS Code of Practice most directly requires that statistics be presented clearly, with accompanying metadata and guidance?", "options": {"A": "Principle 5: Statistical confidentiality.", "B": "Principle 9: Non-excessive burden on respondents.", "C": "Principle 15: Accessibility and clarity.", "D": "Principle 1: Professional independence."}, "answer": "C", "explanations": {"A": "Incorrect. This concerns protection of data on individual respondents.", "B": "Incorrect. This concerns reporting burden.", "C": "Correct. Principle 15 requires that statistics are presented in a clear and understandable form, released in a suitable manner, and available with supporting metadata and guidance.", "D": "Incorrect. This concerns independence from political and other interference."}, "source": "European Statistics Code of Practice (revised 2017), Principle 15"}, {"id": "B5-046", "block": 5, "topic": "AI and generative AI in official statistics", "difficulty": "medium", "question": "A national statistical institute receives thousands of free-text job descriptions from a survey and must assign ISCO occupation codes. Which use of machine learning is most appropriate?", "options": {"A": "A generative model that creates new occupation codes when it is uncertain.", "B": "An unsupervised clustering model whose clusters are published directly as ISCO codes.", "C": "Random assignment of codes to responses, followed by aggregate correction.", "D": "A supervised classifier trained on coded data, with doubtful cases sent to coders."}, "answer": "D", "explanations": {"A": "Incorrect. Codes must come from the official classification; invented codes break comparability.", "B": "Incorrect. Clusters do not correspond to ISCO codes without labels and validation.", "C": "Incorrect. Random assignment destroys the information in the responses.", "D": "Correct. Automatic coding with supervised learning is a common ML use in official statistics; routing uncertain cases to experts maintains quality."}, "source": "UNECE HLG-MOS Machine Learning Project (2021); Eurostat work on ML in official statistics"}, {"id": "B5-047", "block": 5, "topic": "AI and generative AI in official statistics", "difficulty": "medium", "question": "A large language model gives a confident answer citing a Eurostat dataset code that does not exist. What is this behaviour usually called?", "options": {"A": "Overfitting.", "B": "Data drift.", "C": "Imputation.", "D": "Hallucination."}, "answer": "D", "explanations": {"A": "Incorrect. Overfitting describes a model that fits training data too closely and generalises poorly; it is not the term for invented content.", "B": "Incorrect. Drift refers to changes in input data distribution over time.", "C": "Incorrect. Imputation is the statistical replacement of missing values.", "D": "Correct. LLMs generate plausible text by predicting tokens and can produce fluent but false content, including invented references."}, "source": "UNECE HLG-MOS, Large Language Models for Official Statistics (2023)"}, {"id": "B5-048", "block": 5, "topic": "AI and generative AI in official statistics", "difficulty": "hard", "question": "A statistical office builds a chatbot that answers questions using its own published releases and metadata. To reduce invented answers and give sources, which architecture is most appropriate?", "options": {"A": "Removing all instructions from the prompt sent to the model.", "B": "Training a new model from scratch on randomly crawled web pages.", "C": "Retrieval-augmented generation, citing the retrieved documents.", "D": "Raising the model's temperature so that answers are more varied."}, "answer": "C", "explanations": {"A": "Incorrect. Clear instructions help the model stay within its sources.", "B": "Incorrect. Generic web data does not ground answers in the office's releases and is costly.", "C": "Correct. RAG grounds the model's answer in retrieved authoritative content and allows citations, reducing hallucinations (though not eliminating them).", "D": "Incorrect. Higher temperature increases randomness and can increase errors."}, "source": "UNECE HLG-MOS, Large Language Models for Official Statistics (2023)"}, {"id": "B5-049", "block": 5, "topic": "AI and generative AI in official statistics", "difficulty": "hard", "question": "A nowcasting model using web-scraped job advertisements performed well for two years, but its errors increased after a major platform changed how it publishes ads. What is the most likely explanation?", "options": {"A": "The model was already underfitted when it was first deployed.", "B": "The errors come from rounding in the published nowcast figures.", "C": "Web-scraped data can never be used in official statistics.", "D": "Data drift: the inputs changed, so the model must be retrained."}, "answer": "D", "explanations": {"A": "Incorrect. It performed well initially; the change coincides with the source change.", "B": "Incorrect. Rounding cannot explain a structural deterioration.", "C": "Incorrect. Web data are used experimentally and in production (e.g. ESS Web Intelligence Hub) with appropriate quality checks.", "D": "Correct. Changes in data generation alter the relationship the model learned; ML systems in production require ongoing monitoring."}, "source": "Eurostat Web Intelligence Hub; ML operations principles"}, {"id": "B5-050", "block": 5, "topic": "AI and generative AI in official statistics", "difficulty": "medium", "question": "In the context of LLMs, what is a 'prompt injection' risk for a statistical office's chatbot?", "options": {"A": "Hidden instructions in input or retrieved text that override its rules.", "B": "The model needing more GPU memory to process very long prompts.", "C": "A user's prompt being automatically translated into another EU language.", "D": "Users sending too many prompts per minute to the chatbot service."}, "answer": "A", "explanations": {"A": "Correct. Prompt injection exploits the fact that LLMs process instructions and data in the same text channel.", "B": "Incorrect. This is a resource issue.", "C": "Incorrect. Translation alone is not an attack.", "D": "Incorrect. That is a rate-limiting issue, not prompt injection."}, "source": "OWASP Top 10 for LLM Applications; UNECE HLG-MOS (2023)"}, {"id": "B5-051", "block": 5, "topic": "AI and generative AI in official statistics", "difficulty": "hard", "question": "Which use of generative AI in a statistical production process is most consistent with the quality principles of official statistics?", "options": {"A": "Letting an LLM generate the published figures directly from a prompt.", "B": "Publishing chatbot answers as official statistics without any checks.", "C": "Replacing survey answers with undisclosed LLM-generated responses.", "D": "Having an LLM draft code or metadata that staff then review and test."}, "answer": "D", "explanations": {"A": "Incorrect. Figures must result from documented, validated methods, not generated text.", "B": "Incorrect. Unverified outputs may contain errors and are not official statistics.", "C": "Incorrect. This undermines accuracy and transparency.", "D": "Correct. Human review and validation preserve accuracy and accountability, which the ESS Code of Practice requires."}, "source": "European Statistics Code of Practice; UNECE HLG-MOS (2023)"}, {"id": "B5-052", "block": 5, "topic": "AI and generative AI in official statistics", "difficulty": "medium", "question": "An analyst sets the 'temperature' parameter of an LLM close to 0 when using it to extract fields from documents. What is the effect?", "options": {"A": "Outputs become more creative, varied and diverse.", "B": "Outputs become more deterministic and consistent.", "C": "The model's context window is enlarged accordingly.", "D": "The model is retrained on the extracted documents."}, "answer": "B", "explanations": {"A": "Incorrect. That happens with higher temperature.", "B": "Correct. Low temperature reduces randomness in token sampling, which suits extraction tasks that need consistency.", "C": "Incorrect. Context length is unrelated to temperature.", "D": "Incorrect. Temperature affects sampling, not training."}, "source": "General LLM concepts"}, {"id": "B5-053", "block": 5, "topic": "AI Act (Regulation (EU) 2024/1689)", "difficulty": "medium", "question": "What is the legal nature and general approach of Regulation (EU) 2024/1689 (AI Act)?", "options": {"A": "A non-binding recommendation on ethical AI.", "B": "A directly applicable regulation following a risk-based approach.", "C": "A directive requiring national transposition, banning all AI in the public sector.", "D": "A regulation applying identical obligations to every AI system."}, "answer": "B", "explanations": {"A": "Incorrect. It is binding legislation.", "B": "Correct. As a regulation it applies directly in all Member States; obligations scale with risk (prohibited practices, high-risk, transparency obligations, minimal risk).", "C": "Incorrect. It is not a directive and does not ban AI in the public sector.", "D": "Incorrect. Obligations depend on the level of risk."}, "source": "Regulation (EU) 2024/1689, Art. 1 and recitals"}, {"id": "B5-054", "block": 5, "topic": "AI Act (Regulation (EU) 2024/1689)", "difficulty": "hard", "question": "Under the AI Act, from which date did the prohibitions on certain AI practices (Article 5) start to apply?", "options": {"A": "1 August 2024.", "B": "2 August 2025.", "C": "2 February 2025.", "D": "2 August 2027."}, "answer": "C", "explanations": {"A": "Incorrect. This is the date of entry into force, not of application of the prohibitions.", "B": "Incorrect. This is when rules on general-purpose AI models and governance started to apply.", "C": "Correct. Art. 113 provides that Chapters I and II (including Art. 5 prohibitions and AI literacy) apply from 2 February 2025.", "D": "Incorrect. This relates to certain high-risk systems covered by Union product legislation (Art. 6(1))."}, "source": "Regulation (EU) 2024/1689, Art. 113"}, {"id": "B5-055", "block": 5, "topic": "AI Act (Regulation (EU) 2024/1689)", "difficulty": "medium", "question": "Which of the following is a prohibited AI practice under Article 5 of the AI Act?", "options": {"A": "Using machine learning to classify enterprises by their main economic activity.", "B": "Social scoring leading to unjustified or disproportionate detrimental treatment.", "C": "Using AI-based spam filters in the institution's email system.", "D": "Using a chatbot to answer users' questions on published statistics."}, "answer": "B", "explanations": {"A": "Incorrect. This is a low-risk statistical use and not prohibited.", "B": "Correct. Art. 5(1)(c) prohibits such social scoring by any actor, public or private.", "C": "Incorrect. Typical example of minimal-risk AI.", "D": "Incorrect. This is subject at most to transparency obligations."}, "source": "Regulation (EU) 2024/1689, Art. 5(1)(c)"}, {"id": "B5-056", "block": 5, "topic": "AI Act (Regulation (EU) 2024/1689)", "difficulty": "hard", "question": "An EU agency deploys an AI system that interacts directly with members of the public through a chat interface. Which obligation applies under Article 50 of the AI Act?", "options": {"A": "The chatbot must in all cases be registered as a high-risk AI system.", "B": "People must be told they are interacting with AI, unless it is obvious.", "C": "Chatbots are prohibited in public administration under the Act.", "D": "The chatbot may only be operated and supervised by qualified lawyers in the agency."
