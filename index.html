}, "answer": "B", "explanations": {"A": "Incorrect. A chatbot is not high-risk by default; Art. 50 transparency applies.", "B": "Correct. Art. 50(1) imposes this transparency obligation on providers, ensuring the system is designed so that people are informed.", "C": "Incorrect. Chatbots are not prohibited.", "D": "Incorrect. No such requirement exists."}, "source": "Regulation (EU) 2024/1689, Art. 50(1)"}, {"id": "B5-057", "block": 5, "topic": "AI Act (Regulation (EU) 2024/1689)", "difficulty": "medium", "question": "Article 4 of the AI Act requires providers and deployers to take measures to ensure which of the following?", "options": {"A": "That all staff using AI hold a university degree in computer science.", "B": "A sufficient level of AI literacy among the staff dealing with AI.", "C": "That every AI system used is released under an open-source licence.", "D": "That AI systems are only developed in-house, never procured."}, "answer": "B", "explanations": {"A": "Incorrect. AI literacy is proportionate to context, not a degree requirement.", "B": "Correct. Art. 4 on AI literacy applies from 2 February 2025, taking into account staff's knowledge, experience, education and the context of use.", "C": "Incorrect. Open source is not mandatory.", "D": "Incorrect. The Act does not require in-house development."}, "source": "Regulation (EU) 2024/1689, Art. 4"}, {"id": "B5-058", "block": 5, "topic": "AI Act (Regulation (EU) 2024/1689)", "difficulty": "hard", "question": "Which body acts as the competent authority for the supervision of AI systems used by EU institutions, bodies, offices and agencies under the AI Act?", "options": {"A": "The European Court of Auditors.", "B": "The European Ombudsman.", "C": "The European Data Protection Supervisor (EDPS).", "D": "The national authority of the Member State where the institution is located."}, "answer": "C", "explanations": {"A": "Incorrect. The ECA audits EU finances, not AI Act compliance.", "B": "Incorrect. The Ombudsman handles maladministration complaints, not AI Act supervision.", "C": "Correct. The AI Act designates the EDPS as market surveillance authority for Union institutions, bodies, offices and agencies, and empowers it to impose administrative fines on them (Art. 100).", "D": "Incorrect. EU institutions are supervised at EU level by the EDPS."}, "source": "Regulation (EU) 2024/1689, Art. 74(9) and Art. 100"}, {"id": "B5-059", "block": 5, "topic": "AI Act (Regulation (EU) 2024/1689)", "difficulty": "hard", "question": "Which of the following systems would most likely be classified as high-risk under Annex III of the AI Act?", "options": {"A": "An AI model that detects and flags duplicate records in a statistical business register.", "B": "An AI system that ranks and filters job applications in recruitment.", "C": "An AI spell-checker integrated in a word-processing application.", "D": "An AI tool that suggests accessible colour palettes for charts."}, "answer": "B", "explanations": {"A": "Incorrect. An internal data-cleaning tool not listed in Annex III.", "B": "Correct. Annex III point 4 lists AI used in employment, including recruitment and selection, as high-risk.", "C": "Incorrect. Minimal-risk application.", "D": "Incorrect. This has no significant impact on fundamental rights or safety."}, "source": "Regulation (EU) 2024/1689, Art. 6(2) and Annex III, point 4"}, {"id": "B5-060", "block": 5, "topic": "AI Act (Regulation (EU) 2024/1689)", "difficulty": "medium", "question": "Which of the following is a requirement for high-risk AI systems under Chapter III of the AI Act?", "options": {"A": "Design that allows effective human oversight during use.", "B": "A prohibition on any automatic logging of system events.", "C": "Mandatory online publication of all the training data.", "D": "Operation without documentation to protect trade secrets."}, "answer": "A", "explanations": {"A": "Correct. Art. 14 requires that high-risk AI systems can be effectively overseen by people, alongside risk management, data governance, documentation, logging, transparency, accuracy, robustness and cybersecurity.", "B": "Incorrect. The opposite: Art. 12 requires automatic recording of events (logs).", "C": "Incorrect. The Act requires data governance and documentation, not publishing all training data.", "D": "Incorrect. Technical documentation (Art. 11) is required."}, "source": "Regulation (EU) 2024/1689, Arts. 9-15"}, {"id": "B5-061", "block": 5, "topic": "Responsible use of AI in EU institutions", "difficulty": "easy", "question": "A staff member wants to paste a draft of a non-public statistical release into a publicly available online generative AI tool to improve its wording. What is the appropriate action?", "options": {"A": "Paste it, provided the release is published within a week.", "B": "Paste it if the tool's website states that it is secure.", "C": "Do not paste it; use an approved internal tool if available.", "D": "Paste only the most important tables, not the full text."}, "answer": "C", "explanations": {"A": "Incorrect. Pre-release information is confidential until publication.", "B": "Incorrect. Data entered may be stored or used by the provider; institutional rules prevail.", "C": "Correct. Commission guidelines on generative AI tell staff never to share information that is not already public, or personal data, with publicly available online generative AI services.", "D": "Incorrect. Tables are equally non-public."}, "source": "European Commission guidelines for staff on the use of online generative AI tools (2023/2024)"}, {"id": "B5-062", "block": 5, "topic": "Responsible use of AI in EU institutions", "difficulty": "medium", "question": "An official uses a generative AI tool to draft a briefing note. Who is responsible for the content of the final note?", "options": {"A": "The IT department that installed the tool on the computer.", "B": "The provider of the generative AI tool used to draft it.", "C": "The official, who must check the output and stays accountable.", "D": "No one, because the content was generated automatically."}, "answer": "C", "explanations": {"A": "Incorrect. IT provides the tool, not the content.", "B": "Incorrect. The provider is not accountable for how staff use outputs in official documents.", "C": "Correct. Staff remain responsible for content they produce, including AI-assisted output; human review is essential.", "D": "Incorrect. Accountability does not disappear with automation."}, "source": "European Commission guidelines for staff on generative AI; Regulation (EU) 2024/1689, Art. 4"}, {"id": "B5-063", "block": 5, "topic": "Responsible use of AI in EU institutions", "difficulty": "hard", "question": "An EU body plans to use an AI system to prioritise inspections. Which practice best reflects responsible AI use as promoted by EU guidance?", "options": {"A": "Keep the system's use secret so that it cannot be manipulated.", "B": "Let it decide automatically with no human review at all, to avoid any human bias.", "C": "Deploy it quickly and investigate only if complaints start to arise.", "D": "Assess risks and bias first, document it, keep human oversight, monitor."}, "answer": "D", "explanations": {"A": "Incorrect. Transparency is a core principle.", "B": "Incorrect. Removing humans does not remove bias and conflicts with human oversight principles.", "C": "Incorrect. Reactive approaches fail to prevent harm.", "D": "Correct. Responsible AI combines risk assessment, transparency, documentation, human oversight and continuous monitoring, in line with the AI Act and the HLEG Ethics Guidelines."}, "source": "High-Level Expert Group on AI, Ethics Guidelines for Trustworthy AI (2019); Regulation (EU) 2024/1689"}, {"id": "B5-064", "block": 5, "topic": "Responsible use of AI in EU institutions", "difficulty": "medium", "question": "The Ethics Guidelines for Trustworthy AI of the European Commission's High-Level Expert Group (2019) state that trustworthy AI should be:", "options": {"A": "Lawful, ethical and robust.", "B": "Fast, cheap and proprietary.", "C": "Open source, cloud-based and free.", "D": "Autonomous, opaque and self-regulating."}, "answer": "A", "explanations": {"A": "Correct. The guidelines identify these three components and seven key requirements, such as human agency and oversight, and transparency.", "B": "Incorrect. These are not components of trustworthy AI.", "C": "Incorrect. Not components defined in the guidelines.", "D": "Incorrect. These conflict with the guidelines' emphasis on oversight and transparency."}, "source": "High-Level Expert Group on AI, Ethics Guidelines for Trustworthy AI (2019)"}, {"id": "S1-001", "block": 1, "topic": "Sampling", "difficulty": "medium", "question": "A survey divides the population into regions and then draws a simple random sample independently within each region. Which sampling design is this?", "options": {"A": "Cluster sampling", "B": "Stratified sampling", "C": "Systematic sampling", "D": "Quota sampling"}, "answer": "B", "explanations": {"A": "Cluster sampling selects whole groups at random and surveys units inside the selected groups only; here every region is sampled.", "B": "Correct. Sampling independently within every predefined group (stratum) is stratified sampling.", "C": "Systematic sampling picks every k-th unit from an ordered list; no strata are involved.", "D": "Quota sampling fills fixed quotas non-randomly; the scenario uses random selection."}, "source": "Muestra (provisional)"}, {"id": "S1-002", "block": 1, "topic": "SDMX", "difficulty": "easy", "question": "In SDMX, which artefact defines the dimensions, attributes and measures that structure a dataset?", "options": {"A": "Codelist", "B": "Dataflow", "C": "Data Structure Definition (DSD)", "D": "Concept scheme"}, "answer": "C", "explanations": {"A": "A codelist lists the allowed values for one dimension or attribute, not the full structure.", "B": "A dataflow describes a data collection and points to a DSD; it does not itself define the structure.", "C": "Correct. The DSD specifies the dimensions, attributes and measures of a dataset.", "D": "A concept scheme groups concepts used by DSDs but does not assign them structural roles."}, "source": "Muestra (provisional)"}, {"id": "S2-001", "block": 2, "topic": "Missing data", "difficulty": "medium", "question": "Missingness in an income variable depends only on respondents' age, which is fully observed. How is this mechanism classified?", "options": {"A": "Missing completely at random (MCAR)", "B": "Missing at random (MAR)", "C": "Missing not at random (MNAR)", "D": "Structural zero"}, "answer": "B", "explanations": {"A": "MCAR requires missingness unrelated to any variable; here it depends on age.", "B": "Correct. Missingness depending only on observed variables is MAR.", "C": "MNAR would mean missingness depends on the unobserved income itself.", "D": "A structural zero is a value that is logically zero, not a missingness mechanism."}, "source": "Muestra (provisional)"}, {"id": "S2-002", "block": 2, "topic": "Outliers", "difficulty": "easy", "question": "Using the IQR rule, Q1 = 20 and Q3 = 40. Above which value is an observation flagged as an outlier?", "options": {"A": "60", "B": "70", "C": "80", "D": "50"}, "answer": "B", "explanations": {"A": "60 is Q3 + 1 × IQR; the rule uses 1.5 × IQR.", "B": "Correct. IQR = 20, so the upper fence is 40 + 1.5 × 20 = 70.", "C": "80 is Q3 + 2 × IQR.", "D": "50 is Q3 + 0.5 × IQR."}, "source": "Muestra (provisional)"}, {"id": "S3-001", "block": 3, "topic": "Regulation (EU) 2018/1725", "difficulty": "medium", "question": "Under Regulation (EU) 2018/1725, which body supervises the processing of personal data by EU institutions and bodies?", "options": {"A": "The European Data Protection Board", "B": "The national data protection authority of the host Member State", "C": "The European Data Protection Supervisor", "D": "The European Ombudsman"}, "answer": "C", "explanations": {"A": "The EDPB ensures consistent application of the GDPR among national authorities; it does not supervise EU institutions.", "B": "National authorities supervise processing under the GDPR, not by EU institutions.", "C": "Correct. The EDPS is the independent supervisory authority for EU institutions, bodies, offices and agencies.", "D": "The Ombudsman handles maladministration complaints, not data protection supervision."}, "source": "Muestra (provisional)"}, {"id": "S3-002", "block": 3, "topic": "Statistical confidentiality", "difficulty": "medium", "question": "A table cell shows a turnover total contributed by only two enterprises. What is the main disclosure risk?", "options": {"A": "Each contributor can deduce the other's value by subtraction", "B": "The total is statistically insignificant", "C": "The cell violates the open data principle", "D": "The cell must be rounded to the nearest thousand"}, "answer": "A", "explanations": {"A": "Correct. With two contributors, either one can subtract its own value from the total and learn the other's.", "B": "Significance is unrelated to disclosure control.", "C": "Open data does not override confidentiality; the risk is disclosure, not openness.", "D": "Rounding is one possible protection method, not the risk itself."}, "source": "Muestra (provisional)"}, {"id": "S4-001", "block": 4, "topic": "SQL", "difficulty": "medium", "question": "Which clause filters groups after aggregation in SQL?", "options": {"A": "WHERE", "B": "GROUP BY", "C": "HAVING", "D": "ORDER BY"}, "answer": "C", "explanations": {"A": "WHERE filters rows before grouping and cannot use aggregate results.", "B": "GROUP BY forms the groups but does not filter them.", "C": "Correct. HAVING applies conditions to aggregated groups.", "D": "ORDER BY sorts the result; it does not filter."}, "source": "Muestra (provisional)"}, {"id": "S4-002", "block": 4, "topic": "Machine learning", "difficulty": "hard", "question": "A classifier detects a rare fraud class (1% of cases) with 99% accuracy by predicting 'no fraud' for every case. Which metric best exposes the problem?", "options": {"A": "Accuracy", "B": "Recall for the fraud class", "C": "Mean squared error", "D": "R-squared"}, "answer": "B", "explanations": {"A": "Accuracy is what hides the problem in imbalanced data.", "B": "Correct. Recall for the fraud class is 0, revealing that no fraud is detected.", "C": "MSE is a regression metric.", "D": "R-squared measures explained variance in regression."}, "source": "Muestra (provisional)"}, {"id": "S5-001", "block": 5, "topic": "Visualisation", "difficulty": "easy", "question": "Which chart is most appropriate to show how a monthly indicator evolves over five years?", "options": {"A": "Pie chart", "B": "Line chart", "C": "Scatter plot matrix", "D": "Treemap"}, "answer": "B", "explanations": {"A": "Pie charts show parts of a whole at one point in time.", "B": "Correct. Line charts show change over continuous time.", "C": "A scatter plot matrix explores relationships between several variables.", "D": "Treemaps show hierarchical part-to-whole structure."}, "source": "Muestra (provisional)"}, {"id": "S5-002", "block": 5, "topic": "Artificial intelligence", "difficulty": "medium", "question": "Under the EU AI Act, which category of AI systems is subject to the strictest obligations short of prohibition?", "options": {"A": "Minimal-risk systems", "B": "Limited-risk systems", "C": "High-risk systems", "D": "General-purpose spreadsheets"}, "answer": "C", "explanations": {"A": "Minimal-risk systems face essentially no new obligations.", "B": "Limited-risk systems mainly face transparency obligations.", "C": "Correct. High-risk systems must meet requirements such as risk management, data governance and human oversight.", "D": "Spreadsheets are not an AI Act risk category."}, "source": "Muestra (provisional)"}, {"id": "VR-001", "section": "verbal", "block": 1, "topic": "Agricultura", "difficulty": "medium", "passage": "En una región del sur de Europa, un grupo de agricultores sustituyó el riego por inundación por un sistema de goteo en sus olivares. Durante las dos campañas siguientes, el consumo de agua por hectárea se redujo aproximadamente un 40 %, mientras que la producción de aceituna se mantuvo estable. Sin embargo, la instalación exigió una inversión inicial elevada que muchas explotaciones pequeñas solo pudieron afrontar gracias a ayudas públicas. Los técnicos advierten de que el ahorro de agua en cada finca no siempre se traduce en un ahorro para la cuenca, porque algunos agricultores aprovechan el agua sobrante para ampliar la superficie regada.", "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "Reducir el consumo de agua en una finca puede no reducir el consumo total de la cuenca.", "B": "El riego por goteo redujo el consumo de agua de la cuenca en un 40 %.", "C": "El riego por goteo aumentó la producción de aceituna en las dos campañas.", "D": "Todas las explotaciones pequeñas necesitaron ayudas públicas para instalar el goteo."}, "answer": "A", "explanations": {"A": "Verdadero. Los técnicos advierten que el ahorro en cada finca no siempre supone un ahorro para la cuenca, porque el agua sobrante puede usarse para regar más superficie.", "B": "Falso. La reducción del 40 % se refiere al consumo por hectárea en las fincas, no al de la cuenca, que el texto dice que puede no bajar.", "C": "Falso. El texto dice que la producción se mantuvo estable, no que aumentara.", "D": "No se puede saber. El texto dice que muchas explotaciones pequeñas necesitaron ayudas, no todas."}, "source": "Original"}, {"id": "VR-002", "section": "verbal", "block": 1, "topic": "Historia", "difficulty": "medium", "passage": "El primer servicio postal regular entre varias ciudades europeas se organizó a finales del siglo XV para transportar la correspondencia de una casa real. Los mensajeros se relevaban en postas situadas a intervalos fijos, lo que permitía que una carta recorriera cientos de kilómetros en pocos días. Durante décadas, el servicio estuvo reservado a la corte, pero a partir del siglo XVI se permitió que los particulares enviaran cartas pagando una tarifa. Esta apertura convirtió el correo en una fuente de ingresos y contribuyó a que la familia que lo gestionaba acumulara una gran fortuna.", "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "Los mensajeros recorrían cientos de kilómetros sin detenerse.", "B": "El servicio postal se creó en el siglo XVI.", "C": "Desde su creación, cualquier persona podía enviar cartas a través del servicio.", "D": "El servicio se volvió rentable cuando admitió envíos de particulares."}, "answer": "D", "explanations": {"A": "Falso. Los mensajeros se relevaban en postas a intervalos fijos; era la carta la que recorría cientos de kilómetros.", "B": "Falso. Se organizó a finales del siglo XV; el siglo XVI es cuando se abrió a particulares.", "C": "Falso. Durante décadas estuvo reservado a la corte; los particulares solo pudieron usarlo a partir del siglo XVI.", "D": "Verdadero. El texto dice que la apertura a particulares, que pagaban una tarifa, convirtió el correo en una fuente de ingresos."}, "source": "Original"}, {"id": "VR-003", "section": "verbal", "block": 1, "topic": "Salud", "difficulty": "hard", "passage": "Un estudio siguió durante diez años a 12 000 adultos y observó que quienes bebían dos o más tazas de café al día tenían menos probabilidades de desarrollar una determinada enfermedad hepática. Los autores subrayan que el estudio es observacional: los bebedores de café también fumaban menos y hacían más ejercicio, y aunque ajustaron sus cálculos por esos factores, no pueden descartar otros que no midieron. Por ello, no recomiendan empezar a beber café para prevenir la enfermedad, aunque consideran que quienes ya lo toman no tienen motivos para dejarlo.", "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "Otros factores no medidos podrían explicar parte de la asociación observada.", "B": "El estudio demuestra que el café protege contra la enfermedad hepática.", "C": "Los autores aconsejan a los no bebedores de café que empiecen a tomarlo.", "D": "Los autores no tuvieron en cuenta el tabaco ni el ejercicio en sus cálculos."}, "answer": "A", "explanations": {"A": "Verdadero. Los autores reconocen que no pueden descartar factores que no midieron.", "B": "Falso. Al ser observacional, el estudio muestra una asociación, no una relación causal; los propios autores lo subrayan.", "C": "Falso. El texto dice expresamente que no recomiendan empezar a beber café para prevenir la enfermedad.", "D": "Falso. Los autores sí ajustaron sus cálculos por el tabaco y el ejercicio."}, "source": "Original"}, {"id": "VR-004", "section": "verbal", "block": 1, "topic": "Medio ambiente", "difficulty": "medium", "passage": "Las praderas de posidonia, una planta marina endémica del Mediterráneo, almacenan grandes cantidades de carbono en sus raíces y en el sedimento que retienen. Crecen muy despacio: una pradera dañada por el ancla de una embarcación puede tardar siglos en recuperarse. Algunas zonas costeras han instalado boyas de amarre para que los barcos no tengan que fondear sobre las praderas. Aunque las boyas han reducido los daños por anclaje donde existen, las praderas siguen amenazadas por el aumento de la temperatura del agua y por los vertidos.", "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "La posidonia almacena carbono únicamente en sus hojas.", "B": "Las boyas de amarre han eliminado las amenazas para las praderas de posidonia.", "C": "La posidonia solo se encuentra en el mar Mediterráneo.", "D": "Una pradera dañada se recupera en pocos años si se instalan boyas."}, "answer": "C", "explanations": {"A": "Falso. El texto dice que almacena carbono en sus raíces y en el sedimento, no en las hojas.", "B": "Falso. Las boyas reducen los daños por anclaje, pero las praderas siguen amenazadas por la temperatura del agua y los vertidos.", "C": "Verdadero. El texto la describe como endémica del Mediterráneo, es decir, propia exclusivamente de ese mar.", "D": "Falso. El texto dice que la recuperación puede tardar siglos y no relaciona las boyas con una recuperación más rápida."}, "source": "Original"}, {"id": "VR-005", "section": "verbal", "block": 1, "topic": "Economía", "difficulty": "hard", "passage": "Cuando una ciudad introdujo una tasa diaria para los vehículos que entraban en su centro, el tráfico en la zona tasada cayó un 18 % durante el primer año. Los comercios del centro temían perder clientes, pero sus ventas totales apenas variaron, aunque algunos negocios que dependían de clientes en coche sí registraron pérdidas. Parte de lo recaudado se destinó a ampliar la red de autobuses. Al cabo de cinco años, el tráfico había vuelto a crecer, sobre todo por el aumento de furgonetas de reparto, que en su mayoría estaban exentas de la tasa.", "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "Ningún comercio del centro perdió ventas por la tasa.", "B": "El aumento del tráfico a los cinco años se debió sobre todo a vehículos que en general no pagaban la tasa.", "C": "Toda la recaudación se destinó a ampliar la red de autobuses.", "D": "El tráfico en la zona tasada se redujo un 18 % de forma permanente."}, "answer": "B", "explanations": {"A": "Falso. Las ventas totales apenas variaron, pero algunos negocios que dependían de clientes en coche sí perdieron ventas.", "B": "Verdadero. El texto atribuye el nuevo crecimiento sobre todo a las furgonetas de reparto, en su mayoría exentas.", "C": "Falso. El texto dice que se destinó parte de lo recaudado, no toda la recaudación.", "D": "Falso. La caída del 18 % se refiere al primer año; a los cinco años el tráfico había vuelto a crecer."}, "source": "Original"}, {"id": "VR-006", "section": "verbal", "block": 1, "topic": "Tecnología", "difficulty": "medium", "passage": "Las baterías de iones de litio pierden capacidad con el uso y con el paso del tiempo, incluso si no se utilizan. El deterioro es más rápido cuando la batería se mantiene durante largos periodos con la carga completa o a temperaturas elevadas. Por este motivo, algunos fabricantes de vehículos eléctricos recomiendan cargar habitualmente hasta el 80 % y reservar la carga completa para los viajes largos. Una batería que ya no sirve para un coche suele conservar suficiente capacidad para almacenar energía en instalaciones fijas, como edificios con paneles solares.", "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "Las baterías retiradas de los coches ya no pueden almacenar energía.", "B": "Una batería de iones de litio que no se usa conserva intacta su capacidad.", "C": "Todos los fabricantes recomiendan no cargar nunca la batería por completo.", "D": "Mantener la batería al 100 % durante mucho tiempo acelera su deterioro."}, "answer": "D", "explanations": {"A": "Falso. El texto dice que suelen conservar capacidad suficiente para almacenar energía en instalaciones fijas.", "B": "Falso. El texto dice que pierden capacidad con el tiempo incluso si no se utilizan.", "C": "Falso. Lo recomiendan algunos fabricantes, no todos, y aconsejan reservar la carga completa para viajes largos, no evitarla siempre.", "D": "Verdadero. El deterioro es más rápido cuando la batería se mantiene mucho tiempo con la carga completa."}, "source": "Original"}, {"id": "VR-007", "section": "verbal", "block": 1, "topic": "Educación", "difficulty": "hard", "passage": "Un programa piloto ofreció tutorías de lectura de dos horas semanales a alumnos de primaria con dificultades. Tras un curso, los participantes mejoraron su comprensión lectora más que un grupo de control de características similares. La mejora fue mayor entre quienes asistieron a más del 75 % de las sesiones. Los evaluadores señalan, no obstante, que los tutores eran voluntarios muy motivados y que no está claro que los resultados se repitan si el programa se extiende a todas las escuelas con personal contratado.", "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "Una mayor asistencia a las tutorías se asoció con una mejora mayor.", "B": "La extensión del programa a todas las escuelas producirá los mismos resultados.", "C": "Los alumnos que asistieron a menos sesiones no mejoraron nada.", "D": "Los tutores del programa piloto eran profesionales contratados."}, "answer": "A", "explanations": {"A": "Verdadero. La mejora fue mayor entre quienes asistieron a más del 75 % de las sesiones.", "B": "Falso. Los evaluadores dicen que no está claro que los resultados se repitan al extender el programa.", "C": "No se puede saber. El texto solo dice que la mejora fue mayor con más asistencia, no que los demás no mejoraran.", "D": "Falso. Los tutores eran voluntarios; el personal contratado se menciona para una posible extensión."}, "source": "Original"}, {"id": "VR-008", "section": "verbal", "block": 1, "topic": "Ciencia", "difficulty": "medium", "passage": "Las abejas melíferas comunican la ubicación de una fuente de alimento mediante una danza. El ángulo de la danza respecto a la vertical del panal indica la dirección del alimento en relación con el sol, y la duración de una parte de la danza indica la distancia. Las abejas que observan la danza no reciben un mapa exacto, sino una indicación aproximada, y completan la búsqueda guiándose por el olor. Los experimentos muestran que las colonias aprovechan mejor esta información cuando el alimento está disperso en pocas zonas abundantes que cuando está repartido de forma uniforme.", "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "La danza indica la distancia mediante el ángulo respecto a la vertical.", "B": "Las abejas que observan la danza recurren también al olor para encontrar el alimento.", "C": "La danza es más útil cuando el alimento está repartido de forma uniforme.", "D": "La danza proporciona la ubicación exacta del alimento."}, "answer": "B", "explanations": {"A": "Falso. El ángulo indica la dirección; la distancia se indica con la duración de una parte de la danza.", "B": "Verdadero. El texto dice que completan la búsqueda guiándose por el olor.", "C": "Falso. Es al revés: las colonias aprovechan mejor la información cuando el alimento está concentrado en pocas zonas.", "D": "Falso. El texto dice que no reciben un mapa exacto, sino una indicación aproximada."}, "source": "Original"}, {"id": "VR-009", "section": "verbal", "block": 1, "topic": "Administración", "difficulty": "medium", "passage": "Desde que un ayuntamiento permitió presentar en línea las solicitudes de licencia de obra menor, el tiempo medio de tramitación bajó de 45 a 20 días. El cambio no afectó a las licencias de obra mayor, que siguen requiriendo la presentación de planos en papel. El ayuntamiento atribuye la mejora sobre todo a que el sistema rechaza automáticamente las solicitudes incompletas, lo que antes obligaba a los funcionarios a pedir documentación adicional por correo. Algunos colectivos señalan que las personas mayores tienen más dificultades para usar el nuevo sistema.", "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "Las personas mayores no pueden presentar solicitudes en línea.", "B": "El tiempo de tramitación de todas las licencias se redujo a 20 días.", "C": "Según el ayuntamiento, el principal motivo de la mejora es el control automático de las solicitudes incompletas.", "D": "Las licencias de obra mayor ya pueden presentarse íntegramente en línea."}, "answer": "C", "explanations": {"A": "Falso. El texto dice que tienen más dificultades, no que no puedan usar el sistema.", "B": "Falso. La reducción se refiere a las licencias de obra menor; las de obra mayor no se vieron afectadas.", "C": "Verdadero. El ayuntamiento atribuye la mejora sobre todo al rechazo automático de solicitudes incompletas.", "D": "Falso. Las licencias de obra mayor siguen requiriendo planos en papel."}, "source": "Original"}, {"id": "VR-010", "section": "verbal", "block": 1, "topic": "Cultura", "difficulty": "hard", "passage": "Un museo decidió ampliar su horario hasta las diez de la noche los jueves. En los seis meses siguientes, el número de visitantes de los jueves aumentó un 30 %, y la proporción de visitantes menores de 35 años en esa franja duplicó la del resto de la semana. Sin embargo, el número total de visitantes semanales solo creció un 4 %, porque parte del público que antes acudía otros días pasó a hacerlo el jueves por la noche. La dirección considera que la medida ha merecido la pena porque ha atraído a un público que antes no visitaba el museo.", "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "Parte del aumento de los jueves procede de visitantes que cambiaron de día.", "B": "La proporción de jóvenes aumentó un 30 % en toda la semana.", "C": "El número total de visitantes semanales creció un 30 %.", "D": "Todos los visitantes de los jueves por la noche eran nuevos."}, "answer": "A", "explanations": {"A": "Verdadero. El texto atribuye el escaso crecimiento total a que parte del público se trasladó al jueves por la noche.", "B": "Falso. El texto compara la proporción de jóvenes en la franja del jueves con el resto de la semana; no habla de un aumento del 30 %.", "C": "Falso. El 30 % se refiere a los visitantes de los jueves; el total semanal solo creció un 4 %.", "D": "Falso. El texto dice que parte del público que antes iba otros días pasó a ir el jueves."}, "source": "Original"}, {"topic": "Transporte", "difficulty": "medium", "passage": "Una ciudad sustituyó la mitad de sus autobuses diésel por autobuses eléctricos en 2021. Los nuevos vehículos son más caros de comprar, pero su mantenimiento cuesta aproximadamente un 30 % menos y el precio de la electricidad por kilómetro es inferior al del gasóleo. La empresa municipal calcula que la inversión se amortizará en unos ocho años. En invierno, sin embargo, la autonomía de las baterías se reduce y algunas líneas largas siguen cubriéndose con autobuses diésel.", "id": "VR-011", "section": "verbal", "block": 1, "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "El mantenimiento de los autobuses eléctricos es más barato que el de los diésel.", "B": "La inversión ya se ha amortizado por completo.", "C": "Los autobuses eléctricos cuestan menos de comprar que los diésel.", "D": "Desde 2021 todas las líneas de la ciudad funcionan con autobuses eléctricos."}, "answer": "A", "explanations": {"A": "Verdadero. Su mantenimiento cuesta aproximadamente un 30 % menos.", "B": "Falso. La empresa calcula que se amortizará en unos ocho años, contados desde 2021.", "C": "Falso. El texto dice que son más caros de comprar.", "D": "Falso. Solo se sustituyó la mitad de la flota y algunas líneas largas siguen con diésel."}, "source": "Original"}, {"topic": "Derecho de la UE", "difficulty": "hard", "passage": "Los reglamentos de la Unión Europea son obligatorios en todos sus elementos y directamente aplicables en todos los Estados miembros, sin necesidad de normas nacionales de transposición. Las directivas, en cambio, obligan a los Estados miembros en cuanto al resultado que debe alcanzarse, pero dejan a las autoridades nacionales la elección de la forma y los medios. Cuando un Estado no transpone una directiva a tiempo, los particulares pueden, en determinadas condiciones, invocar algunas de sus disposiciones frente a ese Estado.", "id": "VR-012", "section": "verbal", "block": 1, "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "Un reglamento necesita una ley nacional para aplicarse en un Estado miembro.", "B": "Las directivas fijan el resultado, pero no la forma de alcanzarlo.", "C": "Los particulares siempre pueden invocar cualquier directiva no transpuesta.", "D": "Las directivas son directamente aplicables igual que los reglamentos."}, "answer": "B", "explanations": {"A": "Falso. Los reglamentos son directamente aplicables sin normas nacionales de transposición.", "B": "Verdadero. Obligan en cuanto al resultado y dejan a cada Estado la elección de la forma y los medios.", "C": "Falso. Solo en determinadas condiciones y respecto de algunas disposiciones.", "D": "Falso. El texto contrapone ambos actos: las directivas requieren transposición."}, "source": "Original"}, {"topic": "Biología", "difficulty": "medium", "passage": "Muchas aves migratorias se orientan gracias a varias señales a la vez: la posición del sol durante el día, las estrellas por la noche y el campo magnético terrestre. Los experimentos con aves criadas en cautividad muestran que algunas especies aprenden a reconocer las constelaciones durante su primer verano, observando el punto del cielo alrededor del cual giran las estrellas. Cuando el cielo está cubierto, las aves pueden seguir orientándose mediante el campo magnético, aunque con menos precisión.", "id": "VR-013", "section": "verbal", "block": 1, "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "El campo magnético es la señal de orientación más precisa.", "B": "Con el cielo cubierto, las aves pierden por completo la orientación.", "C": "Todas las aves migratorias nacen sabiendo reconocer las constelaciones.", "D": "Algunas especies aprenden a orientarse por las estrellas en su primer verano."}, "answer": "D", "explanations": {"A": "No se puede saber, y el texto sugiere lo contrario: sin el cielo, la orientación es menos precisa.", "B": "Falso. Siguen orientándose con el campo magnético, aunque con menos precisión.", "C": "Falso. El texto dice que algunas especies lo aprenden, no que sea innato en todas.", "D": "Verdadero. Es lo que muestran los experimentos con aves criadas en cautividad."}, "source": "Original"}, {"topic": "Trabajo", "difficulty": "hard", "passage": "Una empresa probó durante seis meses la semana laboral de cuatro días sin reducir los salarios. La productividad por hora aumentó, y la producción total se mantuvo prácticamente igual que en el mismo periodo del año anterior. Las bajas por enfermedad disminuyeron un 25 %. Algunos departamentos de atención al cliente tuvieron que organizar turnos para cubrir los cinco días, lo que generó quejas sobre la complejidad de los horarios. La dirección ha decidido mantener el sistema, salvo en esos departamentos, que volverán a la semana de cinco días.", "id": "VR-014", "section": "verbal", "block": 1, "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "La productividad por hora mejoró durante la prueba.", "B": "La producción total aumentó un 25 % durante la prueba.", "C": "Todos los departamentos mantendrán la semana de cuatro días.", "D": "Durante la prueba se redujeron los salarios en proporción a las horas."}, "answer": "A", "explanations": {"A": "Verdadero. El texto dice expresamente que la productividad por hora aumentó.", "B": "Falso. La producción total se mantuvo prácticamente igual; el 25 % se refiere a la reducción de las bajas.", "C": "Falso. Los departamentos de atención al cliente volverán a la semana de cinco días.", "D": "Falso. La prueba se hizo sin reducir los salarios."}, "source": "Original"}, {"topic": "Alimentación", "difficulty": "medium", "passage": "El etiquetado frontal de alimentos con una escala de colores pretende ayudar a los consumidores a comparar productos de una misma categoría de un vistazo. Un estudio en supermercados observó que, tras su introducción, aumentaron las ventas de los cereales de desayuno con mejor calificación. El efecto fue menor en categorías como los aperitivos, donde los compradores parecen guiarse más por el sabor y la marca. Los autores señalan que la escala resume el perfil nutricional, pero no informa sobre el grado de procesamiento del alimento.", "id": "VR-015", "section": "verbal", "block": 1, "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "La escala sirve sobre todo para comparar productos de categorías distintas.", "B": "La escala informa del grado de procesamiento de los alimentos.", "C": "El etiquetado tuvo un efecto mayor en los cereales que en los aperitivos.", "D": "Las ventas de aperitivos con peor calificación desaparecieron."}, "answer": "C", "explanations": {"A": "Falso. Pretende ayudar a comparar productos de una misma categoría.", "B": "Falso. Los autores señalan que no informa sobre el grado de procesamiento.", "C": "Verdadero. El efecto se observó en los cereales y fue menor en los aperitivos.", "D": "Falso. El texto solo dice que el efecto en los aperitivos fue menor."}, "source": "Original"}, {"topic": "Patrimonio", "difficulty": "medium", "passage": "Un monasterio medieval recibe cada año más de un millón de visitantes. Para proteger los frescos de su iglesia, sensibles a la humedad que generan las personas, la administración limitó el aforo a 50 visitantes simultáneos y estableció la reserva previa obligatoria en temporada alta. Los ingresos por entradas no disminuyeron, porque se amplió el horario de apertura. Los comerciantes de la localidad, en cambio, afirman que las visitas son ahora más cortas y que se ha reducido el gasto en sus establecimientos.", "id": "VR-016", "section": "verbal", "block": 1, "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "La humedad no afecta a los frescos de la iglesia.", "B": "La reserva previa es obligatoria durante todo el año.", "C": "La limitación del aforo redujo los ingresos por entradas.", "D": "Según los comerciantes, los visitantes gastan ahora menos en la localidad."}, "answer": "D", "explanations": {"A": "Falso. El aforo se limitó precisamente porque los frescos son sensibles a la humedad.", "B": "Falso. La reserva previa solo es obligatoria en temporada alta.", "C": "Falso. Los ingresos no disminuyeron porque se amplió el horario.", "D": "Verdadero. Los comerciantes afirman que se ha reducido el gasto en sus establecimientos."}, "source": "Original"}, {"topic": "Clima", "difficulty": "hard", "passage": "Las olas de calor urbanas son más intensas que en el campo circundante por el llamado efecto isla de calor: el asfalto y el hormigón absorben radiación durante el día y la liberan por la noche. Por ello, la diferencia de temperatura entre ciudad y campo suele ser mayor de noche que de día. Plantar árboles reduce la temperatura de las calles gracias a la sombra y a la evaporación de agua por las hojas, pero su efecto depende de que dispongan de agua suficiente durante el verano.", "id": "VR-017", "section": "verbal", "block": 1, "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "El efecto isla de calor solo se produce en ciudades costeras.", "B": "Los materiales urbanos liberan por la noche el calor absorbido durante el día.", "C": "La diferencia de temperatura entre ciudad y campo suele ser mayor de día.", "D": "Los árboles refrescan las calles en cualquier condición, tengan o no agua."}, "answer": "B", "explanations": {"A": "No se puede saber. El texto no menciona las ciudades costeras.", "B": "Verdadero. El asfalto y el hormigón absorben radiación de día y la liberan de noche.", "C": "Falso. El texto dice que suele ser mayor de noche.", "D": "Falso. Su efecto depende de que dispongan de agua suficiente."}, "source": "Original"}, {"topic": "Economía digital", "difficulty": "medium", "passage": "Las tiendas en línea de pequeño tamaño dependen cada vez más de las grandes plataformas de comercio electrónico para llegar a los clientes. Las plataformas les ofrecen visibilidad y servicios logísticos, a cambio de comisiones que pueden superar el 15 % del precio de venta. Un informe reciente señala que muchas pequeñas empresas aceptan estas condiciones porque crear su propia tienda en línea y atraer tráfico les resulta más caro. El informe recomienda reforzar la transparencia de los algoritmos que determinan el orden en que aparecen los productos.", "id": "VR-018", "section": "verbal", "block": 1, "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "Para muchas pequeñas empresas, vender por su cuenta resulta más caro.", "B": "El informe recomienda prohibir las comisiones de las plataformas.", "C": "Las plataformas no ofrecen servicios logísticos.", "D": "Las comisiones de las plataformas nunca superan el 15 % del precio."}, "answer": "A", "explanations": {"A": "Verdadero. Crear su propia tienda y atraer tráfico les resulta más caro.", "B": "Falso. Recomienda reforzar la transparencia de los algoritmos, no prohibir las comisiones.", "C": "Falso. El texto dice que ofrecen visibilidad y servicios logísticos.", "D": "Falso. Pueden superar el 15 %."}, "source": "Original"}, {"topic": "Salud pública", "difficulty": "hard", "passage": "Un país introdujo un impuesto sobre las bebidas azucaradas proporcional a su contenido de azúcar. En los dos años siguientes, muchos fabricantes reformularon sus productos para situarse por debajo del umbral gravado, de modo que la cantidad total de azúcar vendida en refrescos bajó, aunque el volumen total de bebidas vendidas apenas cambió. La recaudación fue inferior a la prevista precisamente por esa reformulación. Las autoridades consideran que el impuesto ha cumplido su objetivo principal.", "id": "VR-019", "section": "verbal", "block": 1, "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "Los fabricantes no modificaron la composición de sus productos.", "B": "El volumen de bebidas vendidas cayó de forma notable.", "C": "La recaudación superó las previsiones.", "D": "Según las autoridades, el objetivo principal era reducir el azúcar consumido, no recaudar."}, "answer": "D", "explanations": {"A": "Falso. Muchos fabricantes reformularon sus productos.", "B": "Falso. El volumen total apenas cambió.", "C": "Falso. Fue inferior a la prevista.", "D": "Verdadero. Las autoridades consideran cumplido el objetivo principal pese a recaudar menos, lo que indica que el objetivo era reducir el azúcar."}, "source": "Original"}, {"topic": "Instituciones de la UE", "difficulty": "medium", "passage": "El Tribunal de Cuentas Europeo examina si los fondos de la Unión se han recaudado y utilizado de forma legal y regular, y si se han gestionado correctamente. Publica un informe anual sobre la ejecución del presupuesto, además de informes especiales sobre ámbitos concretos. El Tribunal no tiene competencias jurisdiccionales: cuando detecta posibles fraudes, transmite la información a la Oficina Europea de Lucha contra el Fraude o a la Fiscalía Europea, que son las que investigan.", "id": "VR-020", "section": "verbal", "block": 1, "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "La Fiscalía Europea es la encargada de auditar el presupuesto.", "B": "El Tribunal comunica los posibles fraudes a otros órganos para que investiguen.", "C": "El Tribunal de Cuentas Europeo puede juzgar y condenar los casos de fraude.", "D": "El Tribunal solo publica un informe anual."}, "answer": "B", "explanations": {"A": "Falso. La auditoría corresponde al Tribunal; la Fiscalía investiga los posibles fraudes.", "B": "Verdadero. Transmite la información a la OLAF o a la Fiscalía Europea.", "C": "Falso. El texto dice que no tiene competencias jurisdiccionales.", "D": "Falso. También publica informes especiales sobre ámbitos concretos."}, "source": "Original"}, {"topic": "Lenguas", "difficulty": "medium", "passage": "Se calcula que en el mundo se hablan unas 7 000 lenguas, pero cerca de la mitad podrían dejar de hablarse antes de que acabe el siglo. Una lengua corre peligro sobre todo cuando los padres dejan de transmitirla a sus hijos, aunque siga habiendo muchos hablantes adultos. Algunos programas de revitalización han logrado aumentar el número de niños que aprenden una lengua minoritaria, especialmente cuando se enseña en la escuela y se usa en los medios de comunicación.", "id": "VR-021", "section": "verbal", "block": 1, "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "Una lengua con muchos hablantes adultos no puede estar en peligro.", "B": "Ningún programa de revitalización ha tenido éxito.", "C": "La transmisión de padres a hijos es clave para la supervivencia de una lengua.", "D": "Se prevé que desaparezcan las 7 000 lenguas del mundo antes de fin de siglo."}, "answer": "C", "explanations": {"A": "Falso. Puede estar en peligro si los padres dejan de transmitirla, aunque haya muchos hablantes adultos.", "B": "Falso. Algunos programas han logrado aumentar el número de niños que aprenden la lengua.", "C": "Verdadero. El peligro aparece sobre todo cuando se interrumpe esa transmisión.", "D": "Falso. Se habla de cerca de la mitad, no de todas."}, "source": "Original"}, {"topic": "Vivienda", "difficulty": "hard", "passage": "En una ciudad, el número de pisos destinados al alquiler turístico se triplicó en cinco años. En el mismo periodo, el alquiler residencial medio subió un 40 %. Un estudio municipal estima que el alquiler turístico explica aproximadamente una cuarta parte de esa subida; el resto se atribuye al aumento de la población y a la escasa construcción de vivienda nueva. El ayuntamiento ha dejado de conceder nuevas licencias turísticas en el centro histórico.", "id": "VR-022", "section": "verbal", "block": 1, "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "Según el estudio, la mayor parte de la subida se debe a otros factores.", "B": "El alquiler residencial medio se triplicó en cinco años.", "C": "Según el estudio, el alquiler turístico es la causa principal de la subida de los alquileres.", "D": "El ayuntamiento ha prohibido el alquiler turístico en toda la ciudad."}, "answer": "A", "explanations": {"A": "Verdadero. Unas tres cuartas partes se atribuyen al aumento de la población y a la escasa construcción.", "B": "Falso. Lo que se triplicó fue el número de pisos turísticos; el alquiler subió un 40 %.", "C": "Falso. Explica aproximadamente una cuarta parte; el resto se atribuye a otros factores.", "D": "Falso. Solo ha dejado de conceder nuevas licencias en el centro histórico."}, "source": "Original"}, {"topic": "Ciencia", "difficulty": "medium", "passage": "Los terremotos no pueden predecirse con exactitud en cuanto a fecha y lugar, pero sí puede estimarse la probabilidad de que se produzcan en una zona durante un periodo determinado. Algunos países han desarrollado sistemas de alerta temprana que detectan las primeras ondas de un sismo, menos destructivas, y envían avisos antes de que lleguen las más intensas. Estos sistemas solo proporcionan unos segundos de margen, suficientes para detener trenes o abrir las puertas de los parques de bomberos.", "id": "VR-023", "section": "verbal", "block": 1, "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "Es posible saber con exactitud cuándo se producirá un terremoto.", "B": "Los sistemas de alerta temprana predicen los terremotos días antes.", "C": "Las primeras ondas de un sismo son las más destructivas.", "D": "Los avisos llegan solo unos segundos antes de las ondas más intensas."}, "answer": "D", "explanations": {"A": "Falso. No pueden predecirse con exactitud en cuanto a fecha y lugar.", "B": "Falso. Detectan el sismo ya iniciado y dan unos segundos de margen.", "C": "Falso. El texto dice que las primeras ondas son menos destructivas.", "D": "Verdadero. Proporcionan unos segundos de margen."}, "source": "Original"}, {"topic": "Medio ambiente", "difficulty": "hard", "passage": "El plástico biodegradable se presenta a menudo como una solución a la contaminación. Sin embargo, muchos de estos materiales solo se degradan en plantas de compostaje industrial, a temperaturas elevadas y controladas. En el mar o en un compostador doméstico pueden tardar años en descomponerse. Además, si se mezclan con plásticos convencionales en el contenedor de reciclaje, pueden reducir la calidad del material reciclado. Los expertos insisten en que reducir el uso de envases es preferible a sustituir un material por otro.", "id": "VR-024", "section": "verbal", "block": 1, "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "Los plásticos biodegradables se descomponen rápidamente en el mar.", "B": "Mezclar plásticos biodegradables con convencionales puede perjudicar el reciclaje.", "C": "Los expertos consideran que sustituir materiales es la mejor solución.", "D": "Todos los plásticos biodegradables necesitan compostaje industrial."}, "answer": "B", "explanations": {"A": "Falso. En el mar pueden tardar años en descomponerse.", "B": "Verdadero. Pueden reducir la calidad del material reciclado.", "C": "Falso. Consideran preferible reducir el uso de envases.", "D": "Falso. El texto dice «muchos», no todos."}, "source": "Original"}, {"topic": "Movilidad", "difficulty": "medium", "passage": "Un servicio de bicicletas compartidas registró en su primer año 1,2 millones de viajes. La mitad se hicieron en hora punta y la duración media fue de 14 minutos. Las encuestas indican que un tercio de los usuarios habría hecho el trayecto en transporte público si el servicio no existiera, y solo uno de cada diez lo habría hecho en coche. El ayuntamiento destaca el éxito del servicio, aunque reconoce que su efecto sobre el tráfico de automóviles ha sido limitado.", "id": "VR-025", "section": "verbal", "block": 1, "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "Los viajes duraron de media más de media hora.", "B": "El ayuntamiento afirma que el servicio redujo mucho el tráfico de coches.", "C": "Una parte de los viajes en bicicleta sustituyó trayectos en transporte público.", "D": "La mayoría de los usuarios habría usado el coche si no existiera el servicio."}, "answer": "C", "explanations": {"A": "Falso. La duración media fue de 14 minutos.", "B": "Falso. El ayuntamiento reconoce que el efecto sobre el tráfico ha sido limitado.", "C": "Verdadero. Un tercio habría usado el transporte público.", "D": "Falso. Solo uno de cada diez lo habría hecho en coche."}, "source": "Original"}, {"topic": "Investigación", "difficulty": "hard", "passage": "Los ensayos clínicos se dividen en fases. En la fase I se prueba un fármaco en un pequeño grupo de voluntarios para evaluar su seguridad y la dosis adecuada. En la fase II se estudia su eficacia en un número mayor de pacientes, y en la fase III se compara con el tratamiento estándar en miles de participantes. Solo una minoría de los fármacos que entran en la fase I llegan a ser autorizados, a menudo porque no demuestran ser mejores que los tratamientos existentes.", "id": "VR-026", "section": "verbal", "block": 1, "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "En la fase III el fármaco se compara con el tratamiento estándar.", "B": "La fase II se realiza con miles de participantes.", "C": "La eficacia de un fármaco se estudia por primera vez en la fase I.", "D": "La mayoría de los fármacos que entran en la fase I acaban autorizados."}, "answer": "A", "explanations": {"A": "Verdadero. Es lo que el texto dice de la fase III.", "B": "Falso. Los miles de participantes corresponden a la fase III.", "C": "Falso. La fase I evalúa la seguridad y la dosis; la eficacia se estudia en la fase II.", "D": "Falso. Solo una minoría llega a ser autorizada."}, "source": "Original"}, {"topic": "Agua", "difficulty": "medium", "passage": "Las desaladoras producen agua potable a partir del agua del mar, pero consumen mucha energía y generan salmuera, un residuo con alta concentración de sal que se devuelve al mar. Si la salmuera no se diluye adecuadamente, puede dañar las praderas marinas cercanas. En los últimos años, el consumo energético por metro cúbico se ha reducido gracias a membranas más eficientes, aunque sigue siendo superior al de otras fuentes como los embalses.", "id": "VR-027", "section": "verbal", "block": 1, "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "El consumo energético de la desalación es hoy inferior al de los embalses.", "B": "La eficiencia energética de la desalación ha mejorado en los últimos años.", "C": "Las desaladoras no generan residuos.", "D": "La salmuera se diluye siempre sin causar daños."}, "answer": "B", "explanations": {"A": "Falso. Sigue siendo superior al de los embalses.", "B": "Verdadero. El consumo por metro cúbico se ha reducido gracias a membranas más eficientes.", "C": "Falso. Generan salmuera.", "D": "Falso. Puede dañar las praderas si no se diluye adecuadamente."}, "source": "Original"}, {"topic": "Administración", "difficulty": "hard", "passage": "Para reducir la carga administrativa, un gobierno aplicó el principio de «solo una vez»: los ciudadanos no tienen que volver a presentar documentos que ya obran en poder de la administración. La medida exigió conectar las bases de datos de distintos ministerios. Su puesta en marcha se retrasó dos años por la necesidad de adaptar los sistemas informáticos y de garantizar el cumplimiento de la normativa de protección de datos. Hoy se aplica a la mayoría de los trámites, aunque no a todos.", "id": "VR-028", "section": "verbal", "block": 1, "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "La medida no requirió cambios en los sistemas informáticos.", "B": "Los ciudadanos deben aportar de nuevo los documentos que ya tiene la administración.", "C": "El principio se aplica a todos los trámites administrativos.", "D": "La protección de datos fue uno de los motivos del retraso."}, "answer": "D", "explanations": {"A": "Falso. Hubo que adaptar los sistemas informáticos.", "B": "Falso. Es precisamente lo que el principio evita.", "C": "Falso. Se aplica a la mayoría de los trámites, no a todos.", "D": "Verdadero. El retraso se debió a la adaptación informática y a garantizar el cumplimiento de la protección de datos."}, "source": "Original"}, {"topic": "Energía", "difficulty": "medium", "passage": "Las bombas de calor extraen calor del aire exterior, del suelo o del agua y lo transfieren al interior de los edificios. Por cada unidad de electricidad que consumen pueden aportar entre tres y cuatro unidades de calor, por lo que son más eficientes que las calderas eléctricas convencionales. Su rendimiento disminuye cuando la temperatura exterior es muy baja, aunque los modelos actuales funcionan incluso a varios grados bajo cero. Su coste de instalación sigue siendo superior al de una caldera de gas.", "id": "VR-029", "section": "verbal", "block": 1, "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "Una bomba de calor aporta más calor que la electricidad que consume.", "B": "El rendimiento de las bombas de calor aumenta con el frío intenso.", "C": "Las bombas de calor dejan de funcionar por debajo de cero grados.", "D": "Instalar una bomba de calor es más barato que instalar una caldera de gas."}, "answer": "A", "explanations": {"A": "Verdadero. Aportan entre tres y cuatro unidades de calor por cada unidad de electricidad.", "B": "Falso. Su rendimiento disminuye cuando hace mucho frío.", "C": "Falso. Los modelos actuales funcionan a varios grados bajo cero.", "D": "Falso. Su coste de instalación sigue siendo superior."}, "source": "Original"}, {"topic": "Estadística oficial", "difficulty": "hard", "passage": "Los institutos de estadística publican a menudo una primera estimación del crecimiento económico pocas semanas después de que termine el trimestre, basada en datos incompletos. A medida que llega información más completa, la cifra se revisa, a veces varias veces. Las revisiones no indican necesariamente errores: forman parte del proceso habitual de equilibrar rapidez y precisión. Algunos institutos publican el historial de revisiones para que los usuarios puedan valorar la fiabilidad de las primeras estimaciones.", "id": "VR-030", "section": "verbal", "block": 1, "question": "¿Cuál de las siguientes afirmaciones es correcta?", "options": {"A": "Todos los institutos publican el historial de sus revisiones.", "B": "La primera estimación del crecimiento se basa en datos completos.", "C": "Una revisión de la cifra demuestra que el instituto cometió un error.", "D": "Las primeras estimaciones buscan un equilibrio entre rapidez y precisión."}, "answer": "D", "explanations": {"A": "Falso. El texto dice «algunos institutos».", "B": "Falso. Se basa en datos incompletos.", "C": "Falso. El texto dice que las revisiones no indican necesariamente errores.", "D": "Verdadero. Las revisiones forman parte del proceso de equilibrar rapidez y precisión."}, "source": "Original"}, {"id": "NR-001-1", "section": "numerico", "block": 1, "set": "001", "topic": "Variación porcentual", "difficulty": "easy", "table": {"title": "Titulados universitarios por rama, 2019 y 2024 (miles)", "head": ["Rama", "2019", "2024"], "rows": [["Ciencias e ingeniería", "412", "498"], ["Empresa y derecho", "655", "618"], ["Salud", "298", "371"], ["Artes y humanidades", "276", "241"], ["Educación", "190", "172"]], "note": "Datos ficticios con fines de práctica."}, "question": "¿En qué porcentaje aproximado varió el número de titulados en Salud entre 2019 y 2024?", "options": {"A": "73,0 %", "B": "2,4 %", "C": "124,5 %", "D": "24,5 %", "E": "19,7 %"}, "answer": "D", "explanations": {"A": "Es la variación absoluta en miles (73), no un porcentaje.", "B": "Error de orden de magnitud al pasar a porcentaje.", "C": "Es el valor de 2024 como porcentaje del de 2019; falta restar 100.", "D": "Correcto: es el resultado del cálculo de arriba.", "E": "Has dividido la variación entre el valor de 2024; la base es el valor inicial (2019)."}, "working": "(371 − 298) / 298 × 100 = 73 / 298 × 100 ≈ 24,5 %.", "watchout": "La variación porcentual siempre se calcula sobre el valor de partida.", "source": "Original. Datos ficticios con fi   function describe(a,v){return a==="pos"?`el punto está en ${POSN[v]}`:a==="rot"?`la flecha apunta hacia ${DIRN[v]}`:a==="count"?`hay ${v} ${v===1?"círculo":"círculos"}`:`la flecha es ${FILLN[v]}`;}
  function expect(a,v){return a==="pos"?`debería estar en ${POSN[v]}`:a==="rot"?`debería apuntar hacia ${DIRN[v]}`:a==="count"?`debería haber ${v} ${v===1?"círculo":"círculos"}`:`debería ser ${FILLN[v]}`;}
  function make(seed,level){
    const r=rng(seed), act=shuffleR(ATTRS,r).slice(0,level), rules={}, base={pos:r()*8|0,rot:r()*8|0,count:1+(r()*5|0),fill:r()*3|0};
    act.forEach(a=>rules[a]=RULES[a].make(r));
    const term=i=>{const f={...base};act.forEach(a=>f[a]=rules[a].at(i));return f;};
    const series=[0,1,2,3,4].map(term), ans=term(5);
    const cands=[];
    act.forEach(a=>rules[a].alt.forEach(v=>cands.push({...ans,[a]:v})));
    ATTRS.filter(a=>!act.includes(a)).forEach(a=>{const vs=a==="count"?[base.count+1,base.count-1].filter(x=>x>0&&x<7):a==="fill"?[mod(base.fill+1,3)]:[mod(base[a]+2,8)];vs.forEach(v=>cands.push({...ans,[a]:v}));});
    if(act.length>1){const[a,b]=act;cands.push({...ans,[a]:rules[a].alt[0],[b]:rules[b].alt[0]});}
    const seen=new Set([key(ans)]), wrong=[];
    for(const c of shuffleR(cands,r)){if(c.count<1||c.count>6)continue;const k=key(c);if(!seen.has(k)){seen.add(k);wrong.push(c);}if(wrong.length===4)break;}
    while(wrong.length<4){const c={...ans,pos:mod(ans.pos+1+wrong.length,8),rot:mod(ans.rot+3,8)};const k=key(c);if(!seen.has(k)){seen.add(k);wrong.push(c);}else c.rot=mod(c.rot+1,8);}
    const figs=shuffleR([ans,...wrong],r), L5="ABCDE", answer=L5[figs.indexOf(ans)];
    const options={},F={},explanations={};
    figs.forEach((f,i)=>{const l=L5[i];options[l]="figura";F[l]=f;
      if(f===ans)explanations[l]="Correcta: cumple todas las reglas.";
      else{const bad=ATTRS.filter(a=>f[a]!==ans[a]);explanations[l]="Incorrecta: "+bad.map(a=>`${describe(a,f[a])}, pero ${act.includes(a)?"según la regla":"ese elemento no cambia en la serie y"} ${expect(a,ans[a])}`).join("; ")+".";}
    });
    const constTxt=ATTRS.filter(a=>!act.includes(a)).map(a=>({pos:"el punto",rot:"la orientación de la flecha",count:"el número de círculos",fill:"el relleno"})[a]);
    const working=act.map(a=>rules[a].txt).join(" ")+(constTxt.length?` No cambian: ${constTxt.join(", ")}.`:"")+` Por tanto, en la sexta figura ${act.map(a=>describe(a,ans[a])).join(", ")}.`;
    return{series,figs:F,options,answer,explanations,working,rules:act.map(a=>RULES[a].name),level};
  }
  const qs=[];
  for(let i=1;i<=300;i++){const lv=i%10<3?1:i%10<7?2:3;const g=make(i*7919,lv);
    qs.push({id:"AR-"+String(i).padStart(3,"0"),section:"abstracto",block:1,topic:g.rules.join(" + "),difficulty:["","easy","medium","hard"][lv],question:"¿Qué figura completa la serie?",...g});}
  return{qs,svg,make};
})();

  const real=[...m.values()].filter(q=>!/^S\d-/.test(q.id));
  const out=[...m.values()];
  return out.filter(q=>!/^S\d-/.test(q.id)||!real.some(r=>r.block===q.block));
}

function pickFor(sid,n){

function startCombo(n){

function startSim(){
  simN=Math.min(simN,QS.length);
  const per=Math.ceil(simN/sec.blocks.length), pools=sec.blocks.map(b=>shuffle(byBlock(b.n)));
  let pick=[]; pools.forEach(p=>pick.push(...p.splice(0,per)));
  const rest=shuffle(pools.flat()); while(pick.length<simN&&rest.length) pick.push(rest.pop());
  pick=shuffle(pick).slice(0,simN);
  if(pick.some(q=>q.set)) pick.sort((a,b)=>String(a.set||"").localeCompare(String(b.set||"")));
  S={mode:"sim",check:simCheck,qs:pick,i:0,ans:{},flag:{},cfg:{sec:sec.id,n:sec.sim.n,min:simMin(),pass:sec.sim.pass,soft:sec.sim.soft},deadline:Date.now()+simMin()*60000};

   <div class="row" style="margin-top:14px"><button class="btn pri" id="again">Otro simulacro</button><button class="btn" id="h">Inicio</button></div></div>
  <div class="card"><h2 style="font-size:19px">Corrección</h2>
   <div class="grid">${S.qs.map((q,k)=>`<a class="cell ${S.ans[q.id]===q.answer?"ok":"ko"}" href="#" data-k="${k}" style="display:grid;place-items:center;text-decoration:none">${k+1}</a>`).join("")}</div>
   ${S.qs.map((q,k)=>{const a=S.ans[q.id];return `<details class="rev" id="r${k}" ${a===q.answer?"":"open"}><summary>${k+1}. ${a===q.answer?"✓":"✗"} ${esc(q.topic||bname(q.block))} · tu respuesta: ${a||"sin responder"} · correcta: ${q.answer}</summary>
    ${q.passage?`<div class="psg">${fmt(q.passage)}</div>`:""}${table(q)}<p class="q">${fmt(q.question)}</p>${series(q)}<div class="opts ${q.figs?"figs":""}">${LQ(q).map(l=>`<div class="opt ${l===q.answer?"ok":l===a?"ko":""}"><b>${l}</b><span>${optHTML(q,l)}</span></div>`).join("")}</div>${explain(q,a)}</details>`}).join("")}</div>`;
  app.querySelectorAll("a.cell").forEach(c=>c.onclick=e=>{e.preventDefault();const d=$("#r"+c.dataset.k);d.open=true;d.scrollIntoView({behavior:"smooth"});});
  $("#again").onclick=S.cfg.sec==="combo"?()=>startCombo(S.cfg.total):startSim; $("#h").onclick=home; scrollTo(0,0);
}

function guide(){
  calc(false); save("epso158-guide",1); $("#homeBtn").style.display="";
  const ex=[ABS.make(424242,1),ABS.make(9001,2)];
  const strip=(fs)=>`<div class="ser">${fs.map(f=>ABS.svg(f)).join("")}</div>`;
  const R=(st,ch)=>[0,1,2,3,4].map(i=>({pos:0,rot:0,count:2,fill:0,...st,...ch(i)}));
  app.innerHTML=`<div class="card anim guide"><h2 style="font-size:26px;margin-bottom:8px">Cómo resolver las series de figuras</h2>
  <p>Ves cinco figuras en orden y tienes que elegir, entre cinco opciones, la sexta figura. En esta app el formato es de 10 preguntas en 10 minutos, así que tienes una media de un minuto por pregunta.</p>
  <h3>El método en cuatro pasos</h3>
  <ol><li><b>Identifica los elementos.</b> En estas series hay cuatro: el punto negro del borde, la flecha central, el relleno de la flecha y los círculos pequeños.</li>
  <li><b>Sigue cada elemento por separado</b> de la figura 1 a la 5. No intentes ver todo a la vez.</li>
  <li><b>Predice la sexta figura</b> elemento por elemento.</li>
  <li><b>Descarta opciones.</b> Casi todas las opciones incorrectas fallan en un solo elemento: compara un elemento cada vez y tacha.</li></ol>
  <h3>Los tipos de regla</h3>
  <p><b>1. Movimiento.</b> Un elemento recorre posiciones fijas, siempre el mismo número de pasos y en el mismo sentido. Aquí el punto avanza una posición en el sentido de las agujas del reloj (esquina, centro del lado, esquina…).</p>${strip(R({},i=>({pos:i})))}
  <p class="mute">Truco: cuenta los pasos entre la figura 1 y la 2, y comprueba que se repiten entre la 2 y la 3. Si salta 2 o 3 posiciones, cuenta con el dedo.</p>
  <p><b>2. Rotación.</b> La flecha gira siempre el mismo ángulo: 45° (un octavo de vuelta) o 90° (un cuarto). Aquí gira 90° en sentido horario.</p>${strip(R({pos:7},i=>({rot:i*2%8})))}
  <p class="mute">Truco: fíjate en hacia dónde apunta la punta en cada figura y nómbralo (arriba, derecha, abajo…).</p>
  <p><b>3. Conteo.</b> El número de elementos sube o baja de uno en uno, o alterna entre dos valores. Aquí aumenta en 1.</p>${strip(R({pos:2,rot:0},i=>({count:i+1})))}
  <p><b>4. Relleno o color.</b> El relleno sigue un ciclo que se repite: por ejemplo blanca → negra → rayada → blanca… Aquí el ciclo es de 3.</p>${strip(R({pos:5,rot:6},i=>({fill:i%3})))}
  <p class="mute">Truco: para un ciclo, busca cuándo se repite la primera figura. Si el ciclo es de 3 y la quinta es la 2.ª del ciclo, la sexta será la 3.ª.</p>
  <p><b>5. Elementos que no cambian.</b> Si un elemento es igual en las cinco figuras, en la sexta también lo es. Las opciones trampa a menudo cambian justo ese elemento.</p>
  <h3>Ejemplo resuelto 1 (una regla)</h3>${strip(ex[0].series)}
  <p>${esc(ex[0].working)}</p><p>Respuesta:</p><div class="ser one">${ABS.svg(ex[0].figs[ex[0].answer])}</div>
  <h3>Ejemplo resuelto 2 (dos reglas a la vez)</h3>${strip(ex[1].series)}
  <p>${esc(ex[1].working)}</p><p>Respuesta:</p><div class="ser one">${ABS.svg(ex[1].figs[ex[1].answer])}</div>
  <h3>Consejos para el día del examen</h3>
  <ul><li>Si en 60 segundos no ves la regla, marca la pregunta, elige la opción más probable y sigue.</li>
  <li>Las reglas son independientes: un elemento puede moverse mientras otro gira.</li>
  <li>Las preguntas difíciles combinan tres reglas. Resuélvelas igual, un elemento cada vez.</li>
  <li>En el examen real de EPSO las figuras pueden ser distintas a estas, pero el método es el mismo.</li></ul>
  <div class="row" style="margin-top:12px"><button class="btn pri" id="gPrac">Practicar con corrección inmediata</button><button class="btn" id="gHome">Volver</button></div></div>`;
  $("#gPrac").onclick=()=>{const easy=QS.filter(q=>q.level===1);startPractice(shuffle(easy).slice(0,5).concat(shuffle(QS.filter(q=>q.level>1)).slice(0,5)),"practice");};
  $("#gHome").onclick=home; scrollTo(0,0);
}
function stats(){
  $("#homeBtn").style.display="";
  const mySims=store.sims.filter(x=>(x.sec||"ambito")===sec.id||(sec.combo&&x.sec==="combo"));
  const rows=sec.blocks.map(b=>{const qs=byBlock(b.n);let n=0,ok=0,seen=0;qs.forEach(q=>{const r=store.q[q.id];if(r){seen++;n+=r.n;ok+=r.ok;}});return {b,qs:qs.length,seen,pct:n?Math.round(100*ok/n):null};});
  app.innerHTML=`<div class="card anim"><h2 style="font-size:24px;margin-bottom:6px">Estadísticas · ${esc(sec.name)}</h2><p class="mute">% de acierto sobre todas tus respuestas; los bloques más bajos son los que conviene repasar.</p>
  ${rows.map(r=>`<div class="blk"><span>${r.b.n}. ${r.b.name}<br><span class="mute">${r.seen} de ${r.qs} preguntas vistas</span></span><span class="big" style="font-size:24px">${r.pct==null?"–":r.pct+"%"}</span><div class="bar"><i style="width:${r.pct||0}%"></i></div></div>`).join("")}</div>
  <div class="card"><h2 style="font-size:19px;margin-bottom:8px">Simulacros</h2>${mySims.length?mySims.slice().reverse().map(s=>`<div class="blk"><span>${new Date(s.d).toLocaleString("es-ES",{dateStyle:"medium",timeStyle:"short"})}</span><span>${s.sec==="combo"?'<span class="mute">combinado </span>':""}<b>${s.score}/${s.total}</b> <span class="mute">${s.min} min</span></span></div>`).join(""):`<p class="mute">Aún no has hecho ningún simulacro.</p>`}</div>
  <div class="card"><details><summary>Añadir preguntas desde un fichero JSON</summary><p class="mute">Mismo formato que el banco. Se guardan solo en este navegador.</p><input type="file" id="imp" accept=".json,application/json"><p id="impMsg" class="mute"></p></details>
  <details><summary>Borrar mi progreso</summary><button class="btn warn" id="rst">Borrar estadísticas y falladas</button></details></div>`;
  $("#imp").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d))d=[d];const ok=d.filter(valid);QS=allQs();const cur=load(IKEY,[]).filter(q=>!ok.some(o=>o.id===q.id));save(IKEY,cur.concat(ok));QS=allQs();$("#impMsg").textContent=`${ok.length} preguntas añadidas${d.length-ok.length?`, ${d.length-ok.length} descartadas por formato`:""}.`;}catch(err){$("#impMsg").textContent="No se pudo leer el fichero: "+err.message;}};
  let armed=false; $("#rst").onclick=e=>{if(!armed){armed=true;e.target.textContent="Pulsa otra vez para confirmar";return;}store={q:{},sims:[]};save(KEY,store);stats();};
}
function calc(open){
  let c=$("#calc"); if(!open){c&&c.remove();return;}
  if(c){c.remove();return;}
  c=document.createElement("div");c.id="calc";c.setAttribute("role","dialog");c.setAttribute("aria-label","Calculadora");
  const keys=["C","(",")","÷","7","8","9","×","4","5","6","−","1","2","3","+","0",",","⌫","="];
  c.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><b>Calculadora</b><button class="btn" id="cx" style="min-height:36px;padding:4px 12px">Cerrar</button></div><div id="cd" class="cdisp">0</div><div class="ckeys">${keys.map(k=>`<button class="ck ${k==="="?"eq":""}" data-k="${k}">${k}</button>`).join("")}</div>`;
  document.body.appendChild(c); let e="";
  const show=v=>$("#cd").textContent=v||"0";
  c.querySelector("#cx").onclick=()=>calc(false);
  c.querySelectorAll(".ck").forEach(b=>b.onclick=()=>{const k=b.dataset.k;
    if(k==="C")e="";else if(k==="⌫")e=e.slice(0,-1);
    else if(k==="="){try{const x=e.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/,/g,".");if(!/^[0-9.+\-*/() ]+$/.test(x))throw 0;const r=Function("return ("+x+")")();e=Number.isFinite(r)?String(+r.toPrecision(12)).replace(".",","):"Error";}catch(err){e="Error";}}
    else{if(e==="Error")e="";e+=k;} show(e);});
}
home();
}
