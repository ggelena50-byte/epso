<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b3fb3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Práctica EPSO AST/158</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, exam-room clear; a study tool, nothing decorative in the way
   IDEA: an EPSO answer sheet: numbered grid, one question at a time, a clock
   PICTURE: the working question card and answer grid are the picture
   COLOUR and TYPE: EU blue field, EU yellow accent, white paper; Archivo + Public Sans
   LAYOUT: one column up to 760px, blue header band, cards below */
:root{color-scheme:light dark;--bg:light-dark(#f4f6fb,#0a1024);--paper:light-dark(#fff,#121a36);--ink:light-dark(#0d1530,#e8ecf8);--mute:light-dark(#5a6382,#9aa3c2);--line:light-dark(#dde2ef,#26305a);--blue:#0b3fb3;--blue2:light-dark(#e6edff,#1a2a66);--yel:#ffcc00;--ok:light-dark(#0f7b45,#4cd38a);--okbg:light-dark(#e3f6ec,#103322);--ko:light-dark(#b42318,#ff8a80);--kobg:light-dark(#fde8e6,#3a1414)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Public Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;line-height:1.1;text-wrap:balance;margin:0}
header{background:var(--blue);color:#fff;padding:calc(18px + env(safe-area-inset-top)) max(5vw,16px) 20px}
header .in{max-width:760px;margin:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:22px;font-weight:800;flex:1}
header .sub{font-size:14px;opacity:.85;font-weight:400;display:block;margin-top:4px;font-family:"Public Sans",sans-serif}
.stars{width:44px;height:44px;flex:none}
main{max-width:760px;margin:auto;padding:20px 16px 60px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.btn{font:600 16px "Public Sans",sans-serif;min-height:46px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.btn:focus-visible,.opt:focus-visible,.cell:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.warn{border-color:var(--ko);color:var(--ko)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.mode{text-align:left;display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;font:inherit;min-height:120px}
.mode h3{font-size:19px}.mode span{color:var(--mute);font-size:14px}
.mode.hero{background:var(--blue);color:#fff;border-color:var(--blue)}.mode.hero span{color:#dbe4ff}
.mode:disabled{opacity:.5;cursor:default}.mode:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.big{font-family:Archivo,sans-serif;font-weight:800;font-size:clamp(40px,10vw,64px);line-height:1}
.mute{color:var(--mute);font-size:14px}
.bar{height:10px;border-radius:5px;background:var(--blue2);overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.blk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}.blk .bar{grid-column:1/-1}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.tag{font-size:13px;padding:3px 9px;border-radius:20px;background:var(--blue2);color:var(--ink)}
.timer{font:800 20px Archivo,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.low{color:var(--ko)}
.q{font-size:17px;white-space:pre-wrap;margin:6px 0 14px}
code{font-family:ui-monospace,Menlo,monospace;font-size:.92em;background:var(--blue2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;cursor:pointer;white-space:pre-wrap}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--blue2);font-family:Archivo,sans-serif}
.opt.sel{border-color:var(--blue)}.opt.sel b{background:var(--blue);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok b{background:var(--ok);color:#fff}
.opt.ko{border-color:var(--ko);background:var(--kobg)}.opt.ko b{background:var(--ko);color:#fff}
.opt:disabled{cursor:default}
.exp{margin-top:14px;display:grid;gap:8px}
.exp p{margin:0;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:15px}
.exp p.ok{background:var(--okbg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:12px}
.cell{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 15px "Public Sans",sans-serif;cursor:pointer;position:relative}
.cell.done{background:var(--blue2)}.cell.cur{border:2px solid var(--blue)}
.cell.flag::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--yel)}
.cell.ok{background:var(--okbg);border-color:var(--ok)}.cell.ko{background:var(--kobg);border-color:var(--ko)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.pass{display:inline-block;padding:4px 12px;border-radius:20px;font-weight:600;background:var(--okbg);color:var(--ok)}
.pass.no{background:var(--kobg);color:var(--ko)}
select{font:16px "Public Sans",sans-serif;min-height:46px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);max-width:100%}
label.f{display:grid;gap:6px;font-weight:600;font-size:15px;flex:1 1 220px}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
.rev{border-top:1px solid var(--line);padding:12px 0}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{font:600 15px "Public Sans",sans-serif;min-height:44px;padding:8px 16px;border-radius:22px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.psg{background:var(--blue2);border-left:4px solid var(--blue);border-radius:10px;padding:14px 16px;margin:10px 0 6px;white-space:pre-wrap;font-size:16.5px;line-height:1.65}
.q.stem{font-family:Archivo,sans-serif;font-weight:700;font-size:18px}
.tblw{overflow-x:auto;margin:10px 0 4px}
.tbl{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
.tbl caption{caption-side:top;text-align:left;font-weight:700;padding:10px 12px;background:var(--blue2);border-radius:10px 10px 0 0}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal}
.tbl th{color:var(--blue);font-weight:700;white-space:normal}
:root[data-theme=dark] .tbl th{color:#a9bcff}
.tbl tbody tr:nth-child(even){background:var(--bg)}
.exp p.watch{background:#fff4c2;color:#5a4300}
#calc{position:fixed;right:12px;bottom:12px;z-index:9;width:min(300px,calc(100vw - 24px));background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.cdisp{font:700 26px Archivo,sans-serif;text-align:right;padding:8px 10px;background:var(--bg);border-radius:10px;margin-bottom:8px;overflow-x:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ck{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 18px "Public Sans",sans-serif;cursor:pointer}
.ck.eq{background:var(--blue);color:#fff;border-color:var(--blue)}
.ser{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:10px 0}
.ser.one{grid-template-columns:minmax(0,90px)}
.ser .af,.ser .qm{width:100%;aspect-ratio:1}
.qm{display:grid;place-items:center;border:2px dashed var(--line);border-radius:6px;font:800 28px Archivo,sans-serif;color:var(--mute)}
@media(max-width:520px){.ser{grid-template-columns:repeat(3,minmax(0,1fr))}}
.opts.figs{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.opts.figs .opt{flex-direction:column;align-items:center;gap:6px;padding:8px}
.opts.figs .opt span{width:100%}.opts.figs .af{width:100%;display:block;aspect-ratio:1}
.guide h3{font-size:19px;margin:20px 0 6px}.guide li{margin-bottom:6px}
.verdict{margin-top:14px;padding:12px 14px;border-radius:10px;font-weight:700;border:2px solid}
.verdict.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}.verdict.ko{background:var(--kobg);color:var(--ko);border-color:var(--ko)}
.yel{color:#7a5c00;background:#fff4c2;padding:10px 12px;border-radius:10px;font-size:14px}
@media(max-width:600px){.mode{min-height:0;padding:14px 16px}}
@media (prefers-reduced-motion:no-preference){.card.anim{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<header><div class="in">
<svg class="stars" viewBox="-12 -12 24 24" aria-hidden="true"><circle r="12" fill="#0a3399"/><g fill="#ffcc00" id="st"></g></svg>
<h1 id="ttl">Práctica EPSO · AST/158/26<span class="sub">Data processing, analytics and statistics</span></h1>
<button class="btn" id="homeBtn" style="display:none">Inicio</button>
</div></header>
<main id="app"></main>
<script>
{
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const BANK = [{"id": "B1-001", "block": 1, "topic": "Administrative data sources", "difficulty": "medium", "question": "A national statistical institute plans to replace the income module of a household survey with personal income tax records. Which issue is the most typical methodological risk of this change?", "options": {"A": "Sampling error will increase because tax records cover fewer units than a survey sample.", "B": "Response burden on households will rise because they must now report income twice.", "C": "Tax records cannot legally be used by statistical authorities under EU law without consent.", "D": "Tax definitions of income may differ from statistical ones, and non-filers may be missing."}, "answer": "D", "explanations": {"A": "Wrong. A register covers the whole administrative population, so it has no sampling error in the usual sense; its problems are coverage and conceptual fit.", "B": "Wrong. Reusing administrative data is one of the main ways to reduce response burden, since households are no longer asked the questions.", "C": "Wrong. Regulation (EC) No 223/2009 (as amended in 2015) gives national statistical authorities access to administrative records for statistical purposes.", "D": "Correct. Administrative data are collected for administrative purposes, so their concepts, populations and units follow the law, not statistical definitions. Non-filers create undercoverage."}, "source": "Regulation (EC) No 223/2009, Art. 17a; Eurostat, ESS guidance on the use of administrative data"}, {"id": "B1-002", "block": 1, "topic": "Administrative data sources", "difficulty": "easy", "question": "A statistical business register used as a sampling frame still lists about 4% of enterprises that ceased all activity during the previous year. What type of frame error is this?", "options": {"A": "Undercoverage", "B": "Measurement error", "C": "Processing error", "D": "Overcoverage"}, "answer": "D", "explanations": {"A": "Wrong. Undercoverage means target units are missing from the frame, for example newly created enterprises not yet registered.", "B": "Wrong. Measurement error concerns wrong values reported for units that are in scope, not the presence of out-of-scope units.", "C": "Wrong. Processing errors arise during coding, keying or editing; the problem here lies in the frame itself.", "D": "Correct. The frame contains units that are not part of the target population (dead units). If not detected, they distort response rates and may bias estimates."}, "source": "Eurostat, European business statistics compilers' manual for business registers; Total Survey Error framework"}, {"id": "B1-003", "block": 1, "topic": "Administrative data sources", "difficulty": "medium", "question": "Two administrative files on the same persons must be linked, but there is no common unique identifier and names contain typing errors. Which approach is most appropriate?", "options": {"A": "Probabilistic linkage scoring agreement on several imperfect variables, with clerical review of doubtful pairs.", "B": "Deterministic linkage requiring exact agreement on the full name, discarding all records that do not match.", "C": "Appending the two files into one table and then removing the duplicate rows that appear in both.", "D": "Statistical matching (data fusion) of similar persons using only age, sex and region of residence."}, "answer": "A", "explanations": {"A": "Correct. The Fellegi–Sunter approach uses m- and u-probabilities to score agreement on imperfect variables and is the standard choice when no reliable key exists.", "B": "Wrong. Exact matching on error-prone fields misses true matches whenever a name is misspelt, causing missed links and biased linked data.", "C": "Wrong. Appending does not link information about the same person across files; duplicate removal only works on identical records.", "D": "Wrong. Statistical matching joins similar, not identical, units; it does not identify the same person and would not use the available identifying information."}, "source": "Fellegi & Sunter (1969), A Theory for Record Linkage; Eurostat ESSnet on Data Integration"}, {"id": "B1-004", "block": 1, "topic": "Administrative data sources", "difficulty": "medium", "question": "A statistical office relies on a ministry's register to produce a monthly indicator. The ministry changes the register's legal definitions without notice. Which quality dimension is most directly threatened, and what is the standard mitigation?", "options": {"A": "Accessibility; publishing the raw register on the statistical office website for users.", "B": "Comparability over time; agreements requiring advance notice of changes.", "C": "Accuracy of the sampling design; increasing the sample size drawn from the register.", "D": "Punctuality; changing the release calendar to follow the ministry's own update cycle."}, "answer": "B", "explanations": {"A": "Wrong. Accessibility concerns how users obtain statistics. Publishing raw register data would also breach confidentiality.", "B": "Correct. Loss of control over concepts is the classic risk of administrative sources. Service-level or memoranda of understanding with data holders are the usual mitigation.", "C": "Wrong. A register is not a sample, so increasing a sample size is irrelevant to a definitional break.", "D": "Wrong. Punctuality is about publishing on announced dates; the problem here is a break in the series, not a delay."}, "source": "ESS Code of Practice (2017), Principles 2 and 14; Regulation (EC) No 223/2009, Art. 12"}, {"id": "B1-005", "block": 1, "topic": "Administrative data sources", "difficulty": "hard", "question": "Under Regulation (EC) No 223/2009 as amended in 2015, what does the regulation provide regarding administrative records held by national public authorities?", "options": {"A": "NSIs have the right to prompt, free access to them and to be consulted on their design and changes.", "B": "Administrative authorities may charge statistical institutes the full cost of each data extraction.", "C": "Administrative records may only be used if every data subject has given explicit consent.", "D": "Eurostat may collect administrative records directly from national ministries without involving the NSIs."}, "answer": "A", "explanations": {"A": "Correct. Article 17a, inserted by Regulation (EU) 2015/759, grants prompt, free access and the right to be consulted on the design, development and discontinuation of administrative records.", "B": "Wrong. Access is to be free of charge.", "C": "Wrong. The legal basis for access is the statistical regulation itself; individual consent is not required.", "D": "Wrong. The provision concerns national statistical institutes and other national authorities; Eurostat receives data through the ESS."}, "source": "Regulation (EC) No 223/2009, Art. 17a (inserted by Regulation (EU) 2015/759)"}, {"id": "B1-006", "block": 1, "topic": "Sampling design", "difficulty": "medium", "question": "A simple random sample of n = 400 units is drawn without replacement from N = 2,000. The sample variance of the variable of interest is 25. What is the estimated standard error of the sample mean?", "options": {"A": "0.250", "B": "0.200", "C": "0.224", "D": "0.050"}, "answer": "C", "explanations": {"A": "Wrong. This is sqrt(25/400) and ignores the finite population correction (1 − 0.2 = 0.8), which matters when 20% of the population is sampled.", "B": "Wrong. This multiplies 0.25 by 0.8 instead of multiplying the variance by 0.8 and then taking the square root.", "C": "Correct. SE = sqrt[(1 − n/N) × s²/n] = sqrt(0.8 × 25 / 400) = sqrt(0.05) ≈ 0.224.", "D": "Wrong. This is the variance of the mean (0.8 × 25/400), not its standard error."}, "source": "Cochran, Sampling Techniques, ch. 2; Eurostat Handbook on precision requirements and variance estimation for ESS household surveys"}, {"id": "B1-007", "block": 1, "topic": "Sampling design", "difficulty": "medium", "question": "A survey must estimate a proportion with a margin of error of ±3 percentage points at 95% confidence (z = 1.96). No prior estimate is available and the population is very large. What is the minimum simple random sample size?", "options": {"A": "545", "B": "1,068", "C": "1,111", "D": "1,067"}, "answer": "B", "explanations": {"A": "Wrong. This forgets to square z: 1.96 × 0.25 / 0.0009 ≈ 544.4.", "B": "Correct. Using p = 0.5 (worst case): n = 1.96² × 0.25 / 0.03² = 0.9604 / 0.0009 ≈ 1,067.1, rounded up to 1,068.", "C": "Wrong. This uses z = 2 instead of 1.96 (4 × 0.25 / 0.0009 ≈ 1,111).", "D": "Wrong. Sample sizes are always rounded up; 1,067 units give a margin slightly above 3 points."}, "source": "Cochran, Sampling Techniques; Eurostat, ESS handbook on precision requirements"}, {"id": "B1-008", "block": 1, "topic": "Sampling design", "difficulty": "medium", "question": "A two-stage cluster sample achieved 2,400 interviews. The estimated design effect (deff) for the key indicator is 1.6. What is the effective sample size?", "options": {"A": "3,840", "B": "2,400", "C": "1,500", "D": "1,600"}, "answer": "C", "explanations": {"A": "Wrong. This multiplies by the design effect instead of dividing.", "B": "Wrong. This ignores the loss of precision due to clustering.", "C": "Correct. Effective sample size = n / deff = 2,400 / 1.6 = 1,500: the cluster sample is as precise as an SRS of 1,500.", "D": "Wrong. This confuses the design effect value with a sample size."}, "source": "Kish, Survey Sampling (1965); Eurostat Handbook on precision requirements and variance estimation"}, {"id": "B1-009", "block": 1, "topic": "Sampling design", "difficulty": "hard", "question": "A population of 10,000 enterprises is stratified by size: stratum 1 has 6,000 units (S = 2), stratum 2 has 3,000 units (S = 6) and stratum 3 has 1,000 units (S = 12). A total sample of 420 is allocated by Neyman allocation. How many units go to stratum 2?", "options": {"A": "126", "B": "140", "C": "120", "D": "180"}, "answer": "D", "explanations": {"A": "Wrong. This is proportional allocation (420 × 3,000/10,000), which ignores the differing variability.", "B": "Wrong. This is equal allocation (420/3).", "C": "Wrong. 120 is the Neyman allocation for strata 1 and 3 (each with N_h × S_h = 12,000), not for stratum 2.", "D": "Correct. Neyman allocation is proportional to N_h × S_h: 12,000, 18,000 and 12,000 (total 42,000). Stratum 2 gets 420 × 18,000/42,000 = 180."}, "source": "Cochran, Sampling Techniques, ch. 5 (optimum allocation)"}, {"id": "B1-010", "block": 1, "topic": "Sampling design", "difficulty": "medium", "question": "In one stratum, 250 units were selected from a population of 5,000 and 200 responded. Assuming non-response is random within the stratum, what is the non-response-adjusted weight of each respondent?", "options": {"A": "25", "B": "20", "C": "22.5", "D": "0.05"}, "answer": "A", "explanations": {"A": "Correct. Design weight = 5,000/250 = 20; adjustment factor = 250/200 = 1.25; adjusted weight = 25 (equivalently 5,000/200).", "B": "Wrong. This is the design weight before adjusting for non-response.", "C": "Wrong. This averages the design weight and the adjusted weight, which has no justification.", "D": "Wrong. This is the selection probability (250/5,000), not a weight."}, "source": "Särndal, Swensson & Wretman, Model Assisted Survey Sampling; Eurostat ESS guidelines on weighting"}, {"id": "B1-011", "block": 1, "topic": "Sampling design", "difficulty": "medium", "question": "Three units are sampled with inclusion probabilities 0.1, 0.2 and 0.5. Their values of y are 10, 20 and 50. What is the Horvitz–Thompson estimate of the population total?", "options": {"A": "80", "B": "100", "C": "26.7", "D": "300"}, "answer": "D", "explanations": {"A": "Wrong. This is the unweighted sample sum.", "B": "Wrong. This divides the sample sum by the sum of the inclusion probabilities (80 / 0.8), which is not the HT estimator.", "C": "Wrong. This is the unweighted sample mean.", "D": "Correct. HT total = Σ y_i/π_i = 10/0.1 + 20/0.2 + 50/0.5 = 100 + 100 + 100 = 300."}, "source": "Horvitz & Thompson (1952); Särndal et al., Model Assisted Survey Sampling"}, {"id": "B1-012", "block": 1, "topic": "Sampling design", "difficulty": "medium", "question": "A systematic sample takes every 12th record from a file of monthly records sorted chronologically. Which risk is most specific to this design?", "options": {"A": "A cycle in the list may coincide with the sampling interval.", "B": "Each unit has an unknown probability of selection, so weights cannot be computed.", "C": "It always produces a larger variance than simple random sampling of the same size.", "D": "It cannot be used with a sampling frame and needs a complete census list instead."}, "answer": "A", "explanations": {"A": "Correct. When the list has a cycle equal to (or a multiple of) the interval, systematic sampling can be badly unrepresentative.", "B": "Wrong. With a random start, each unit's selection probability is known (1/12).", "C": "Wrong. With a list sorted by a correlated variable, systematic sampling often gives smaller variance (implicit stratification).", "D": "Wrong. Systematic sampling requires an ordered frame."}, "source": "Cochran, Sampling Techniques, ch. 8"}, {"id": "B1-013", "block": 1, "topic": "Sampling design", "difficulty": "hard", "question": "A household survey selects clusters of 21 households each. The intra-class correlation for the key variable is 0.05. Using Kish's approximation, what is the design effect due to clustering?", "options": {"A": "2.0", "B": "1.05", "C": "2.05", "D": "0.95"}, "answer": "A", "explanations": {"A": "Correct. deff ≈ 1 + (m − 1)ρ = 1 + 20 × 0.05 = 2.0.", "B": "Wrong. This is 1 + ρ, which ignores cluster size.", "C": "Wrong. This uses m instead of m − 1 (1 + 21 × 0.05).", "D": "Wrong. Positive intra-class correlation increases variance, so deff exceeds 1."}, "source": "Kish, Survey Sampling (1965)"}, {"id": "B1-014", "block": 1, "topic": "Sampling design", "difficulty": "medium", "question": "An enterprise survey selects 100 units with probability proportional to size (PPS), using employment as the size measure. Total employment in the frame is 200,000. What is the inclusion probability of an enterprise with 400 employees?", "options": {"A": "0.002", "B": "0.50", "C": "0.20", "D": "1.00"}, "answer": "C", "explanations": {"A": "Wrong. This is x_i/X (400/200,000) without multiplying by the sample size.", "B": "Wrong. This divides 100 by 200 instead of using the size measure correctly.", "C": "Correct. π = n × x_i / X = 100 × 400 / 200,000 = 0.20.", "D": "Wrong. Only units whose n × x_i/X is at least 1 are take-all units; this one is not."}, "source": "Särndal et al., Model Assisted Survey Sampling; Eurostat business statistics sampling guidelines"}, {"id": "B1-015", "block": 1, "topic": "Sampling design", "difficulty": "hard", "question": "A quarterly Labour Force Survey uses a rotation scheme in which each dwelling stays in the sample for five consecutive quarters, with one fifth of the sample replaced every quarter. What is the theoretical sample overlap between a quarter and the same quarter one year later?", "options": {"A": "80%", "B": "0%", "C": "20%", "D": "40%"}, "answer": "C", "explanations": {"A": "Wrong. 80% is the overlap between consecutive quarters, not year-on-year.", "B": "Wrong. With five waves, one rotation group remains after four quarters.", "C": "Correct. Dwellings in their first wave in quarter t are in their fifth wave in quarter t+4; only that one rotation group (1/5) is common to both.", "D": "Wrong. This would require six or more waves or a different rotation pattern."}, "source": "Eurostat, EU-LFS methodology; Regulation (EU) 2019/1700 implementing acts"}, {"id": "B1-016", "block": 1, "topic": "Sampling design", "difficulty": "medium", "question": "Which statement about quota sampling is correct?", "options": {"A": "It is a probability method equivalent to stratified random sampling, with interviewers selecting the units.", "B": "It controls sample composition, but selection within quotas is not random, so inclusion probabilities are unknown.", "C": "It eliminates non-response bias because each quota is always filled by substitute respondents.", "D": "It is the method required by EU law for official social surveys such as the LFS and EU-SILC."}, "answer": "B", "explanations": {"A": "Wrong. Stratified sampling selects randomly within strata; quota sampling does not.", "B": "Correct. Quota sampling is a non-probability method; interviewer choice can introduce selection bias even when quotas are met.", "C": "Wrong. Filling quotas by substitution hides non-response; it does not remove its bias.", "D": "Wrong. The IESS Regulation requires probability samples for the EU social surveys."}, "source": "Regulation (EU) 2019/1700, Art. 12; Groves et al., Survey Methodology"}, {"id": "B1-017", "block": 1, "topic": "Sampling design", "difficulty": "easy", "question": "In survey methodology, what is the sampling frame?", "options": {"A": "The list or device, such as a register, from which sample units are selected.", "B": "The whole population about which the survey intends to make inferences.", "C": "The set of selected units that actually responded to the survey.", "D": "The questionnaire layout and routing used during data collection."}, "answer": "A", "explanations": {"A": "Correct. The frame operationalises the target population; differences between them create coverage errors.", "B": "Wrong. That is the target population.", "C": "Wrong. That is the set of respondents (the achieved sample).", "D": "Wrong. That is the questionnaire or instrument design."}, "source": "Groves et al., Survey Methodology; GSBPM v5.1, sub-process 2.4 Design frame and sample"}, {"id": "B1-018", "block": 1, "topic": "Sampling design", "difficulty": "medium", "question": "A survey office switches from face-to-face (CAPI) interviews to a mixed design that starts with a web questionnaire (CAWI) followed by telephone (CATI) for non-respondents. Which effect should be assessed before publishing the new series?", "options": {"A": "Periodicity effects in the address list used as frame.", "B": "The finite population correction, which becomes larger online.", "C": "Seasonal adjustment, which is no longer needed for web data.", "D": "Mode effects, which may create a break in the series."}, "answer": "D", "explanations": {"A": "Wrong. Periodicity concerns systematic sampling, not data collection modes.", "B": "Wrong. The FPC depends on n/N, not on the collection mode.", "C": "Wrong. Seasonality is a feature of the phenomenon, not of the collection mode.", "D": "Correct. Selection effects (who responds in each mode) and measurement effects (how they answer) can both change estimates; a parallel run or modelling is common."}, "source": "de Leeuw, Mixed-mode surveys; Eurostat ESSnet on mixed-mode designs in social surveys"}, {"id": "B1-019", "block": 1, "topic": "Sampling design", "difficulty": "easy", "question": "Why does Eurostat generally treat the finite population correction as negligible in large national household surveys?", "options": {"A": "Because the sampling fraction n/N is usually very small, so (1 − n/N) is close to 1.", "B": "Because household surveys are always drawn with replacement, so no correction applies.", "C": "Because the clustering of households cancels out the finite population correction.", "D": "Because the correction only applies to business surveys by law."}, "answer": "A", "explanations": {"A": "Correct. For example, n = 10,000 households out of 5 million gives 1 − 0.002 = 0.998, which barely changes the variance.", "B": "Wrong. They are usually drawn without replacement; the FPC is just close to 1.", "C": "Wrong. Clustering and the FPC are separate components of the variance.", "D": "Wrong. It is a mathematical property, not a legal rule."}, "source": "Cochran, Sampling Techniques; Eurostat Handbook on precision requirements and variance estimation"}, {"id": "B1-020", "block": 1, "topic": "Bias and survey errors", "difficulty": "medium", "question": "A web-only survey of the adult population is planned. Internet use is much lower among people aged 75+. The team proposes doubling the sample size to fix the problem. Which assessment is correct?", "options": {"A": "A larger sample removes the bias, because the estimator is consistent as n grows.", "B": "The problem is sampling error, which is solved by a larger sample.", "C": "The bias disappears as long as the response rate among those invited exceeds 50%.", "D": "A larger sample reduces sampling variance but not the coverage bias."}, "answer": "D", "explanations": {"A": "Wrong. Consistency in the design-based sense refers to the covered population; the offline population is never sampled.", "B": "Wrong. Systematic exclusion of a subgroup is a non-sampling (coverage) error.", "C": "Wrong. The response rate among those covered says nothing about people who could never be selected.", "D": "Correct. Bias does not shrink with n. It requires a design change (other modes, a frame covering offline people) or adjustment using auxiliary information."}, "source": "Groves et al., Survey Methodology (Total Survey Error); Eurostat Quality Assurance Framework"}, {"id": "B1-021", "block": 1, "topic": "Bias and survey errors", "difficulty": "hard", "question": "In an income survey, item non-response is much higher among high earners, and this remains true after controlling for age, region, education and occupation. How is the missing-data mechanism best described?", "options": {"A": "Missing completely at random (MCAR)", "B": "Missing not at random (MNAR)", "C": "Missing at random (MAR)", "D": "Ignorable by design"}, "answer": "B", "explanations": {"A": "Wrong. MCAR would mean missingness is unrelated to any variable, observed or not.", "B": "Correct. The probability of missingness depends on the unobserved value itself (income), even after conditioning on observed covariates.", "C": "Wrong. MAR would hold if the observed covariates fully explained the missingness; the question states they do not.", "D": "Wrong. Ignorability requires MCAR or MAR (plus distinct parameters); MNAR is non-ignorable."}, "source": "Rubin (1976), Inference and missing data; Little & Rubin, Statistical Analysis with Missing Data"}, {"id": "B1-022", "block": 1, "topic": "Bias and survey errors", "difficulty": "medium", "question": "After non-response adjustment, survey weights are modified so that weighted totals by age group and sex match population totals from the population register. What is this technique and its main purpose?", "options": {"A": "Imputation; to fill in missing items for unit non-respondents.", "B": "Calibration; to match known totals and reduce bias and variance.", "C": "Seasonal adjustment; to remove calendar effects from estimates.", "D": "Top-coding; to protect the confidentiality of the highest values."}, "answer": "B", "explanations": {"A": "Wrong. Imputation replaces missing values; it does not adjust weights.", "B": "Correct. Calibration estimators (e.g. GREG, raking) adjust weights to benchmark totals and are standard in ESS social surveys.", "C": "Wrong. Seasonal adjustment applies to time series, not to unit weights.", "D": "Wrong. Top-coding is a disclosure control method."}, "source": "Deville & Särndal (1992), Calibration estimators in survey sampling; Eurostat ESS guidelines on weighting"}, {"id": "B1-023", "block": 1, "topic": "Bias and survey errors", "difficulty": "easy", "question": "In a face-to-face survey, respondents under-report alcohol consumption and over-report voting. Which source of error is this?", "options": {"A": "Social desirability bias", "B": "Undercoverage of the frame", "C": "Random sampling error", "D": "Data processing error"}, "answer": "A", "explanations": {"A": "Correct. Respondents shift answers towards socially approved behaviour; self-administered modes usually reduce it.", "B": "Wrong. Coverage concerns who can be selected, not how selected people answer.", "C": "Wrong. Sampling error is random variation from selecting a sample and has no systematic direction.", "D": "Wrong. Processing errors occur after collection, e.g. during coding or keying."}, "source": "Groves et al., Survey Methodology; Tourangeau & Yan (2007), Sensitive questions in surveys"}, {"id": "B1-024", "block": 1, "topic": "Bias and survey errors", "difficulty": "medium", "question": "Respondents asked about purchases 'in the last 12 months' report some purchases that actually happened 15 months ago. What is this phenomenon called and which design feature reduces it?", "options": {"A": "Backward telescoping; using a longer reference period.", "B": "Interviewer effect; increasing interviewer workload.", "C": "Forward telescoping; bounded interviews or diaries.", "D": "Proxy bias; allowing more proxy interviews per household."}, "answer": "C", "explanations": {"A": "Wrong. Backward telescoping moves events further into the past, and longer periods increase recall problems.", "B": "Wrong. The error comes from memory dating, not from the interviewer; higher workload tends to increase interviewer effects.", "C": "Correct. Events are remembered as more recent than they were. Bounding (using a previous interview as reference) and diaries reduce it.", "D": "Wrong. Proxy interviews usually worsen recall accuracy."}, "source": "Neter & Waksberg (1964); Eurostat Household Budget Survey methodology"}, {"id": "B1-025", "block": 1, "topic": "Bias and survey errors", "difficulty": "medium", "question": "A survey issued 2,000 addresses. 150 turned out to be ineligible (vacant or non-residential), 1,110 households gave a complete interview, and the rest refused or were not contacted. What is the response rate among eligible units?", "options": {"A": "55.5%", "B": "60%", "C": "63.4%", "D": "40%"}, "answer": "B", "explanations": {"A": "Wrong. This divides by all 2,000 issued addresses, including ineligible ones.", "B": "Correct. Eligible units = 2,000 − 150 = 1,850; response rate = 1,110 / 1,850 = 60%.", "C": "Wrong. This divides 1,110 by 1,750, subtracting the ineligibles twice.", "D": "Wrong. This is the non-response rate among eligible units."}, "source": "AAPOR Standard Definitions; Eurostat quality reporting (ESQRS) indicator on unit response rate"}, {"id": "B1-026", "block": 1, "topic": "Bias and survey errors", "difficulty": "hard", "question": "Within the Total Survey Error framework, which pair correctly classifies two errors?", "options": {"A": "Unit non-response is a measurement error; coding mistakes are representation errors.", "B": "Sampling error is a measurement error; mode effects are coverage errors.", "C": "All non-sampling errors are random and cancel out in large samples.", "D": "Frame undercoverage is a representation error; a misunderstood question is a measurement error."}, "answer": "D", "explanations": {"A": "Wrong. Non-response affects who is represented; coding mistakes are processing (measurement side) errors.", "B": "Wrong. Sampling error is on the representation side; mode effects mainly affect measurement (and selection).", "C": "Wrong. Many non-sampling errors are systematic and produce bias that does not decrease with sample size.", "D": "Correct. TSE separates errors of representation (coverage, sampling, non-response, adjustment) from errors of measurement (validity, measurement, processing)."}, "source": "Groves et al., Survey Methodology (2nd ed.), ch. 2; Biemer (2010), Total Survey Error"}, {"id": "B1-027", "block": 1, "topic": "Bias and survey errors", "difficulty": "medium", "question": "In a labour market survey, one adult answers for all household members. Compared with self-reports, what is the main expected risk for variables such as hours worked or job search activity?", "options": {"A": "Increased sampling error because the household counts as one unit.", "B": "Proxy response error, as the proxy may lack accurate knowledge.", "C": "Overcoverage of the frame, as more persons are listed in each household.", "D": "A breach of statistical confidentiality between household members."}, "answer": "B", "explanations": {"A": "Wrong. Who answers does not change the number of units sampled.", "B": "Correct. Proxy interviews cut cost and non-response but can reduce accuracy, especially for detailed or subjective items. Their share is usually reported as a quality indicator.", "C": "Wrong. Proxy answering does not add out-of-scope units to the frame.", "D": "Wrong. Proxy answering is a normal survey practice and is not a disclosure issue."}, "source": "Eurostat, EU-LFS explanatory notes; Regulation (EU) 2019/1700"}, {"id": "B1-028", "block": 1, "topic": "SDMX and metadata", "difficulty": "easy", "question": "Which organisations sponsor the SDMX initiative?", "options": {"A": "Eurostat, ISO, W3C and the European Data Protection Board", "B": "BIS, ECB, Eurostat, IMF, OECD, United Nations and World Bank", "C": "Only Eurostat and the national statistical institutes of the Member States", "D": "The ECB and national central banks of the euro area only"}, "answer": "B", "explanations": {"A": "Wrong. W3C and the EDPB are not SDMX sponsors; ISO publishes SDMX as a standard but is not a sponsor.", "B": "Correct. These seven international organisations sponsor SDMX, now an ISO standard (ISO 17369).", "C": "Wrong. SDMX is a global initiative, not limited to the ESS.", "D": "Wrong. The ECB is one sponsor among seven; the standard is not limited to central banks."}, "source": "sdmx.org, SDMX sponsors; ISO 17369:2013"}, {"id": "B1-029", "block": 1, "topic": "SDMX and metadata", "difficulty": "medium", "question": "In an SDMX Data Structure Definition (DSD) for a regional unemployment dataset, how are FREQ, OBS_STATUS and OBS_VALUE normally modelled?", "options": {"A": "FREQ is an attribute, OBS_STATUS is a dimension and OBS_VALUE is a code list.", "B": "All three are dimensions, since every concept must identify the observation.", "C": "FREQ is a dimension, OBS_STATUS is an attribute and OBS_VALUE is the primary measure.", "D": "All three are attributes attached at dataset level."}, "answer": "C", "explanations": {"A": "Wrong. Frequency identifies series, so it is a dimension; status qualifies values, so it is an attribute.", "B": "Wrong. If OBS_STATUS were a dimension, changing a flag would create a new series.", "C": "Correct. Dimensions identify the observation, attributes qualify it (e.g. estimated, provisional), and the measure holds the value.", "D": "Wrong. Dimensions are needed to build the series key, and OBS_VALUE is the measure."}, "source": "SDMX Information Model (SDMX 2.1/3.0, Section 2); SDMX Content-Oriented Guidelines"}, {"id": "B1-030", "block": 1, "topic": "SDMX and metadata", "difficulty": "medium", "question": "A DSD has dimensions in the order FREQ.GEO.INDICATOR. Using SDMX RESTful syntax, which key requests annual data for Germany and France for indicator UNEMP?", "options": {"A": "A.DE+FR.UNEMP", "B": "A.DE,FR.UNEMP", "C": "UNEMP.DE+FR.A", "D": "A..UNEMP"}, "answer": "A", "explanations": {"A": "Correct. Dimension values are separated by dots in DSD order, and '+' combines several values of one dimension.", "B": "Wrong. In SDMX REST keys the OR operator is '+', not a comma.", "C": "Wrong. The key must follow the dimension order defined in the DSD.", "D": "Wrong. An empty position is a wildcard, which returns all countries, not only DE and FR."}, "source": "SDMX RESTful web services specification (SDMX 2.1/3.0)"}, {"id": "B1-031", "block": 1, "topic": "SDMX and metadata", "difficulty": "medium", "question": "What is the difference between structural metadata and reference metadata in SDMX?", "options": {"A": "Structural metadata are confidential and kept internal; reference metadata are always published.", "B": "Reference metadata are the code lists of a DSD; structural metadata are the national quality reports.", "C": "Structural metadata describe how data are organised; reference metadata describe methods and quality.", "D": "There is no difference; the two terms are used as synonyms throughout the SDMX standards."}, "answer": "C", "explanations": {"A": "Wrong. The distinction is by function, not confidentiality.", "B": "Wrong. This reverses the definitions.", "C": "Correct. Structural metadata are needed to read and validate the data; reference metadata (e.g. SIMS reports) inform users about methods and quality.", "D": "Wrong. SDMX models them separately (DSD vs Metadata Structure Definition)."}, "source": "SDMX Information Model; Eurostat, Euro SDMX Metadata Structure documentation"}, {"id": "B1-032", "block": 1, "topic": "SDMX and metadata", "difficulty": "medium", "question": "What is the Single Integrated Metadata Structure (SIMS) used for in the ESS?", "options": {"A": "It is the file format used by Member States to transmit microdata to Eurostat via eDAMIS.", "B": "It is the data structure definition used for transmitting national accounts aggregates.", "C": "It is the statistical classification of economic activities used in business statistics.", "D": "It is a common inventory of reference metadata concepts merging ESMS and ESQRS."}, "answer": "D", "explanations": {"A": "Wrong. SIMS is a metadata concept list, not a data transmission format.", "B": "Wrong. National accounts use their own DSDs; SIMS covers reference metadata.", "C": "Wrong. That is NACE.", "D": "Correct. SIMS allows metadata and quality reports to be produced from one inventory of concepts."}, "source": "Eurostat, Single Integrated Metadata Structure (SIMS) v2.0 documentation"}, {"id": "B1-033", "block": 1, "topic": "SDMX and metadata", "difficulty": "hard", "question": "A data provider adds a UNIT_MULT attribute (unit multiplier) with the value 6. A user downloads OBS_VALUE = 3.2 for a series in euro. How should the observation be read?", "options": {"A": "3.2 euro to six decimal places", "B": "3.2 × 6 = 19.2 euro", "C": "3.2 million euro", "D": "3.2 thousand euro"}, "answer": "C", "explanations": {"A": "Wrong. Decimal precision is described by the DECIMALS attribute, not UNIT_MULT.", "B": "Wrong. The multiplier is an exponent of 10, not a factor.", "C": "Correct. UNIT_MULT gives the power of 10 by which OBS_VALUE is multiplied: 3.2 × 10⁶.", "D": "Wrong. Thousands correspond to UNIT_MULT = 3."}, "source": "SDMX Content-Oriented Guidelines, cross-domain concept UNIT_MULT"}, {"id": "B1-034", "block": 1, "topic": "SDMX and metadata", "difficulty": "medium", "question": "What is the purpose of the SDMX Content-Oriented Guidelines (COG)?", "options": {"A": "To define the XML schema syntax and validation rules of SDMX-ML messages.", "B": "To set the legal deadlines for transmitting each dataset to Eurostat.", "C": "To specify the encryption and authentication used by eDAMIS transmissions.", "D": "To harmonise cross-domain concepts and code lists so that DSDs are interoperable."}, "answer": "D", "explanations": {"A": "Wrong. Syntax is set by the technical standards, not the content guidelines.", "B": "Wrong. Deadlines are set by domain legislation.", "C": "Wrong. Security of transmission is outside the COG.", "D": "Correct. The COG include cross-domain concepts, cross-domain code lists and a subject-matter domain list."}, "source": "SDMX Content-Oriented Guidelines (sdmx.org)"}, {"id": "B1-035", "block": 1, "topic": "SDMX and metadata", "difficulty": "medium", "question": "Under the SDMX 'pull' data-sharing model, how does Eurostat obtain a country's data?", "options": {"A": "The country sends the file as an e-mail attachment to the Eurostat domain manager.", "B": "The provider makes data available at an endpoint, and Eurostat retrieves them.", "C": "Eurostat re-collects the data directly from the respondents in the country.", "D": "Eurostat estimates the data from other sources without contacting the country."}, "answer": "B", "explanations": {"A": "Wrong. This is a (non-recommended) push practice, not pull.", "B": "Correct. In pull mode the receiver collects data from the provider's endpoint; in push mode the provider sends files to the receiver.", "C": "Wrong. Eurostat does not collect data directly from national respondents in this model.", "D": "Wrong. That is estimation, not a data-sharing model."}, "source": "SDMX Standards, Section 1 (Framework); Eurostat SDMX data exchange guidelines"}, {"id": "B1-036", "block": 1, "topic": "SDMX and metadata", "difficulty": "easy", "question": "In SDMX, what is a code list?", "options": {"A": "A list of the software programs that can read and write SDMX files.", "B": "The ordered list of dimensions that makes up the series key of a DSD.", "C": "A maintained list of the allowed values for a dimension or attribute.", "D": "A list of the data providers registered in the SDMX registry."}, "answer": "C", "explanations": {"A": "Wrong. That is a tool inventory, not a code list.", "B": "Wrong. That is the dimension list (key structure).", "C": "Correct. For example, CL_FREQ lists A (annual), Q (quarterly), M (monthly), and so on.", "D": "Wrong. That is a data provider scheme."}, "source": "SDMX Information Model; SDMX glossary"}, {"id": "B1-037", "block": 1, "topic": "SDMX and metadata", "difficulty": "hard", "question": "A DSD is changed so that a new mandatory dimension is added. According to SDMX maintenance rules, what should happen?", "options": {"A": "The existing final version can simply be edited, since dimensions are optional.", "B": "A new version of the DSD must be issued, because the series keys change.", "C": "Only the dataflow name needs to change, while the DSD stays exactly the same.", "D": "Nothing changes, because the new dimension can be stored as an attribute."}, "answer": "B", "explanations": {"A": "Wrong. Final artefacts are immutable, and dimensions are never optional in a key.", "B": "Correct. Structural changes that affect existing data require a new version of the maintainable artefact; finalised versions must not be modified.", "C": "Wrong. The dataflow refers to the DSD; the structure itself changes.", "D": "Wrong. The question states it is a dimension; storing it as an attribute changes the model."}, "source": "SDMX Standards, Section 2 (Information Model), versioning of maintainable artefacts"}, {"id": "B1-038", "block": 1, "topic": "Data exchange with Member States", "difficulty": "easy", "question": "What is eDAMIS in the European Statistical System?", "options": {"A": "Eurostat's public dissemination database for European statistics.", "B": "The statistical classification of economic activities in the EU.", "C": "Eurostat's secure single entry point for transmitting data files.", "D": "A probability sampling method used for EU business surveys."}, "answer": "C", "explanations": {"A": "Wrong. Public dissemination is via the Eurostat database (Data Browser).", "B": "Wrong. That is NACE.", "C": "Correct. eDAMIS (electronic Data files Administration and Management Information System) manages the transmission of datasets and tracks their receipt.", "D": "Wrong. It is a transmission system, not a method."}, "source": "Eurostat, eDAMIS documentation (Single Entry Point)"}, {"id": "B1-039", "block": 1, "topic": "Data exchange with Member States", "difficulty": "medium", "question": "A Member State submits a file that passes format checks, but Eurostat's validation finds that regional totals do not add up to the national total. What is the usual next step?", "options": {"A": "Eurostat silently overwrites the national total with the sum of the regional values.", "B": "Eurostat sends a validation report, and the country corrects or explains the data.", "C": "The file is published as it is, with a footnote explaining the regional inconsistency.", "D": "The Member State is automatically fined for transmitting inconsistent data to Eurostat."}, "answer": "B", "explanations": {"A": "Wrong. Eurostat does not change national data without agreement; that would harm transparency and ownership.", "B": "Correct. Validation in the ESS is shared: errors are reported back to the producer, who is responsible for its data.", "C": "Wrong. Validation errors are resolved before publication.", "D": "Wrong. Validation feedback is a normal process, not a sanction."}, "source": "Eurostat, ESS Handbook: Methodology for data validation 2.0"}, {"id": "B1-040", "block": 1, "topic": "Data exchange with Member States", "difficulty": "hard", "question": "Under Regulation (EC) No 223/2009, under what condition may confidential data be transmitted between ESS authorities?", "options": {"A": "Never; confidential data must always remain in the Member State where they were collected.", "B": "Whenever any public authority requests them in order to take administrative decisions.", "C": "Only after the data have first been published on the national statistical website.", "D": "When necessary for producing European statistics, and used only for statistical purposes."}, "answer": "D", "explanations": {"A": "Wrong. The regulation explicitly provides for transmission within the ESS.", "B": "Wrong. Confidential statistical data may not be used for administrative purposes about individual units.", "C": "Wrong. Confidential data are by definition not published.", "D": "Correct. Article 21 allows such transmissions; the receiving authorities must protect confidentiality."}, "source": "Regulation (EC) No 223/2009, Arts. 20–21"}, {"id": "B1-041", "block": 1, "topic": "Validation and standards", "difficulty": "medium", "question": "In the ESS methodology for data validation, what do 'level 0' validation rules check?", "options": {"A": "Consistency with data published by other organisations, such as the IMF.", "B": "Plausibility of growth rates compared with the values of the previous year.", "C": "Whether the statistics produced meet the needs of the main users.", "D": "The format and structure of the file, e.g. delimiters, columns and codes."}, "answer": "D", "explanations": {"A": "Wrong. Comparisons with external sources are at the highest validation level.", "B": "Wrong. Time-series plausibility is a content check at a higher level.", "C": "Wrong. That is relevance, a quality dimension, not a validation level.", "D": "Correct. Level 0 checks whether the file can be read and matches the agreed structure, before any check of content."}, "source": "Eurostat, Methodology for data validation 2.0 (ESS Handbook)"}, {"id": "B1-042", "block": 1, "topic": "Validation and standards", "difficulty": "medium", "question": "What is VTL in the context of ESS data validation?", "options": {"A": "A visual tool for designing electronic questionnaires for ESS surveys.", "B": "A licence that allows the free commercial reuse of Eurostat data.", "C": "A standard language for expressing validation rules and transformations.", "D": "The common classification of territorial units for statistics."}, "answer": "C", "explanations": {"A": "Wrong. VTL is a language for rules, not a questionnaire designer.", "B": "Wrong. Reuse is governed by the Commission's reuse policy, not VTL.", "C": "Correct. VTL lets producers and Eurostat share validation rules in one formal language that different tools can execute.", "D": "Wrong. That is NUTS."}, "source": "SDMX Technical Working Group, VTL 2.0/2.1 specifications"}, {"id": "B1-043", "block": 1, "topic": "Validation and standards", "difficulty": "easy", "question": "Eurostat publishes a value with the flag 'p'. What does it mean?", "options": {"A": "Protected (confidential)", "B": "Break in time series", "C": "Estimated", "D": "Provisional"}, "answer": "D", "explanations": {"A": "Wrong. Confidential values use the flag 'c'.", "B": "Wrong. A break in series is flagged 'b'.", "C": "Wrong. Estimated values are flagged 'e'.", "D": "Correct. 'p' marks provisional data that may be revised."}, "source": "Eurostat, Codes and flags used in the Eurostat database"}, {"id": "B1-044", "block": 1, "topic": "Validation and standards", "difficulty": "medium", "question": "Which classification is used in the ESS to classify economic activities, and which version has applied to European statistics since 2025?", "options": {"A": "NACE; NACE Rev. 2.1", "B": "ISCO; ISCO-08", "C": "CPA; CPA 2.1", "D": "NUTS; NUTS 2024"}, "answer": "A", "explanations": {"A": "Correct. NACE Rev. 2.1 (Regulation (EU) 2023/137) applies to statistics referring to periods from 1 January 2025.", "B": "Wrong. ISCO classifies occupations, not economic activities.", "C": "Wrong. CPA classifies products, although it is linked to NACE.", "D": "Wrong. NUTS classifies territorial units."}, "source": "Commission Delegated Regulation (EU) 2023/137 (NACE Rev. 2.1)"}, {"id": "B1-045", "block": 1, "topic": "Validation and standards", "difficulty": "medium", "question": "Under the NUTS Regulation, what is the indicative population range for a NUTS 2 region?", "options": {"A": "3 to 7 million inhabitants", "B": "150,000 to 800,000 inhabitants", "C": "Fewer than 150,000 inhabitants", "D": "800,000 to 3 million inhabitants"}, "answer": "D", "explanations": {"A": "Wrong. That is the range for NUTS 1.", "B": "Wrong. That is the range for NUTS 3.", "C": "Wrong. Smaller units are below NUTS 3, such as local administrative units (LAU).", "D": "Correct. NUTS 1: 3–7 million; NUTS 2: 800,000–3 million; NUTS 3: 150,000–800,000."}, "source": "Regulation (EC) No 1059/2003 (NUTS), Art. 3"}, {"id": "B1-046", "block": 1, "topic": "Validation and standards", "difficulty": "medium", "question": "In the Generic Statistical Business Process Model (GSBPM v5.1), in which phase are the sub-processes 'Review and validate' and 'Edit and impute' found?", "options": {"A": "Phase 5, Process", "B": "Phase 4, Collect", "C": "Phase 6, Analyse", "D": "Phase 2, Design"}, "answer": "A", "explanations": {"A": "Correct. Phase 5 includes integrate data, classify and code, review and validate, edit and impute, derive new variables, and others.", "B": "Wrong. Collect covers creating the frame and sample, setting up collection, running it and finalising collection.", "C": "Wrong. Analyse covers preparing draft outputs, validating outputs, interpreting and applying disclosure control.", "D": "Wrong. Design plans the processes, including validation rules, but does not run them."}, "source": "UNECE, Generic Statistical Business Process Model v5.1 (2019)"}, {"id": "B1-047", "block": 1, "topic": "Validation and standards", "difficulty": "hard", "question": "A respondent in a business survey reports turnover but leaves the number of employees blank. The office replaces the missing value with the value from a randomly chosen similar enterprise (same NACE class and size class) that responded. What is this method called, and what is one advantage compared with mean imputation?", "options": {"A": "Cold-deck imputation; it gives more accurate values because donors come from past surveys.", "B": "Deductive imputation; it derives the missing value with certainty from other items.", "C": "Random hot-deck; it preserves the variable's distribution better than mean imputation.", "D": "Listwise deletion; it removes the incomplete record so no artificial values are added."}, "answer": "C", "explanations": {"A": "Wrong. Cold-deck donors come from an external or earlier source; here the donor is from the current survey.", "B": "Wrong. Deductive imputation uses logical rules (e.g. a total minus known parts); a random donor is not certain.", "C": "Correct. Donor-based imputation uses observed values, so the imputed data keep realistic variation; mean imputation shrinks variance.", "D": "Wrong. The record is kept and completed, not deleted."}, "source": "Eurostat, Handbook on methodology of modern business statistics (Memobust), imputation modules"}, {"id": "B1-048", "block": 1, "topic": "Validation and standards", "difficulty": "medium", "question": "A validation rule states: 'Number of employees must be 0 if turnover is 0 and the enterprise is flagged inactive.' Which type of validation rule is this?", "options": {"A": "A logical consistency rule within a record", "B": "A range check on a single variable's values", "C": "A time-series plausibility check over periods", "D": "A format check on data types and file structure"}, "answer": "A", "explanations": {"A": "Correct. It checks that combinations of values within a record are logically consistent.", "B": "Wrong. A range check tests one variable against bounds, e.g. employees ≥ 0.", "C": "Wrong. It does not compare values with earlier periods.", "D": "Wrong. Format checks test data types and structure, not relationships between values."}, "source": "Eurostat, Methodology for data validation 2.0; de Waal et al., Handbook of Statistical Data Editing and Imputation"}, {"id": "B1-049", "block": 1, "topic": "Eurostat and ESS context", "difficulty": "easy", "question": "How many principles does the European Statistics Code of Practice contain, as revised in 2017?", "options": {"A": "12", "B": "16", "C": "5", "D": "20"}, "answer": "B", "explanations": {"A": "Wrong. Twelve is not the number of principles in the current Code.", "B": "Correct. The 16 principles cover the institutional environment, statistical processes and statistical outputs.", "C": "Wrong. Five is closer to the number of output quality dimensions, not principles.", "D": "Wrong. The Code has 16 principles supported by indicators."}, "source": "European Statistics Code of Practice, revised edition 2017 (ESSC)"}, {"id": "B1-050", "block": 1, "topic": "Eurostat and ESS context", "difficulty": "medium", "question": "Article 12 of Regulation (EC) No 223/2009 lists quality criteria for European statistics. Which of the following is NOT one of them?", "options": {"A": "Profitability", "B": "Coherence", "C": "Punctuality", "D": "Accessibility and clarity"}, "answer": "A", "explanations": {"A": "Correct. The criteria are relevance, accuracy, timeliness, punctuality, accessibility and clarity, comparability and coherence.", "B": "Wrong. Coherence is one of the listed criteria.", "C": "Wrong. Punctuality is listed together with timeliness.", "D": "Wrong. This is one of the listed criteria."}, "source": "Regulation (EC) No 223/2009, Art. 12"}, {"id": "B1-051", "block": 1, "topic": "Eurostat and ESS context", "difficulty": "medium", "question": "Which regulation provides the common legal framework for the main EU household surveys, such as the Labour Force Survey and EU-SILC?", "options": {"A": "Regulation (EU) 2019/1700 on integrated European social statistics", "B": "Regulation (EU) 2019/2152 on European business statistics (EBS)", "C": "Regulation (EU) 2016/679 on the protection of personal data (GDPR)", "D": "Regulation (EC) No 1059/2003 on the NUTS classification of regions"}, "answer": "A", "explanations": {"A": "Correct. IESS replaced separate legal acts and harmonises concepts, precision requirements and metadata across social surveys from 2021.", "B": "Wrong. EBS covers business statistics.", "C": "Wrong. GDPR is the data protection framework, not a statistical survey regulation.", "D": "Wrong. That regulation establishes the territorial classification."}, "source": "Regulation (EU) 2019/1700 (IESS)"}, {"id": "B1-052", "block": 1, "topic": "Eurostat and ESS context", "difficulty": "medium", "question": "Which statement best describes the European Statistical System (ESS)?", "options": {"A": "A single EU agency that collects all statistics directly from citizens and businesses.", "B": "A partnership of Eurostat and the national authorities producing European statistics.", "C": "The network of national central banks that produces monetary and financial statistics.", "D": "The IT system that national authorities use for transmitting data files to Eurostat."}, "answer": "B", "explanations": {"A": "Wrong. Most data are collected by national authorities, not by Eurostat directly.", "B": "Correct. Article 4 of Regulation 223/2009 defines the ESS as this partnership; Eurostat is the statistical authority of the Union.", "C": "Wrong. That is the ESCB, which cooperates with the ESS but is separate.", "D": "Wrong. That describes eDAMIS."}, "source": "Regulation (EC) No 223/2009, Art. 4"}, {"id": "B1-053", "block": 1, "topic": "Eurostat and ESS context", "difficulty": "hard", "question": "A cell in a business statistics table has three enterprises, but one of them accounts for 92% of the cell's turnover. A dominance rule (n = 1, k = 85) is applied. What should happen to the cell?", "options": {"A": "It can be published, because it has at least three contributors.", "B": "It should be confidential, because the largest contributor exceeds 85% of the total.", "C": "It can be published if its value is rounded to the nearest thousand euro.", "D": "The dominant enterprise must be deleted from the underlying microdata."}, "answer": "B", "explanations": {"A": "Wrong. Passing the threshold (minimum frequency) rule does not mean passing the dominance rule.", "B": "Correct. Under an (n, k) dominance rule a cell is sensitive if the n largest contributors exceed k% of the total, regardless of the number of contributors.", "C": "Wrong. Rounding does not normally protect a cell dominated by one contributor.", "D": "Wrong. Disclosure control applies to the output, not to deleting units from the source data."}, "source": "Eurostat / ESSnet, Handbook on Statistical Disclosure Control (Hundepool et al.)"}, {"id": "B1-054", "block": 1, "topic": "Eurostat and ESS context", "difficulty": "medium", "question": "Under Regulation (EC) No 223/2009, what does the principle of statistical confidentiality require?", "options": {"A": "Data identifying units may be used only for statistical purposes and must be protected.", "B": "No statistics may ever be published below national level, in order to protect units.", "C": "Confidential data may be shared with tax authorities to check individual tax returns.", "D": "All microdata must be destroyed once the corresponding statistics have been published."}, "answer": "A", "explanations": {"A": "Correct. Article 20 requires protection of confidential data and limits their use to exclusively statistical purposes.", "B": "Wrong. Regional statistics are published when disclosure control is applied.", "C": "Wrong. Using statistical data for administrative or control purposes is prohibited.", "D": "Wrong. Microdata may be kept and even made available to researchers under strict conditions."}, "source": "Regulation (EC) No 223/2009, Arts. 2 and 20; ESS Code of Practice, Principle 5"}, {"id": "B1-055", "block": 1, "topic": "Geospatial and new data sources", "difficulty": "medium", "question": "For the 2021 census round, EU Member States had to provide a set of census variables on a standard grid. What is the grid cell size?", "options": {"A": "100 m²", "B": "10 km²", "C": "1 km²", "D": "NUTS 3 regions"}, "answer": "C", "explanations": {"A": "Wrong. That is far smaller than the grid required for the 2021 census.", "B": "Wrong. The required resolution is 1 km².", "C": "Correct. Regulation (EU) 2018/1799 required selected census topics on a 1 km² grid, based on the INSPIRE-compliant European grid.", "D": "Wrong. NUTS 3 are administrative regions, not grid cells."}, "source": "Commission Implementing Regulation (EU) 2018/1799; INSPIRE Directive 2007/2/EC"}, {"id": "B1-056", "block": 1, "topic": "Geospatial and new data sources", "difficulty": "easy", "question": "What is GISCO?", "options": {"A": "A sampling frame of enterprises used for EU business surveys.", "B": "A metadata standard that replaces SDMX for regional statistics.", "C": "The EU-wide census of agriculture carried out every ten years.", "D": "The Commission's geographic information service, managed by Eurostat."}, "answer": "D", "explanations": {"A": "Wrong. Business sampling frames are national statistical business registers.", "B": "Wrong. GISCO is a service for geographic data, not a metadata standard.", "C": "Wrong. Agricultural censuses are run nationally under agricultural statistics legislation.", "D": "Correct. GISCO maintains geodata used to map and geo-reference European statistics."}, "source": "Eurostat, GISCO website"}, {"id": "B1-057", "block": 1, "topic": "Geospatial and new data sources", "difficulty": "hard", "question": "A statistical office considers estimating tourist flows from mobile network operator data. Which issue is most important to address before producing official statistics?", "options": {"A": "Sampling error, which is very large because too few people carry mobile phones.", "B": "Compliance of the mobile network data with the NACE classification of activities.", "C": "Representativeness: SIM cards are not persons and coverage varies by operator and group.", "D": "Seasonal adjustment, which is impossible to apply to mobile network time series."}, "answer": "C", "explanations": {"A": "Wrong. Volumes are huge; the problem is selectivity bias, not sampling variance.", "B": "Wrong. NACE classifies economic activities, not tourist movements.", "C": "Correct. Mobile data cover devices, not the target population, so they need calibration to known totals and a clear statistical unit, plus legal access and privacy safeguards.", "D": "Wrong. Seasonal adjustment can be applied to these time series."}, "source": "Eurostat, ESSnet Big Data / Trusted Smart Statistics; Bucharest Memorandum on Official Statistics in a Datafied Society (2018)"}, {"id": "B1-058", "block": 1, "topic": "Geospatial and new data sources", "difficulty": "medium", "question": "A statistical office starts web scraping online retailers' prices for the HICP. Which practice is most appropriate?", "options": {"A": "Scrape as fast as possible so that all prices are collected before they change.", "B": "Respect site terms and robots.txt, limit request rates and document the ECOICOP mapping.", "C": "Replace all other price collection at once, since scraped online data are complete.", "D": "Publish the scraped raw prices with retailer names to increase transparency."}, "answer": "B", "explanations": {"A": "Wrong. Aggressive scraping can overload servers and break netiquette principles.", "B": "Correct. Ethical and transparent scraping protects relations with site owners, and mapping to the classification ensures methodological quality.", "C": "Wrong. Online prices do not represent all outlets; scraping complements traditional collection.", "D": "Wrong. Retailer-level prices are not published as official statistics."}, "source": "Eurostat, Guide on multilateral methods in the HICP and practical guide on web scraping for the HICP"}, {"id": "B1-059", "block": 1, "topic": "Geospatial and new data sources", "difficulty": "medium", "question": "What is the main purpose of the INSPIRE Directive (2007/2/EC)?", "options": {"A": "To harmonise the methods of national consumer price indices across the EU.", "B": "To regulate statistical access to administrative tax data held by ministries.", "C": "To build an EU infrastructure of interoperable spatial data and services.", "D": "To define the classification of territorial units for statistics (NUTS)."}, "answer": "C", "explanations": {"A": "Wrong. HICP has its own legal framework.", "B": "Wrong. INSPIRE concerns spatial data.", "C": "Correct. INSPIRE sets common rules for metadata, data specifications and network services for spatial data.", "D": "Wrong. NUTS is defined by Regulation (EC) No 1059/2003."}, "source": "Directive 2007/2/EC (INSPIRE)"}, {"id": "B1-060", "block": 1, "topic": "Sampling design", "difficulty": "easy", "question": "A business population is split into two strata. Stratum 1 has 400 enterprises and a sample mean of 50 employees; stratum 2 has 600 enterprises and a sample mean of 20 employees. What is the stratified estimate of total employment?", "options": {"A": "35,000", "B": "70", "C": "32", "D": "32,000"}, "answer": "D", "explanations": {"A": "Wrong. This multiplies the unweighted average of the stratum means (35) by 1,000 units, ignoring stratum sizes.", "B": "Wrong. This adds the two stratum means, which is not an estimate of any population quantity.", "C": "Wrong. This is the estimated mean per enterprise (32,000/1,000), not the total.", "D": "Correct. Estimated total = Σ N_h × ȳ_h = 400 × 50 + 600 × 20 = 20,000 + 12,000 = 32,000."}, "source": "Cochran, Sampling Techniques, ch. 5"}, {"id": "B2-001", "block": 2, "topic": "Missing data mechanisms", "difficulty": "medium", "question": "In a household survey, households with very high incomes are less likely to answer the income question, even after accounting for all observed variables such as region, age and household size. Which missing-data mechanism best describes this situation?", "options": {"A": "Missing completely at random (MCAR)", "B": "Missing at random (MAR)", "C": "Missing not at random (MNAR)", "D": "Structural missingness (the question does not apply)"}, "answer": "C", "explanations": {"A": "Incorrect. MCAR means missingness is unrelated to any variable, observed or not. Here it depends on income itself.", "B": "Incorrect. MAR means missingness depends only on observed variables. The scenario states the dependence remains after controlling for them.", "C": "Correct. Missingness depends on the unobserved value itself (income), which is the definition of MNAR. Standard imputation assuming MAR will tend to underestimate incomes.", "D": "Incorrect. Structural missingness applies when a value logically cannot exist (e.g. spouse's age for a single person). Income exists for these households."}, "source": "Little & Rubin, Statistical Analysis with Missing Data; Eurostat Memobust Handbook on imputation"}, {"id": "B2-002", "block": 2, "topic": "Missing data mechanisms", "difficulty": "medium", "question": "In a health dataset, blood-pressure readings are missing more often for older respondents. Within each age group, however, whether a reading is missing is unrelated to the respondent's actual blood pressure. Age is recorded for everyone. Which mechanism applies?", "options": {"A": "Missing not at random (MNAR)", "B": "Missing at random (MAR)", "C": "Missing completely at random (MCAR)", "D": "Non-ignorable missingness"}, "answer": "B", "explanations": {"A": "Incorrect. MNAR would require missingness to depend on blood pressure itself after conditioning on observed data.", "B": "Correct. Missingness depends on an observed variable (age) but not on the missing value given age. This is MAR, and methods that condition on age (e.g. regression or multiple imputation) can correct for it.", "C": "Incorrect. MCAR would require the probability of missingness to be the same for all respondents, but it varies with age.", "D": "Incorrect. 'Non-ignorable' is essentially another name for MNAR, which does not fit."}, "source": "Little & Rubin, Statistical Analysis with Missing Data; Eurostat Memobust Handbook on imputation"}, {"id": "B2-003", "block": 2, "topic": "Handling missing values", "difficulty": "medium", "question": "Values are missing completely at random (MCAR) in 15% of records. An analyst applies listwise (complete-case) deletion before estimating a mean. What is the main consequence?", "options": {"A": "Estimates stay unbiased, but they lose precision because the sample is smaller.", "B": "The estimate becomes biased towards the values of the records that were deleted.", "C": "The variance of the estimate is artificially reduced by removing incomplete cases.", "D": "There is no consequence at all, because complete cases carry all relevant information."}, "answer": "A", "explanations": {"A": "Correct. Under MCAR the complete cases are a random subsample, so estimates stay unbiased; the cost is a loss of precision (larger standard errors).", "B": "Incorrect. Bias from deletion arises when missingness is related to the variable (MAR or MNAR), not under MCAR.", "C": "Incorrect. Fewer observations increase the sampling variance of the estimate; they do not reduce it.", "D": "Incorrect. Deleting 15% of records loses information and reduces precision."}, "source": "Little & Rubin, Statistical Analysis with Missing Data; Eurostat Memobust Handbook on imputation"}, {"id": "B2-004", "block": 2, "topic": "Imputation", "difficulty": "medium", "question": "An analyst fills 40 missing values of a continuous variable (out of 200 records) with the mean of the 160 observed values. Which statement about the completed dataset is correct?", "options": {"A": "The mean of the completed variable is shifted towards zero by the imputed values.", "B": "The variance is overstated because the imputed values add random noise to the data.", "C": "Standard errors computed as if all 200 values were observed remain fully valid.", "D": "The mean is preserved, but the variance and correlations are understated."}, "answer": "D", "explanations": {"A": "Incorrect. Adding values equal to the mean leaves the mean unchanged.", "B": "Incorrect. Mean imputation adds values with zero deviation, which reduces the variance rather than adding noise.", "C": "Incorrect. Treating imputed values as real data overstates the sample size and makes standard errors too small.", "D": "Correct. Mean imputation preserves the mean but shrinks the spread and weakens relationships with other variables, a well-known drawback of the method."}, "source": "Little & Rubin, Statistical Analysis with Missing Data; Eurostat Memobust Handbook on imputation"}, {"id": "B2-005", "block": 2, "topic": "Imputation", "difficulty": "hard", "question": "A variable has 80 observed values with mean 50 and a sum of squared deviations from the mean of 7,900 (sample variance 100, using n − 1). The 20 missing values are imputed with the value 50. What is the sample variance (n − 1) of the completed 100 values?", "options": {"A": "100.0", "B": "79.8", "C": "79.0", "D": "125.0"}, "answer": "B", "explanations": {"A": "Incorrect. This is the variance of the observed values only; the imputed values change the denominator.", "B": "Correct. The imputed values add zero squared deviation, so the sum stays 7,900, and the denominator becomes 99: 7,900 / 99 ≈ 79.8.", "C": "Incorrect. This divides 7,900 by n = 100 instead of n − 1 = 99.", "D": "Incorrect. The variance cannot increase when values equal to the mean are added."}, "source": "Little & Rubin, Statistical Analysis with Missing Data; Eurostat Memobust Handbook on imputation"}, {"id": "B2-006", "block": 2, "topic": "Imputation", "difficulty": "easy", "question": "Which description best matches hot-deck imputation?", "options": {"A": "Replacing each missing value with the overall mean of the variable in the dataset.", "B": "Predicting the missing value from a fitted regression model, without adding a residual.", "C": "Copying the value of a similar responding record (donor) in the same dataset.", "D": "Using the value that the same unit reported in a previous round of the survey."}, "answer": "C", "explanations": {"A": "Incorrect. That is mean imputation.", "B": "Incorrect. That is deterministic regression imputation.", "C": "Correct. Hot-deck imputation takes the value from a donor record in the current dataset, usually chosen within imputation classes or by nearest-neighbour distance.", "D": "Incorrect. Using the unit's own earlier value is historical (or 'cold-deck'/carry-forward) imputation."}, "source": "Eurostat Memobust Handbook on Methodology of Modern Business Statistics (editing, imputation, outliers)"}, {"id": "B2-007", "block": 2, "topic": "Imputation", "difficulty": "medium", "question": "What is the main advantage of multiple imputation over single imputation?", "options": {"A": "Its variance estimates also reflect the extra uncertainty caused by imputing values.", "B": "It eliminates bias even when the data are missing not at random (MNAR).", "C": "It requires no explicit model for the missing values or their distribution.", "D": "It produces a single completed dataset that is easier to publish and document."}, "answer": "A", "explanations": {"A":
