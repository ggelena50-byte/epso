ng their tasks", "B": "The DPO is personally liable for any non-compliance of the institution and may be fined by the EDPS", "C": "The DPO is appointed by the EDPS", "D": "Appointing a DPO is optional for small agencies"}, "answer": "A", "explanations": {"A": "Correct. Article 44 guarantees the DPO's independence: they receive no instructions on their tasks and may not be dismissed or penalised for performing them.", "B": "Incorrect. The controller remains responsible for compliance. The DPO advises and monitors.", "C": "Incorrect. Each institution designates its own DPO and registers them with the EDPS.", "D": "Incorrect. Every Union institution and body must designate a DPO."}, "source": "Regulation (EU) 2018/1725, Articles 43 to 45"}, {"id": "B3-025", "block": 3, "topic": "Data protection: records", "difficulty": "hard", "question": "How does Regulation 2018/1725 treat the records of processing activities kept by EU institutions, compared with the GDPR?", "options": {"A": "Institutions keep their records in a central register that they must make publicly accessible", "B": "Records are kept only by the EDPS, not by the institutions", "C": "Records must be kept secret to protect data subjects", "D": "Records are optional for institutions with fewer than 250 staff, mirroring the GDPR exemption for small organisations"}, "answer": "A", "explanations": {"A": "Correct. Article 31(5) requires EU institutions to keep records in a central register and make it publicly accessible, which goes further than the GDPR.", "B": "Incorrect. Each controller (and processor) keeps its own records.", "C": "Incorrect. Records describe processing operations, not the personal data themselves, and the central register is public.", "D": "Incorrect. The GDPR has a limited exemption for small organisations. Regulation 2018/1725 contains no such exemption for EU institutions."}, "source": "Regulation (EU) 2018/1725, Article 31"}, {"id": "B3-026", "block": 3, "topic": "Data protection: data subject rights", "difficulty": "medium", "question": "A data subject submits an access request to an EU agency. Within what period must the agency normally provide the information under Regulation 2018/1725?", "options": {"A": "Within 72 hours", "B": "Within one month, extendable by two further months where necessary", "C": "Within six months", "D": "Within 15 working days, with no possibility of extension in any case"}, "answer": "B", "explanations": {"A": "Incorrect. 72 hours is the deadline for notifying a personal data breach to the EDPS, not for answering access requests.", "B": "Correct. Article 14(3) sets one month, extendable by two further months taking into account complexity and number of requests.", "C": "Incorrect. Six months is far beyond the maximum period allowed.", "D": "Incorrect. 15 working days is the deadline for initial replies under Regulation 1049/2001 on access to documents, a different regime."}, "source": "Regulation (EU) 2018/1725, Article 14(3)"}, {"id": "B3-027", "block": 3, "topic": "Data protection: applicable regime", "difficulty": "medium", "question": "A national statistical institute of a Member State processes census microdata, which it then transmits in aggregated form to Eurostat. Which data protection framework governs the national institute's processing?", "options": {"A": "The GDPR (Regulation (EU) 2016/679), together with national law", "B": "No framework, because census data are collected under a legal obligation", "C": "Regulation (EU) 2018/1725, because the data end up at Eurostat", "D": "Only Regulation (EC) No 223/2009, which replaces data protection rules for statistics"}, "answer": "A", "explanations": {"A": "Correct. National public authorities, including NSIs, are subject to the GDPR. Regulation 2018/1725 applies to Union institutions and bodies such as Eurostat.", "B": "Incorrect. A legal obligation is a lawful basis for processing. It does not remove the processing from data protection law.", "C": "Incorrect. The regime follows the controller. A national authority is not a Union institution, so 2018/1725 does not apply to it.", "D": "Incorrect. Regulation 223/2009 governs statistical confidentiality but does not replace data protection law."}, "source": "GDPR Article 2; Regulation (EU) 2018/1725, Article 2"}, {"id": "B3-028", "block": 3, "topic": "Data protection: principles", "difficulty": "easy", "question": "A survey team collects respondents' full date of birth, although the analysis only needs five-year age groups. Which data protection principle is most directly at stake?", "options": {"A": "Storage limitation", "B": "Data minimisation", "C": "Lawfulness", "D": "Accuracy"}, "answer": "B", "explanations": {"A": "Incorrect. Storage limitation concerns how long data are kept, not how much is collected.", "B": "Correct. Personal data must be adequate, relevant and limited to what is necessary. Collecting full dates of birth when age groups suffice goes against data minimisation.", "C": "Incorrect. The problem is not a missing legal basis but collecting more than necessary.", "D": "Incorrect. Accuracy requires data to be correct and up to date. The issue here is over-collection."}, "source": "GDPR Article 5(1)(c); Regulation (EU) 2018/1725, Article 4(1)(c)"}, {"id": "B3-029", "block": 3, "topic": "Data protection: accountability", "difficulty": "medium", "question": "During an audit, an EU agency is asked to show how it complies with data protection principles. Which principle requires the controller not only to comply but also to be able to demonstrate compliance?", "options": {"A": "Transparency", "B": "Integrity and confidentiality", "C": "Accountability", "D": "Purpose limitation"}, "answer": "C", "explanations": {"A": "Incorrect. Transparency concerns informing data subjects clearly about processing.", "B": "Incorrect. This principle requires appropriate security of personal data.", "C": "Correct. Under the accountability principle the controller is responsible for, and must be able to demonstrate, compliance with the other principles.", "D": "Incorrect. Purpose limitation restricts processing to specified, explicit and legitimate purposes."}, "source": "Regulation (EU) 2018/1725, Article 4(2); GDPR Article 5(2)"}, {"id": "B3-030", "block": 3, "topic": "Data protection: DPIA", "difficulty": "hard", "question": "An EU agency plans large-scale processing of health data of staff to build a predictive absence model. A data protection impact assessment (DPIA) shows a high risk that cannot be mitigated by reasonable measures. What must the agency do before starting?", "options": {"A": "Ask staff for consent, which removes the need for a DPIA", "B": "Consult the EDPS prior to processing", "C": "Start processing and notify the EDPS within 72 hours", "D": "Publish the DPIA and proceed if nobody objects within one month"}, "answer": "B", "explanations": {"A": "Incorrect. Consent does not remove DPIA obligations, and consent from staff is questionable given the power imbalance.", "B": "Correct. Article 40 of Regulation 2018/1725 requires prior consultation of the EDPS when a DPIA indicates high risk in the absence of mitigating measures.", "C": "Incorrect. The 72-hour rule concerns breaches. A high residual risk requires consultation before processing starts.", "D": "Incorrect. There is no tacit approval mechanism of this kind in the Regulation."}, "source": "Regulation (EU) 2018/1725, Articles 39 and 40"}, {"id": "B3-031", "block": 3, "topic": "Data protection: processors", "difficulty": "medium", "question": "Eurostat contracts a company to host a survey platform that collects personal data. What must the contract with this processor ensure, among other things?", "options": {"A": "That the processor becomes the controller for the data it hosts, since it decides on the technical means of hosting", "B": "That it processes the data only on the controller's documented instructions", "C": "That the processor may reuse the data for its own product development", "D": "That the processor is exempt from security obligations"}, "answer": "B", "explanations": {"A": "Incorrect. Hosting on behalf of Eurostat makes the company a processor. Eurostat, which decides purposes and means, remains controller.", "B": "Correct. Article 29 requires a contract binding the processor to act only on documented instructions, ensure confidentiality and apply appropriate security.", "C": "Incorrect. A processor using data for its own purposes would act beyond instructions and could be treated as a controller in breach.", "D": "Incorrect. Processors must implement appropriate technical and organisational security measures."}, "source": "Regulation (EU) 2018/1725, Article 29"}, {"id": "B3-032", "block": 3, "topic": "Data protection: special categories", "difficulty": "medium", "question": "Which of the following is a special category of personal data under Regulation 2018/1725 and the GDPR?", "options": {"A": "The IP address of a website visitor", "B": "A staff member's professional e-mail address", "C": "Data concerning a person's trade union membership", "D": "A person's salary grade"}, "answer": "C", "explanations": {"A": "Incorrect. An IP address can be personal data, but it is not a special category.", "B": "Incorrect. It is personal data, but not a special category.", "C": "Correct. Trade union membership is listed among special categories, together with racial or ethnic origin, political opinions, religious beliefs, genetic, biometric (for identification), health and sex life or sexual orientation data.", "D": "Incorrect. Salary information is personal and may be sensitive in practice, but it is not a legally defined special category."}, "source": "Regulation (EU) 2018/1725, Article 10; GDPR Article 9"}, {"id": "B3-033", "block": 3, "topic": "Data protection: by design", "difficulty": "hard", "question": "A team designs a new dashboard of staff mobility statistics. Which measure best reflects 'data protection by default'?", "options": {"A": "Showing only the aggregated data needed, with record access restricted, without any user action", "B": "Adding a privacy notice after the dashboard goes live", "C": "Encrypting the backups only", "D": "Giving all staff access to the record-level data by default, with an option for managers to restrict it later"}, "answer": "A", "explanations": {"A": "Correct. By default, only personal data necessary for each specific purpose should be processed, and data should not be made accessible to an indefinite number of people without intervention.", "B": "Incorrect. Notices serve transparency. They do not make the default settings privacy-friendly.", "C": "Incorrect. Encrypting backups is a useful security measure but does not address what data are processed and shown by default.", "D": "Incorrect. This is the opposite of protection by default: the most privacy-friendly setting should apply automatically."}, "source": "Regulation (EU) 2018/1725, Article 27; GDPR Article 25"}, {"id": "B3-034", "block": 3, "topic": "Regulation 223/2009: principles", "difficulty": "easy", "question": "Which list corresponds to the statistical principles set out in Article 2 of Regulation (EC) No 223/2009 on European statistics?", "options": {"A": "Professional independence, impartiality, objectivity, reliability, statistical confidentiality and cost effectiveness", "B": "Relevance, accuracy, timeliness, accessibility, comparability and coherence", "C": "Findability, accessibility, interoperability and reusability", "D": "Lawfulness, fairness, transparency, purpose limitation, minimisation and accuracy"}, "answer": "A", "explanations": {"A": "Correct. Article 2(1) lists these six statistical principles, which are further elaborated in the European Statistics Code of Practice.", "B": "Incorrect. These are the quality criteria in Article 12, not the statistical principles of Article 2.", "C": "Incorrect. These are the FAIR principles for data management.", "D": "Incorrect. These are data protection principles under the GDPR and Regulation 2018/1725."}, "source": "Regulation (EC) No 223/2009, Article 2"}, {"id": "B3-035", "block": 3, "topic": "Regulation 223/2009: quality criteria", "difficulty": "medium", "question": "A quality report states that a regional indicator is 'consistent with the national total and with related indicators published by the same authority'. Which quality criterion of Article 12 of Regulation 223/2009 does this address?", "options": {"A": "Timeliness", "B": "Coherence", "C": "Accessibility and clarity", "D": "Relevance"}, "answer": "B", "explanations": {"A": "Incorrect. Timeliness is the time between the event and the availability of the statistics.", "B": "Correct. Coherence refers to the adequacy of statistics to be reliably combined in different ways and for various uses, e.g. regional data adding up to national totals.", "C": "Incorrect. This criterion concerns how easily users can obtain and understand the statistics and metadata.", "D": "Incorrect. Relevance is the degree to which statistics meet users' needs."}, "source": "Regulation (EC) No 223/2009, Article 12(1)"}, {"id": "B3-036", "block": 3, "topic": "Regulation 223/2009: confidential data", "difficulty": "hard", "question": "Under Regulation 223/2009, when deciding whether data allow a statistical unit to be identified (and are therefore confidential), what must be taken into account?", "options": {"A": "Whether the respondent has explicitly asked for confidentiality", "B": "Only the means available to the statistical authority itself, including its internal registers and linkage tools", "C": "Only whether names and addresses are included", "D": "All relevant means that might reasonably be used by a third party to identify the statistical unit"}, "answer": "D", "explanations": {"A": "Incorrect. Protection applies automatically. It does not depend on a request from the respondent.", "B": "Incorrect. The test looks at third parties, not at what the authority could do.", "C": "Incorrect. Indirect identification, for example through a combination of characteristics, also makes data confidential.", "D": "Correct. Article 3(7) defines confidential data as data allowing direct or indirect identification, taking into account all relevant means that might reasonably be used by a third party."}, "source": "Regulation (EC) No 223/2009, Article 3(7)"}, {"id": "B3-037", "block": 3, "topic": "Regulation 223/2009: use of confidential data", "difficulty": "medium", "question": "A Commission directorate-general asks Eurostat for the confidential survey records of named enterprises to check their compliance with a subsidy programme. What is the correct response under Regulation 223/2009?", "options": {"A": "Refuse: such data may be used only for statistical purposes, unless the unit unambiguously consents", "B": "Accept, because both are Commission services and data can circulate freely between directorates-general of the same institution", "C": "Accept, if the request comes from a Director-General", "D": "Accept, after replacing enterprise names with their VAT numbers"}, "answer": "A", "explanations": {"A": "Correct. Article 20 restricts confidential data to statistical purposes. Compliance checks against individual enterprises are a non-statistical (administrative) use.", "B": "Incorrect. Being in the same institution does not lift statistical confidentiality. Use for administrative purposes is prohibited.", "C": "Incorrect. Seniority of the requester is irrelevant to the statistical purpose limitation.", "D": "Incorrect. VAT numbers still identify enterprises, and the purpose would still be non-statistical."}, "source": "Regulation (EC) No 223/2009, Articles 3 and 20"}, {"id": "B3-038", "block": 3, "topic": "Regulation 223/2009: researchers", "difficulty": "medium", "question": "Under Article 23 of Regulation 223/2009 and its implementing rules, what kind of confidential data may be made available to researchers for scientific purposes?", "options": {"A": "Only data already published in Eurostat's online database", "B": "Data allowing only indirect identification, under protective conditions", "C": "Any data, provided the researcher's university is in the EU", "D": "Directly identifiable records with names and addresses, if the research is in the public interest"}, "answer": "B", "explanations": {"A": "Incorrect. Published data are public. Article 23 concerns access to confidential microdata.", "B": "Correct. Access for scientific purposes is limited to data that only allow indirect identification, e.g. through secure use files or scientific use files for recognised research entities.", "C": "Incorrect. Access depends on recognition of the research entity, an approved proposal and protective conditions, not only on location.", "D": "Incorrect. Direct identifiers are not provided. Access is limited to data allowing only indirect identification."}, "source": "Regulation (EC) No 223/2009, Article 23; Commission Regulation (EU) No 557/2013"}, {"id": "B3-039", "block": 3, "topic": "Regulation 223/2009: ESS governance", "difficulty": "easy", "question": "What is the European Statistical System (ESS) according to Regulation 223/2009?", "options": {"A": "The network of central banks responsible for monetary statistics", "B": "A partnership of the Commission (Eurostat), the NSIs and other national authorities producing European statistics", "C": "A single EU agency that has replaced the national statistical institutes and collects all data directly from respondents", "D": "An IT platform for exchanging statistical files"}, "answer": "B", "explanations": {"A": "Incorrect. That is the European System of Central Banks (ESCB), which cooperates with the ESS but is distinct.", "B": "Correct. Article 4 defines the ESS as this partnership.", "C": "Incorrect. National statistical institutes remain separate national bodies. The ESS is a partnership, not a single agency.", "D": "Incorrect. The ESS is an institutional partnership, not a technical platform."}, "source": "Regulation (EC) No 223/2009, Article 4"}, {"id": "B3-040", "block": 3, "topic": "Regulation 223/2009: public sources", "difficulty": "hard", "question": "A business register entry shows a company's name, address and number of employees, taken from a source that is lawfully accessible to the public and remains so under national law. The NSI uses them to compile a statistic. Under Regulation 223/2009, as amended, are these data confidential?", "options": {"A": "Only if the data are older than ten years", "B": "Yes, unless the enterprise has more than 250 employees", "C": "No, publicly accessible data used for statistical purposes are not considered confidential", "D": "Yes, all data on individual enterprises are confidential, whatever their source or how they are later used"}, "answer": "C", "explanations": {"A": "Incorrect. The Regulation sets no age threshold for this rule.", "B": "Incorrect. Enterprise size does not determine whether publicly available data are confidential.", "C": "Correct. Article 25 states that such data shall not be considered confidential when used for statistical purposes or for disseminating statistics compiled from them.", "D": "Incorrect. Data from publicly available sources are expressly excluded from confidentiality."}, "source": "Regulation (EC) No 223/2009, Article 25 (as amended by Regulation (EU) 2024/3018)"}, {"id": "B3-041", "block": 3, "topic": "ESS Code of Practice", "difficulty": "medium", "question": "Which principle of the European Statistics Code of Practice states that the privacy of data providers, the confidentiality of the information they provide and its use only for statistical purposes are absolutely guaranteed?", "options": {"A": "Professional independence", "B": "Statistical confidentiality and data protection", "C": "Impartiality and objectivity", "D": "Non-excessive burden on respondents"}, "answer": "B", "explanations": {"A": "Incorrect. This principle protects statistical authorities from political and other external interference.", "B": "Correct. This principle (Principle 5) covers privacy, confidentiality and use exclusively for statistical purposes.", "C": "Incorrect. This principle concerns developing and disseminating statistics in a neutral, objective way, treating all users equally.", "D": "Incorrect. This principle concerns proportionate reporting burden."}, "source": "European Statistics Code of Practice (revised 2017), Principle 5"}, {"id": "B3-042", "block": 3, "topic": "Regulation 223/2009: transmission", "difficulty": "hard", "question": "A national statistical institute must send confidential microdata to Eurostat to compile a European statistic required by an EU regulation. Which statement is correct under Regulation 223/2009?", "options": {"A": "Transmission is prohibited because confidential data must never leave the NSI", "B": "It is allowed where necessary for producing European statistics, and the data remain protected", "C": "Transmission is allowed only after anonymising the data so they are no longer confidential", "D": "Transmission makes the data public, since Eurostat has a duty to publish all data it receives for European statistics"}, "answer": "B", "explanations": {"A": "Incorrect. The Regulation expressly allows transmission between ESS authorities for European statistics.", "B": "Correct. Article 21 allows transmission of confidential data between ESS authorities where necessary for European statistics, while confidentiality obligations continue to apply.", "C": "Incorrect. Confidential data may be transmitted within the ESS. Anonymisation is not a precondition, although data minimisation remains good practice.", "D": "Incorrect. Transmission does not change the confidential status. Eurostat must protect the data and publish only non-disclosive results."}, "source": "Regulation (EC) No 223/2009, Article 21"}, {"id": "B3-043", "block": 3, "topic": "ESS governance: independence", "difficulty": "medium", "question": "A minister asks the head of a national statistical institute to postpone the release of unfavourable inflation figures until after an election. Which principle of Regulation 223/2009 is most directly at stake?", "options": {"A": "Cost effectiveness", "B": "Statistical confidentiality", "C": "Reliability", "D": "Professional independence"}, "answer": "D", "explanations": {"A": "Incorrect. Cost effectiveness concerns the efficient use of resources.", "B": "Incorrect. No confidential individual data are at stake. The issue is political interference in release timing.", "C": "Incorrect. Reliability concerns faithfully measuring reality. The direct issue here is interference in dissemination.", "D": "Correct. Professional independence requires statistics to be developed, produced and disseminated independently, including the timing and content of releases, free from political pressure."}, "source": "Regulation (EC) No 223/2009, Article 2(1)(a) and Article 5a; ESS Code of Practice, Principle 1"}, {"id": "B3-044", "block": 3, "topic": "SDC: dominance and p% rules", "difficulty": "hard", "question": "A cell of turnover data has five contributors with values 500, 300, 100, 60 and 40 (total 1,000). The authority applies a (2, 75) dominance rule and a p% rule with p = 10. Which statement is correct?", "options": {"A": "The cell is sensitive under the (2, 75) rule but not under the p% rule", "B": "The cell is sensitive under both rules", "C": "The cell is not sensitive under either rule", "D": "The cell is sensitive under the p% rule but not under the (2, 75) rule"}, "answer": "A", "explanations": {"A": "Correct. The two largest contributors hold 800/1,000 = 80% > 75%, so the dominance rule flags it. Under the p% rule, the remainder after the two largest is 200, which is not below 10% of 500 = 50, so the p% rule does not flag it.", "B": "Incorrect. The p% rule requires T − x1 − x2 < (p/100)·x1, i.e. 200 < 50, which is false.", "C": "Incorrect. The two largest contributors account for 80% of the total, above the 75% threshold.", "D": "Incorrect. This reverses the results: 80% exceeds 75%, while 200 is not below 50."}, "source": "Hundepool et al., Statistical Disclosure Control (Wiley, 2012) / ESSnet Handbook on SDC, chapter on sensitivity rules"}, {"id": "B3-045", "block": 3, "topic": "SDC: p% rule", "difficulty": "hard", "question": "A cell has four contributors: 900, 60, 25 and 15 (total 1,000). The second-largest contributor knows the published total. Within what percentage can it estimate the largest contributor's value by subtracting its own value from the total?", "options": {"A": "About 40%, because the error is 40", "B": "It cannot estimate the value at all, since there are four contributors", "C": "About 4.4%, because 940 overestimates 900 by 40", "D": "About 6.7%, because 60 is 6.7% of 900"}, "answer": "C", "explanations": {"A": "Incorrect. 40 is the absolute error. As a percentage of 900 it is about 4.4%.", "B": "Incorrect. Having more than three contributors does not prevent a precise estimate when one contributor dominates.", "C": "Correct. 1,000 − 60 = 940. The error is 40, and 40/900 ≈ 4.4%. With p = 15 the cell would be sensitive, since 40 < 0.15 × 900 = 135.", "D": "Incorrect. The estimation error is the sum of the remaining contributors (25 + 15 = 40), not the value of the second contributor."}, "source": "ESSnet Handbook on Statistical Disclosure Control, p% rule"}, {"id": "B3-046", "block": 3, "topic": "SDC: secondary suppression", "difficulty": "hard", "question": "In a two-way frequency table where all row totals, column totals and the grand total are published, one interior cell is primary suppressed. What is the minimum number of additional interior cells that must be suppressed to protect it, assuming no cell value is known in advance?", "options": {"A": "Two, one in the same row and one in the same column as the primary cell, so both margins are covered", "B": "One, in the same row", "C": "None, if the cell count is above zero", "D": "Three, so that four suppressed cells form a rectangle across two rows and two columns"}, "answer": "D", "explanations": {"A": "Incorrect. The added cells would each be alone in their own column or row, so they could be recovered and then used to recover the primary cell.", "B": "Incorrect. The column of the primary cell would still contain a single suppressed cell, recoverable from the column total.", "C": "Incorrect. With margins published, a single suppressed cell is always recoverable by subtraction.", "D": "Correct. Each row and each column containing a suppressed cell must contain at least two suppressed cells, otherwise subtraction from the margin reveals the value. The minimal pattern is a 2×2 rectangle: one primary plus three complementary suppressions."}, "source": "ESSnet Handbook on Statistical Disclosure Control, tabular data protection"}, {"id": "B3-047", "block": 3, "topic": "SDC: threshold rule", "difficulty": "easy", "question": "An authority applies a minimum frequency (threshold) rule of 3 contributors for business tables. Why is a cell with only two enterprises considered sensitive?", "options": {"A": "Either enterprise can derive the other's exact value by subtracting its own value from the cell total", "B": "Because cells with fewer than 3 contributors are always statistically insignificant and must be suppressed for quality reasons", "C": "Because the total would be negative", "D": "Because two enterprises always belong to the same group"}, "answer": "A", "explanations": {"A": "Correct. With two contributors, each one knows its own value and can deduce the other's from the published total.", "B": "Incorrect. The rule is about disclosure risk, not statistical significance.", "C": "Incorrect. Totals of positive contributions cannot be negative. The risk is disclosure by subtraction.", "D": "Incorrect. The rule does not assume any ownership link."}, "source": "ESSnet Handbook on Statistical Disclosure Control, threshold rule"}, {"id": "B3-048", "block": 3, "topic": "SDC: k-anonymity and l-diversity", "difficulty": "hard", "question": "After generalising age into 10-year bands and region into NUTS 1, every combination of quasi-identifiers in a microdata file is shared by at least 4 records. In one group, however, all 4 records have the same rare disease. Which statement is correct?", "options": {"A": "The file is safe, because k-anonymity with k of at least 4 guarantees that no sensitive information about anyone can be disclosed", "B": "The file is 4-anonymous, but attribute disclosure is still possible; a measure such as l-diversity addresses this", "C": "The file is only 1-anonymous because the disease value is identical", "D": "The problem is solved by adding direct identifiers back to the file"}, "answer": "B", "explanations": {"A": "Incorrect. k-anonymity protects against identity disclosure but not against attribute disclosure in homogeneous groups.", "B": "Correct. k-anonymity prevents singling out a record but not learning a sensitive attribute when a group is homogeneous. l-diversity requires several distinct sensitive values in each group.", "C": "Incorrect. k is computed on quasi-identifiers, not on the sensitive variable, so k = 4.", "D": "Incorrect. Adding direct identifiers would dramatically increase disclosure risk."}, "source": "Sweeney (2002) k-anonymity; Machanavajjhala et al. (2007) l-diversity; ESSnet Handbook on SDC"}, {"id": "B3-049", "block": 3, "topic": "SDC: perturbation methods", "difficulty": "medium", "question": "Several NSIs used the cell key method to protect census tables. What is its main advantage?", "options": {"A": "Identical cells get identical noise in every table, keeping outputs consistent and limiting differencing", "B": "It removes all noise from totals and margins, so published tables are always exactly additive and unbiased", "C": "It only works for magnitude tables of business data", "D": "It replaces perturbation with cell suppression"}, "answer": "A", "explanations": {"A": "Correct. A record key is aggregated into a cell key that determines noise from a lookup table, so the same combination of records always gets the same noise.", "B": "Incorrect. Perturbing cells independently can break additivity. Consistency, not additivity, is the main advantage.", "C": "Incorrect. It was developed and widely used for frequency tables such as census counts.", "D": "Incorrect. The cell key method is a perturbative method. It does not rely on suppression."}, "source": "Eurostat / ESSnet, Harmonised protection of census data; ABS cell key methodology"}, {"id": "B3-050", "block": 3, "topic": "SDC: differencing", "difficulty": "medium", "question": "An office publishes the number of people with a rare benefit for a region (57) and, in another table, for the same region excluding its smallest municipality (56). What disclosure risk does this create?", "options": {"A": "A sampling error problem, not a disclosure problem", "B": "A risk only if names are published", "C": "A differencing attack: subtracting the tables reveals a count of 1 for the municipality", "D": "No risk, because each table separately satisfies the threshold rule"}, "answer": "C", "explanations": {"A": "Incorrect. The issue is disclosure by subtraction, not sampling variability.", "B": "Incorrect. A count of 1 in a small area may allow identification without any name being published.", "C": "Correct. Overlapping geographies or categories can be differenced to reveal small cells even if each table looks safe on its own.", "D": "Incorrect. Disclosure control must consider combinations of published tables, not each table in isolation."}, "source": "ESSnet Handbook on Statistical Disclosure Control, linked tables and differencing"}, {"id": "B3-051", "block": 3, "topic": "SDC: microdata methods", "difficulty": "medium", "question": "A public-use microdata file contains the variable 'annual income'. A few very high incomes make some respondents easy to identify. Which non-perturbative method is most suitable?", "options": {"A": "Top-coding: grouping all values above a threshold into a category such as '200,000 and over'", "B": "Adding the respondents' NUTS 3 region to the file", "C": "Record swapping between all respondents", "D": "Publishing the exact incomes but removing the respondents' names, addresses and identification numbers"}, "answer": "A", "explanations": {"A": "Correct. Top-coding is a form of global recoding that hides extreme values that make records stand out, without altering other values.", "B": "Incorrect. Adding detailed geography increases, rather than reduces, the risk.", "C": "Incorrect. Swapping is a perturbative method and would distort the full dataset to address a few outliers.", "D": "Incorrect. Removing direct identifiers is not enough when extreme values allow re-identification."}, "source": "ESSnet Handbook on SDC, microdata protection; sdcMicro documentation"}, {"id": "B3-052", "block": 3, "topic": "SDC: anonymisation", "difficulty": "medium", "question": "Which statement correctly distinguishes anonymisation from pseudonymisation?", "options": {"A": "Anonymisation encrypts data, while pseudonymisation deletes them", "B": "Anonymisation and pseudonymisation are synonyms in EU law", "C": "Anonymised data can no longer identify anyone by reasonably likely means; pseudonymised data can be re-attributed with separate information", "D": "Pseudonymised data become anonymous once the re-identification key is stored in a separate, access-controlled database managed by another team"}, "answer": "C", "explanations": {"A": "Incorrect. Neither definition corresponds to encryption or deletion.", "B": "Incorrect. EU law treats them differently. Only anonymous data fall outside its scope.", "C": "Correct. Anonymous data are outside data protection law. Pseudonymised data remain personal data.", "D": "Incorrect. As long as the key exists and can reasonably be used, the data remain personal."}, "source": "GDPR Recital 26; Article 29 Working Party Opinion 05/2014 on anonymisation techniques"}, {"id": "B3-053", "block": 3, "topic": "SDC: hashing", "difficulty": "hard", "question": "A team replaces personal identification numbers with their unsalted SHA-256 hash and calls the result 'anonymised'. Why is this assessment wrong?", "options": {"A": "Because all possible identifiers can be hashed and matched, so records can be re-identified", "B": "Because SHA-256 can be mathematically reversed with a publicly available algorithm in a few seconds", "C": "Because hashes are special category data", "D": "Because hashing always increases the file size beyond limits"}, "answer": "A", "explanations": {"A": "Correct. Unsalted hashes of structured identifiers are vulnerable to dictionary and brute-force attacks. At best this is weak pseudonymisation; a keyed hash with a secret key is stronger but still pseudonymisation.", "B": "Incorrect. SHA-256 is a one-way function. The risk comes from enumerating possible inputs, not from reversing the function.", "C": "Incorrect. Special categories depend on the content (e.g. health), not on the technique.", "D": "Incorrect. File size is irrelevant to the anonymisation assessment."}, "source": "Article 29 Working Party Opinion 05/2014; EDPS-AEPD, Introduction to the hash function as a personal data pseudonymisation technique (2019)"}, {"id": "B3-054", "block": 3, "topic": "SDC: differential privacy", "difficulty": "medium", "question": "In differential privacy, what is the effect of lowering the privacy-loss parameter epsilon (ε)?", "options": {"A": "No effect on accuracy, only on computation time", "B": "It removes the need to protect small cells", "C": "Stronger privacy protection, achieved by adding more noise, which reduces accuracy", "D": "Weaker privacy protection and more accurate results"}, "answer": "C", "explanations": {"A": "Incorrect. ε directly governs the amount of noise and therefore accuracy.", "B": "Incorrect. ε calibrates protection. It does not make small cells inherently safe.", "C": "Correct. A smaller ε bounds more tightly how much one person's data can change the output, which requires more noise.", "D": "Incorrect. That is the effect of increasing ε."}, "source": "Dwork & Roth (2014), The Algorithmic Foundations of Differential Privacy"}, {"id": "B3-055", "block": 3, "topic": "Cybersecurity: EU institutions", "difficulty": "hard", "question": "Under Regulation (EU, Euratom) 2023/2841 on a high common level of cybersecurity at Union entities, to whom must a Union entity submit an early warning of a significant incident, and within what time?", "options": {"A": "To the EDPS, within 24 hours", "B": "To ENISA, within 72 hours of the incident being detected by any staff member", "C": "To CERT-EU, within 24 hours of becoming aware of the significant incident", "D": "To the national CSIRT of the host Member State, within one week"}, "answer": "C", "explanations": {"A": "Incorrect. The EDPS receives personal data breach notifications under Regulation 2018/1725, which is a separate obligation.", "B": "Incorrect. ENISA is the EU Agency for Cybersecurity, but the Regulation channels incident reporting of Union entities to CERT-EU.", "C": "Correct. The Regulation sets a staged reporting duty to CERT-EU: early warning within 24 hours, incident notification within 72 hours and a final report within one month.", "D": "Incorrect. National CSIRTs handle reports under the NIS2 Directive. Union entities report to CERT-EU."}, "source": "Regulation (EU, Euratom) 2023/2841, Article 21 and Recital 35"}, {"id": "B3-056", "block": 3, "topic": "Cybersecurity: phishing", "difficulty": "easy", "question": "A colleague receives an e-mail that appears to come from the IT helpdesk, asking them to confirm their password via a link because their mailbox is 'about to be closed'. What is the most appropriate action?", "options": {"A": "Forward it to all colleagues as a warning", "B": "Click the link but enter a wrong password to test it", "C": "Reply to the sender asking whether the e-mail is genuine", "D": "Do not click the link, and report the e-mail through the institution's phishing reporting channel"}, "answer": "D", "explanations": {"A": "Incorrect. Forwarding spreads the malicious link. Use the official reporting channel instead.", "B": "Incorrect. Clicking may already trigger malware or tracking, and it confirms that the address is active.", "C": "Incorrect. Replying to the attacker gives them a channel and confirms that the address is monitored.", "D": "Correct. This is a classic phishing pattern (urgency, credential request). Reporting allows the security team to block it for others."}, "source": "CERT-EU and ENISA awareness guidance on phishing"}, {"id": "B3-057", "block": 3, "topic": "Cybersecurity: access control", "difficulty": "medium", "question": "A statistician needs to run quarterly quality checks on a confidential microdata table. Which access arrangement best follows the principle of least privilege?", "options": {"A": "Read access to that table only, for the period needed, granted through a role", "B": "Database administrator rights, so they can fix any problem they find", "C": "Write access to all tables in the schema, in case other checks are needed later in the year", "D": "A shared team account used by everybody in the unit"}, "answer": "A", "explanations": {"A": "Correct. Least privilege means giving only the minimum access needed to perform the task, ideally managed through roles and reviewed regularly.", "B": "Incorrect. Administrator rights greatly exceed what the task requires and increase risk.", "C": "Incorrect. Access 'just in case' violates least privilege.", "D": "Incorrect. Shared accounts prevent accountability and individual audit trails."}, "source": "ISO/IEC 27001:2022 Annex A (access control); NIST SP 800-53 AC-6"}, {"id": "B3-058", "block": 3, "topic": "Cybersecurity: CIA triad", "difficulty": "medium", "question": "An attacker modifies figures in a statistical table on a web server just before publication, without anyone noticing. Which security property has primarily been violated?", "options": {"A": "Non-repudiation", "B": "Availability", "C": "Integrity", "D": "Confidentiality"}, "answer": "C", "explanations": {"A": "Incorrect. Non-repudiation concerns proving that a party performed an action. The core violation is unauthorised modification.", "B": "Incorrect. Availability concerns timely access to systems and data, which was not disrupted.", "C": "Correct. Integrity means data are accurate and complete and protected against unauthorised modification.", "D": "Incorrect. Confidentiality concerns unauthorised disclosure. Here the data were altered, not disclosed."}, "source": "ISO/IEC 27000 vocabulary; ENISA glossary"}, {"id": "B3-059", "block": 3, "topic": "Cybersecurity: ransomware", "difficulty": "medium", "question": "Which measure best limits the impact of a ransomware attack that encrypts the shared drives of a statistics unit?", "options": {"A": "Renaming files with unusual extensions", "B": "Regular backups kept offline or immutable, with restoration tested periodically", "C": "Paying the ransom quickly to reduce downtime", "D": "A synchronised cloud folder that mirrors the shared drive in real time"}, "answer": "B", "explanations": {"A": "Incorrect. Ransomware encrypts files regardless of their names or extensions.", "B": "Correct. Offline or immutable backups cannot be encrypted by the attacker, and tested restores make recovery possible without paying.", "C": "Incorrect. Payment does not guarantee recovery, funds criminals and is discouraged by authorities.", "D": "Incorrect. Real-time synchronisation copies the encrypted files too, so it is not a backup."}, "source": "ENISA Threat Landscape; CERT-EU guidance on ransomware"}, {"id": "B3-060", "block": 3, "topic": "Cybersecurity: classified information", "difficulty": "medium", "question": "Which list shows EU classified information (EUCI) levels in ascending order of sensitivity?", "options": {"A": "CONFIDENTIEL UE/EU CONFIDENTIAL, RESTREINT UE/EU RESTRICTED, SECRET UE/EU SECRET, TRÈS SECRET UE/EU TOP SECRET", "B": "SENSITIVE, RESTREINT UE/EU RESTRICTED, CONFIDENTIEL UE/EU CONFIDENTIAL, SECRET UE/EU SECRET", "C": "PUBLIC, LIMITED, CONFIDENTIAL, SECRET", "D": "RESTREINT UE/EU RESTRICTED, CONFIDENTIEL UE/EU CONFIDENTIAL, SECRET UE/EU SECRET, TRÈS SECRET UE/EU TOP SECRET"}, "answer": "D", "explanations": {"A": "Incorrect. RESTREINT UE is the lowest level, below CONFIDENTIEL UE.", "B": "Incorrect. 'Sensitive' markings are for non-classified information and are not an EUCI level. TRÈS SECRET UE is missing.", "C": "Incorrect. These are generic labels, not the EUCI levels defined by the Commission's security rules.", "D": "Correct. These are the four EUCI levels, from lowest to highest."}, "source": "Commission Decision (EU, Euratom) 2015/444 on the security rules for protecting EU classified information, Article 3"}, {"id": "B4-001", "block": 4, "topic": "Descriptive statistics", "difficulty": "easy", "question": "A unit records the following processing times (in days) for seven files: 3, 4, 4, 5, 6, 7, 30. Which statement is correct?", "options": {"A": "The median is 4 and the mean is about 8.4.", "B": "The median is 5 and the mean is about 8.4.", "C": "The median is 5 and the mean is 5.0.", "D": "The median is 6 and the mean is about 8.4."}, "answer": "B", "explanations": {"A": "4 is the mode (it appears twice), not the median. The middle (4th) value of the sorted list is 5.", "B": "Sorted, the 4th of 7 values is 5, so the median is 5. The sum is 59 and 59/7 is about 8.43. The extreme value raises the mean but not the median.", "C": "The mean uses every value, including 30: 59/7 is about 8.43, not 5.", "D": "6 is the 5th value. With seven observations, the median is the 4th value, which is 5."}, "source": "OpenIntro Statistics (4th ed.), ch. 2 (Summarizing data)"}, {"id": "B4-002", "block": 4, "topic": "Descriptive statistics", "difficulty": "medium", "question": "Three offices processed 200, 300 and 500 files last month, with error rates of 2%, 4% and 1% respectively. What is the error rate for all 1,000 files combined?", "options": {"A": "2.1%", "B": "2.33%", "C": "7%", "D": "1.9%"}, "answer": "A", "explanations": {"A": "Errors are 0.02×200 + 0.04×300 + 0.01×500 = 4 + 12 + 5 = 21, and 21/1,000 is 2.1%. Rates must be weighted by the number of files.", "B": "This is the unweighted average (2 + 4 + 1)/3. It ignores that the office with the lowest rate handled half of all files.", "C": "This adds the three rates. Rates of different groups cannot simply be summed.", "D": "This does not match any correct weighting. The weighted total is 21 errors out of 1,000 files, or 2.1%."}, "source": "OpenIntro Statistics (4th ed.), ch. 2 (Summarizing data)"}, {"id": "B4-003", "block": 4, "topic": "Descriptive statistics", "difficulty": "medium", "question": "A sample contains the values 2, 4, 4, 4, 5, 5, 7, 9. What is the sample standard deviation (using n − 1 in the denominator), to two decimals?", "options": {"A": "2.14", "B": "2.00", "C": "4.57", "D": "1.51"}, "answer": "A", "explanations": {"A": "The mean is 5. The squared deviations sum to 9+1+1+1+0+0+4+16 = 32. The sample variance is 32/7 ≈ 4.571, and its square root is about 2.14.", "B": "This divides by n = 8 (32/8 = 4, root 2). That is the population standard deviation, not the sample one.", "C": "This is the sample variance (32/7). The standard deviation is its square root.", "D": "This does not follow from the data. The correct steps give √(32/7) ≈ 2.14."}, "source": "OpenIntro Statistics (4th ed.), ch. 2 (Summarizing data)"}, {"id": "B4-004", "block": 4, "topic": "Descriptive statistics", "difficulty": "medium", "question": "For a variable, the first quartile is 12 and the third quartile is 20. Using the 1.5 × IQR rule, which of the following values would be flagged as an outlier?", "options": {"A": "31", "B": "33", "C": "0.5", "D": "1"}, "answer": "B", "explanations": {"A": "31 is inside the upper fence of 32 and is not flagged.", "B": "IQR = 20 − 12 = 8, so the fences are 12 − 12 = 0 and 20 + 12 = 32. Only 33 lies outside [0, 32].", "C": "The lower fence is 12 − 1.5×8 = 0. A value of 0.5 is above it and is not flagged.", "D": "The lower fence is 0, so 1 lies inside the fences and is not flagged."}, "source": "OpenIntro Statistics (4th ed.), ch. 2 (Summarizing data)"}, {"id": "B4-005", "block": 4, "topic": "Descriptive statistics", "difficulty": "medium", "question": "Monthly allowances in a dataset have a mean of €3,000 and a standard deviation of €400. Every allowance is increased by 5% and then a flat €100 is added. What are the new mean and standard deviation?", "options": {"A": "Mean €3,250; standard deviation €520", "B": "Mean €3,250; standard deviation €400", "C": "Mean €3,150; standard deviation €420", "D": "Mean €3,250; standard deviation €420"}, "answer": "D", "explanations": {"A": "Adding a constant does not change the standard deviation. Only the 5% scaling affects it: 400 × 1.05 = 420.", "B": "The 5% increase multiplies every value, so it multiplies the standard deviation too, to 420.", "C": "The flat €100 is added to every value, so it also raises the mean, to 3,250.", "D": "Multiplying by 1.05 scales both the mean (3,150) and the standard deviation (420). Adding a constant shifts the mean to 3,250 but leaves the spread unchanged."}, "source": "OpenIntro Statistics (4th ed.), ch. 2 (Summarizing data)"}, {"id": "B4-006", "block": 4, "topic": "Descriptive statistics", "difficulty": "hard", "question": "An indicator rose by 10% in year 1, fell by 10% in year 2 and rose by 21% in year 3. What is the average annual growth rate over the three years, to one decimal?", "options": {"A": "7.0%", "B": "19.8%", "C": "6.2%", "D": "6.6%"}, "answer": "C", "explanations": {"A": "This is the arithmetic mean (10 − 10 + 21)/3. Growth compounds, so the geometric mean is the right measure.", "B": "This is the total growth over three years, not the average annual rate.", "C": "The overall factor is 1.10 × 0.90 × 1.21 = 1.1979. The geometric mean growth is 1.1979^(1/3) − 1 ≈ 0.062, or 6.2% per year.", "D": "This divides the total growth of 19.8% by 3, which ignores compounding."}, "source": "OpenIntro Statistics (4th ed.), ch. 2 (Summarizing data)"}, {"id": "B4-007", "block": 4, "topic": "Indices and rates of change", "difficulty": "easy", "question": "The unemployment rate in a region rose from 6.0% to 7.5%. Which description is correct?", "options": {"A": "It rose by 1.5%, which is the same as 1.5 percentage points.", "B": "It rose by 1.5 percentage points (25% in relative terms).", "C": "It rose by 25 percentage points, a relative increase of 25%.", "D": "It rose by 20% in relative terms (1.5 points out of 7.5)."}, "answer": "B", "explanations": {"A": "1.5 is the difference in percentage points. In relative terms the rate rose by 25%.", "B": "The absolute change is 7.5 − 6.0 = 1.5 percentage points. The relative change is 1.5/6.0 = 25%.", "C": "25% is the relative change. The difference between the two rates is 1.5 percentage points.", "D": "This divides the change by the new value (1.5/7.5). Relative change uses the starting value: 1.5/6.0 = 25%."}, "source": "EPSO/AST/158/26 Annex: data processing, analytics and statistics duties; OpenIntro Statistics (4th ed.), ch. 2"}, {"id": "B4-008", "block": 4, "topic": "Indices and rates of change", "difficulty": "medium", "question": "A programme budget grew from €80 million in 2019 to €100 million in 2024. What is the compound annual growth rate (CAGR) over these five years, to two decimals?", "options": {"A": "5.00%", "B": "25.00%", "C": "4.56%", "D": "4.17%"}, "answer": "C", "explanations": {"A": "This divides total growth (25%) by 5 years. It ignores compounding, so it overstates the annual rate.", "B": "This is the total growth over the whole period, not the annual rate.", "C": "CAGR = (100/80)^(1/5) − 1 = 1.25^0.2 − 1 ≈ 0.0456.", "D": "This divides 25% by 6, counting the years 2019 to 2024 inclusive. There are five yearly intervals, and growth compounds."}, "source": "EPSO/AST/158/26 Annex: data processing, analytics and statistics duties"}, {"id": "B4-009", "block": 4, "topic": "Indices and rates of change", "difficulty": "hard", "question": "A price index covers two goods. In the base period, good X cost €2 (quantity 10) and good Y cost €5 (quantity 4). In the current period, X costs €3 (quantity 8) and Y costs €5 (quantity 6). What is the Laspeyres price index (base = 100)?", "options": {"A": "117.4", "B": "135.0", "C": "150.0", "D": "125.0"}, "answer": "D", "explanations": {"A": "This is the Paasche index, which uses current quantities: (3×8 + 5×6)/(2×8 + 5×6) = 54/46 ≈ 117.4.", "B": "This is a value index: current spending (54) over base spending (40). It mixes price and quantity changes.", "C": "This is the price relative of good X only (3/2). Good Y's price did not change and must be included.", "D": "Laspeyres uses base-period quantities: (3×10 + 5×4)/(2×10 + 5×4) = 50/40 = 1.25, so 125.0."}, "source": "EPSO/AST/158/26 Annex: data processing, analytics and statistics duties"}, {"id": "B4-010", "block": 4, "topic": "Indices and rates of change", "difficulty": "medium", "question": "Nominal wages rose by 6% over a year while consumer prices rose by 4%. What was the growth in real wages, to one decimal?", "options": {"A": "2.0%", "B": "1.9%", "C": "10.2%", "D": "1.5%"}, "answer": "B", "explanations": {"A": "6% − 4% is the usual approximation. The exact deflated figure is 1.06/1.04 − 1 ≈ 1.9%.", "B": "Real growth = 1.06/1.04 − 1 ≈ 0.0192, or 1.9%. Subtracting 6 − 4 = 2 is only an approximation.", "C": "This compounds the two rates (1.06 × 1.04 − 1). Inflation must be removed, not added.", "D": "This divides 6% by 4%. Real growth is found by deflating: 1.06/1.04 − 1."}, "source": "EPSO/AST/158/26 Annex: data processing, analytics and statistics duties"}, {"id": "B4-011", "block": 4, "topic": "Indices and rates of change", "difficulty": "medium", "question": "An index equals 100 in 2022. It increases by 4% in 2023 and then decreases by 4% in 2024. What is its value in 2024?", "options": {"A": "99.84", "B": "100.00", "C": "100.16", "D": "96.00"}, "answer": "A", "explanations": {"A": "100 × 1.04 = 104 in 2023, then 104 × 0.96 = 99.84 in 2024. A rise and a fall of the same percentage do not cancel out.", "B": "The 4% fall is applied to the higher 2023 level of 104, so it removes 4.16 points, more than the 4 points gained.", "C": "The fall of 4% of 104 (4.16 points) is larger than the earlier gain of 4 points, so the index ends below 100.", "D": "This applies only the decrease to the 2022 level and ignores the 2023 increase."}, "source": "EPSO/AST/158/26 Annex: data processing, analytics and statistics duties"}, {"id": "B4-012", "block": 4, "topic": "Probability and distributions", "difficulty": "easy", "question": "Processing times are approximately normal with mean 20 minutes and standard deviation 3 minutes. Roughly what share of cases take between 14 and 26 minutes?", "options": {"A": "About 68%", "B": "About 99.7%", "C": "About 47.5%", "D": "About 95%"}, "answer": "D", "explanations": {"A": "68% is the share within ±1 SD, which here would be 17 to 23 minutes.", "B": "99.7% is the share within ±3 SD, which here would be 11 to 29 minutes.", "C": "47.5% is the share between the mean and +2 SD only, one side of the distribution.", "D": "14 and 26 are 2 standard deviations either side of the mean. By the empirical rule about 95% of a normal distribution lies within ±2 SD."}, "source": "OpenIntro Statistics (4th ed.), ch. 4 (Distributions of random variables)"}, {"id": "B4-013", "block": 4, "topic": "Probability and distributions", "difficulty": "medium", "question": "Processing times are normal with mean 20 minutes and standard deviation 3 minutes. Given that Φ(1.5) = 0.9332, what proportion of cases take longer than 24.5 minutes?", "options": {"A": "About 13.4%", "B": "About 93.3%", "C": "About 6.7%", "D": "About 4.5%"}, "answer": "C", "explanations": {"A": "This doubles the tail area. Only cases above 24.5 are asked for, which is one tail.", "B": "0.9332 is the proportion below 24.5, not above it.", "C": "z = (24.5 − 20)/3 = 1.5. The upper-tail area is 1 − 0.9332 = 0.0668.", "D": "This does not follow from z = 1.5. The upper tail is 1 − 0.9332 ≈ 6.7%."}, "source": "OpenIntro Statistics (4th ed.), ch. 4 (Distributions of random variables)"}, {"id": "B4-014", "block": 4, "topic": "Probability and distributions", "difficulty": "hard", "question": "Independently of each other, 10% of submitted forms contain an error. Five forms are drawn at random. What is the probability that exactly one of them contains an error?", "options": {"A": "About 0.066", "B": "About 0.410", "C": "About 0.328", "D": "0.100"}, "answer": "C", "explanations": {"A": "0.1 × 0.9^4 is the probability of one specific ordering. There are 5 positions the faulty form can take.", "B": "1 − 0.9^5 ≈ 0.410 is the probability of at least one error, not exactly one.", "C": "Binomial: C(5,1) × 0.1 × 0.9^4 = 5 × 0.1 × 0.6561 = 0.328.", "D": "0.1 is the probability for a single form, not for exactly one of five."}, "source": "OpenIntro Statistics (4th ed.), ch. 4 (Binomial distribution)"}, {"id": "B4-015", "block": 4, "topic": "Probability and distributions", "difficulty": "medium", "question": "Calls to a help desk arrive as a Poisson process with an average of 3 calls per hour. What is the probability of receiving no calls in a given hour?", "options": {"A": "0%", "B": "About 33%", "C": "About 22.4%", "D": "About 5.0%"}, "answer": "D", "explanations": {"A": "A Poisson count can always be zero. Its probability is small but positive.", "B": "This treats the hour as one of three equally likely outcomes. The Poisson formula gives e^(−3) ≈ 5%.", "C": "0.224 is P(X = 3), the most likely count, not P(X = 0).", "D": "For a Poisson variable, P(X = 0) = e^(−λ) = e^(−3) ≈ 0.0498."}, "source": "OpenIntro Statistics (4th ed.), ch. 4 (Poisson distribution)"}, {"id": "B4-016", "block": 4, "topic": "Probability and distributions", "difficulty": "medium", "question": "Events A and B are independent, with P(A) = 0.3 and P(B) = 0.5. What is P(A or B)?", "options": {"A": "0.65", "B": "0.80", "C": "0.15", "D": "0.35"}, "answer": "A", "explanations": {"A": "P(A ∪ B) = P(A) + P(B) − P(A)P(B) = 0.3 + 0.5 − 0.15 = 0.65.", "B": "This adds the probabilities without subtracting the overlap, which is only valid for mutually exclusive events.", "C": "0.15 is P(A and B) for independent events, not P(A or B).", "D": "This is 0.5 − 0.15, which is P(B and not A)."}, "source": "OpenIntro Statistics (4th ed.), ch. 3 (Probability)"}, {"id": "B4-017", "block": 4, "topic": "Probability and distributions", "difficulty": "medium", "question": "Of 200 applications, 120 were submitted online and 80 on paper. 18 online and 22 paper applications were rejected. If a rejected application is picked at random, what is the probability it was submitted on paper?", "options": {"A": "27.5%", "B": "11%", "C": "40%", "D": "55%"}, "answer": "D", "explanations": {"A": "22/80 is P(rejected | paper), the reverse conditional probability.", "B": "22/200 is the joint probability P(paper and rejected).", "C": "80/200 is the overall share of paper applications, ignoring the condition that the application was rejected.", "D": "40 applications were rejected, 22 of them on paper: 22/40 = 0.55."}, "source": "OpenIntro Statistics (4th ed.), ch. 3 (Conditional probability)"}, {"id": "B4-018", "block": 4, "topic": "Statistical inference", "difficulty": "medium", "question": "A survey with 400 respondents has a 95% margin of error of ±4 percentage points. Approximately how many respondents would be needed to reduce the margin of error to ±2 points, other things equal?", "options": {"A": "800", "B": "200", "C": "3,200", "D": "1,600"}, "answer": "D", "explanations": {"A": "Doubling n reduces the margin of error only by a factor of √2, to about ±2.8 points.", "B": "A smaller sample increases the margin of error.", "C": "Multiplying n by 8 would reduce the margin by a factor of about 2.8, more than needed.", "D": "The margin of error is proportional to 1/√n. Halving it needs √n to double, so n must be multiplied by 4: 400 × 4 = 1,600."}, "source": "OpenIntro Statistics (4th ed.), ch. 5 (Foundations for inference)"}, {"id": "B4-019", "block": 4, "topic": "Statistical inference", "difficulty": "hard", "question": "In a random sample of 400 businesses, 30% report using cloud services. Using z = 1.96, what is the approximate 95% confidence interval for the population proportion?", "options": {"A": "27.7% to 32.3%", "B": "21.0% to 39.0%", "C": "29.9% to 30.1%", "D": "25.5% to 34.5%"}, "answer": "D", "explanations": {"A": "This uses ±1 standard error (±2.3 points), which corresponds to about 68% confidence, not 95%.", "B": "This margin (±9 points) would correspond to a sample of about 100, not 400.", "C": "This interval is far too narrow. It does not correspond to the standard error of a proportion with n = 400.", "D": "SE = √(0.3 × 0.7 / 400) ≈ 0.0229. The margin is 1.96 × 0.0229 ≈ 0.045, giving 0.30 ± 0.045."}, "source": "OpenIntro Statistics (4th ed.), ch. 6 (Inference for categorical data)"}, {"id": "B4-020", "block": 4, "topic": "Statistical inference", "difficulty": "medium", "question": "A test of H0: 'the new form does not change completion time' gives p = 0.03. Which interpretation is correct?", "options": {"A": "There is a 3% probability that the null hypothesis is true, given the data observed.", "B": "If H0 were true, data at least this extreme would occur about 3% of the time.", "C": "There is a 97% probability that the new form changes completion time.", "D": "The effect is large enough to be of practical importance for the form redesign."}, "answer": "B", "explanations": {"A": "A p-value is not the probability that the hypothesis is true. It assumes H0 and describes the data.", "B": "This is the definition of a p-value: a probability computed assuming H0 is true.", "C": "1 − p is not the probability of the alternative hypothesis.", "D": "A small p-value says nothing on its own about effect size. Large samples can make tiny effects significant."}, "source": "OpenIntro Statistics (4th ed.), ch. 5 (Hypothesis testing)"}, {"id": "B4-021", "block": 4, "topic": "Statistical inference", "difficulty": "medium", "question": "An analyst lowers the significance level of a test from 0.05 to 0.01, keeping the sample size and design unchanged. What is the effect?", "options": {"A": "Type I error risk falls; Type II error risk rises.", "B": "Both the Type I and the Type II error risks fall together.", "C": "The power of the test increases, because the threshold is stricter.", "D": "The p-value of the data falls from 0.05 to 0.01."}, "answer": "A", "explanations": {"A": "A stricter threshold makes false positives rarer, but the test needs stronger evidence to reject, so real effects are missed more often.", "B": "With a fixed sample, the two error risks move in opposite directions. Reducing both requires more data.", "C": "Power is 1 − P(Type II error). Making rejection harder reduces power.", "D": "The p-value depends on the data, not on the chosen significance level."}, "source": "OpenIntro Statistics (4th ed.), ch. 5 (Decision errors)"}, {"id": "B4-022", "block": 4, "topic": "Statistical inference", "difficulty": "hard", "question": "An analyst runs 20 independent tests at α = 0.05. In fact, the null hypothesis is true in all 20. What is the approximate probability of at least one false positive?", "options": {"A": "5%", "B": "About 36%", "C": "100%", "D": "About 64%"}, "answer": "D", "explanations": {"A": "5% is the error rate of each single test, not of the whole family of 20 tests.", "B": "0.95^20 ≈ 0.358 is the probability of no false positives.", "C": "On average, 1 of the 20 tests is expected to be a false positive, but it is still possible (36%) to get none.", "D": "P(no false positive) = 0.95^20 ≈ 0.358, so P(at least one) ≈ 0.642. This is why corrections such as Bonferroni (α/20) are used."}, "source": "OpenIntro Statistics (4th ed.), ch. 5 (Multiple comparisons)"}, {"id": "B4-023", "block": 4, "topic": "Statistical inference", "difficulty": "medium", "question": "A sample of n = 25 has mean 52 and standard deviation 10. You test H0: μ = 50 against a two-sided alternative at α = 0.05 (critical t ≈ 2.06 with 24 df). What is the test statistic and conclusion?", "options": {"A": "t = 1.0; do not reject H0", "B": "t = 5.0; reject H0", "C": "t = 0.2; do not reject H0", "D": "t = 1.0; reject H0"}, "answer": "A", "explanations": {"A": "SE = 10/√25 = 2, so t = (52 − 50)/2 = 1.0. Since |1.0| < 2.06, H0 is not rejected.", "B": "This divides the difference by s/n = 10/25 = 0.4 instead of s/√n.", "C": "This divides the difference by s (10), not by the standard error (2).", "D": "The statistic is correct, but 1.0 is below the critical value of 2.06, so H0 cannot be rejected."}, "source": "OpenIntro Statistics (4th ed.), ch. 7 (Inference for numerical data)"}, {"id": "B4-024", "block": 4, "topic": "Statistical inference", "difficulty": "hard", "question": "A two-sided test gives p = 0.08, and the observed effect is in the direction the analyst had expected. What is the corresponding one-sided p-value, and when may it be used?", "options": {"A": "0.04, but only if the one-sided alternative was specified before looking at the data.", "B": "0.04, and it may always be reported because the effect went in the expected direction.", "C": "0.16, because a one-sided test is more conservative.", "D": "0.08, because the p-value does not depend on the alternative hypothesis."}, "answer": "A", "explanations": {"A": "For symmetric test statistics, the one-sided p-value in the observed direction is half the two-sided one. Switching after seeing the data inflates the Type I error rate.", "B": "Choosing the direction after seeing the results is a form of p-hacking. The choice must be made in advance.", "C": "A one-sided test in the observed direction has a smaller p-value, not a larger one.", "D": "The p-value depends on which outcomes count as 'at least as extreme', which the alternative determines."}, "source": "OpenIntro Statistics (4th ed.), ch. 5 (Hypothesis testing)"}, {"id": "B4-025", "block": 4, "topic": "Statistical inference", "difficulty": "medium", "question": "A test of independence is run on a contingency table with 3 rows and 4 columns. How many degrees of freedom does the chi-square statistic have?", "options": {"A": "12", "B": "7", "C": "11", "D": "6"}, "answer": "D", "explanations": {"A": "12 is the number of cells, not the degrees of freedom.", "B": "This adds (3 − 1) + (4 − 1) + 2. The rule multiplies (r − 1) by (c − 1).", "C": "11 is the number of cells minus one, which applies to a goodness-of-fit test with 12 categories, not a test of independence.", "D": "df = (rows − 1) × (columns − 1) = 2 × 3 = 6."}, "source": "OpenIntro Statistics (4th ed.), ch. 6 (Chi-square test)"}, {"id": "B4-026", "block": 4, "topic": "Statistical inference", "difficulty": "medium", "question": "Using administrative data on 200,000 staff, an analyst finds that average satisfaction differs between two groups by 0.1 points on a 0–100 scale, with p < 0.001. What is the best conclusion?", "options": {"A": "The difference is large because the p-value is very small.", "B": "The result must be a Type I error because the difference is so small.", "C": "It is statistically significant but probably too small to matter.", "D": "The test is invalid because the sample is too large for a significance test."}, "answer": "C", "explanations": {"A": "The p-value measures evidence against H0, not the size of the effect.", "B": "A small difference can be real. With n = 200,000 the standard error is very small.", "C": "With a very large sample, tiny differences become significant. Practical importance must be judged from the size of the effect.", "D": "Large samples do not invalidate tests. They increase power, which is why effect size must also be reported."}, "source": "OpenIntro Statistics (4th ed.), ch. 5 (Statistical vs practical significance)"}, {"id": "B4-027", "block": 4, "topic": "Correlation and regression", "difficulty": "hard", "question": "For two variables, the mean of x is 20, the mean of y is 50, SD(x) = 4, SD(y) = 10 and the correlation is r = 0.6. Using the least-squares line of y on x, what is the predicted y when x = 25?", "options": {"A": "51.2", "B": "57.5", "C": "62.5", "D": "37.5"}, "answer": "B", "explanations": {"A": "This uses slope r × SD(x)/SD(y) = 0.24, which inverts the ratio of standard deviations.", "B": "Slope = r × SD(y)/SD(x) = 0.6 × 10/4 = 1.5. Intercept = 50 − 1.5 × 20 = 20. Prediction: 20 + 1.5 × 25 = 57.5.", "C": "This uses slope SD(y)/SD(x) = 2.5 and ignores r. Without perfect correlation, predictions regress towards the mean.", "D": "This is 1.5 × 25 without the intercept of 20."}, "source": "OpenIntro Statistics (4th ed.), ch. 8 (Introduction to linear regression)"}, {"id": "B4-028", "block": 4, "topic": "Correlation and regression", "difficulty": "easy", "question": "In a simple linear regression, the correlation between x and y is r = −0.8. Which statement is correct?", "options": {"A": "R² = 0.64 and the slope is negative.", "B": "R² = −0.64, because the relationship between x and y is negative.", "C": "R² = 0.80, so the model explains 80% of the variance in y.", "D": "80% of the observations lie exactly on the regression line."}, "answer": "A", "explanations": {"A": "In simple regression R² = r² = 0.64, and the slope has the same sign as r.", "B": "R² is a square and cannot be negative. The sign appears in r and in the slope.", "C": "|r| = 0.8, but the share of variance explained is r² = 0.64.", "D": "Correlation measures the strength of linear association, not the share of points on the line."}, "source": "OpenIntro Statistics (4th ed.), ch. 8 (Introduction to linear regression)"}, {"id": "B4-029", "block": 4, "topic": "Correlation and regression", "difficulty": "hard", "question": "A model estimates ln(salary) = 7.9 + 0.05 × years_of_experience. How should the coefficient 0.05 be interpreted?", "options": {"A": "Each additional year of experience increases salary by €0.05.", "B": "Each 1% increase in experience is associated with a 0.05% increase in salary.", "C": "Each extra year is associated with a salary about 5% higher.", "D": "Salary increases by 0.05 percentage points for every additional year of experience."}, "answer": "C", "explanations": {"A": "The dependent variable is the log of salary, so the coefficient is a relative change, not an amount in euros.", "B": "That would be the interpretation of a log-log model (an elasticity). Here x is not in logs.", "C": "In a log-linear model, a coefficient b means a change of about 100 × b % in y per unit of x (exactly e^0.05 − 1 ≈ 5.1%).", "D": "The coefficient gives a percentage change in salary, not a change in percentage points."}, "source": "OpenIntro Statistics (4th ed.), ch. 8 (Transformations)"}, {"id": "B4-030", "block": 4, "topic": "Correlation and regression", "difficulty": "medium", "question": "A model for the monthly cost of an office is: cost = 120 + 3.5 × distance_km + 25 × urban, where urban = 1 for urban offices and 0 otherwise. What is the predicted cost of an urban office 10 km away?", "options": {"A": "155", "B": "180", "C": "145", "D": "205"}, "answer": "B", "explanations": {"A": "This leaves out the urban effect of 25.", "B": "120 + 3.5 × 10 + 25 × 1 = 120 + 35 + 25 = 180.", "C": "This adds the urban effect (25) but drops the distance term (35).", "D": "This counts the urban effect twice."}, "source": "OpenIntro Statistics (4th ed.), ch. 9 (Multiple regression)"}, {"id": "B4-031", "block": 4, "topic": "Correlation and regression", "difficulty": "medium", "question": "For x = −2, −1, 0, 1, 2, the values of y are exactly x²: 4, 1, 0, 1, 4. What is the Pearson correlation between x and y, and what does it show?", "options": {"A": "r = 1, because y is fully determined by x through a formula.", "B": "r = 0, which proves that x and y are statistically unrelated.", "C": "r = 0, although y depends fully on x.", "D": "r = −1, because y first falls and then rises as x increases."}, "answer": "C", "explanations": {"A": "Pearson's r equals ±1 only for an exact straight-line relationship.", "B": "Zero correlation rules out only a linear relationship, not every kind of dependence.", "C": "The positive and negative x values offset each other, so the covariance is zero even though y is fully determined by x.", "D": "The decrease and increase are symmetric and cancel out. r is 0, not −1."}, "source": "OpenIntro Statistics (4th ed.), ch. 8 (Correlation)"}, {"id": "B4-032", "block": 4, "topic": "Correlation and regression", "difficulty": "medium", "question": "For x = 1, 2, 3, 4, 5, the values of y are 1, 4, 9, 16, 100. Which statement about the correlation coefficients is correct?", "options": {"A": "Both coefficients equal 1.", "B": "Pearson's r equals 1 and Spearman's is below 1.", "C": "Spearman's rho equals 1; Pearson's r is below 1.", "D": "Both coefficients are below 0.5 because of the outlying value of 100."}, "answer": "C", "explanations": {"A": "Pearson's r equals 1 only if the points lie on a straight line, which they do not.", "B": "It is the other way round: the ranks agree perfectly, but the values are not linear.", "C": "y increases strictly with x, so the ranks agree perfectly (Spearman = 1). The relationship is not linear and has an extreme value, so Pearson's r is lower (about 0.80).", "D": "Ranks are not affected by the size of the value 100, so Spearman stays at 1."}, "source": "OpenIntro Statistics (4th ed.), ch. 8 (Correlation)"}, {"id": "B4-033", "block": 4, "topic": "SQL", "difficulty": "medium", "question": "Table payments(dept, amount) contains: ('A',100), ('A',300), ('B',50), ('B',60), ('B',70), ('C',500).\n\nSELECT dept, SUM(amount) AS total\nFROM payments\nWHERE amount > 55\nGROUP BY dept\nHAVING COUNT(*) >= 2;\n\nWhat does the query return?", "options": {"A": "A 400; B 180", "B": "A 400", "C": "A 400; B 130; C 500", "D": "A 400; B 130"}, "answer": "D", "explanations": {"A": "This includes ('B',50). WHERE filters rows before GROUP BY, so that row is not counted.", "B": "After WHERE, B still has two rows (60 and 70), so it passes HAVING COUNT(*) >= 2.", "C": "C has only one row, so HAVING COUNT(*) >= 2 removes it.", "D": "WHERE removes the row ('B',50) before grouping. A keeps 2 rows (400) and B keeps 2 rows (130). C has 1 row and is removed by HAVING."}, "source": "EPSO/AST/158/26 Annex: data processing, analytics and statistics duties; SQL aggregation"}, {"id": "B4-034", "block": 4, "topic": "SQL", "difficulty": "hard", "question": "orders.customer_id contains the values 1, 1, 2, 3, NULL. Because of a data-entry error, customers.id contains 1, 2, 2, 4. How many rows does the following return?\n\nSELECT *\nFROM orders o\nINNER JOIN customers c ON o.customer_id = c.id;", "options": {"A": "4", "B": "3", "C": "5", "D": "6"}, "answer": "A", "explanations": {"A": "Each of the two orders for customer 1 matches one row (2 rows). The order for customer 2 matches the two duplicate rows (2 rows). Customer 3 and NULL find no match. 2 + 2 = 4.", "B": "This assumes each order matches at most once. The duplicated id 2 doubles the matching order.", "C": "INNER JOIN drops orders with no match. Customer 3 and NULL do not match any row.", "D": "NULL never equals anything in a join condition, and customer 3 has no match, so they add no rows."}, "source": "EPSO/AST/158/26 Annex: data processing, analytics and statistics duties; SQL joins"}, {"id": "B4-035", "block": 4, "topic": "SQL", "difficulty": "medium", "question": "customers.id contains 1, 2, 3, 4. orders.customer_id contains 1, 1, 3, NULL. What does this query return?\n\nSELECT c.id\nFROM customers c\nLEFT JOIN orders o ON c.id = o.customer_id\nWHERE o.customer_id IS NULL;", "options": {"A": "2 and 4", "B": "4 only", "C": "2, 4 and NULL", "D": "2 only"}, "answer": "A", "explanations": {"A": "The LEFT JOIN keeps all customers. Customers 2 and 4 have no matching order, so their order columns are NULL and they pass the filter.", "B": "Customer 2 also has no order. Both 2 and 4 get NULL order columns.", "C": "The selected column is c.id. The order with a NULL customer_id is not part of the customers table and never appears.", "D": "Customer 4 has no matching order either, so it is also returned."}, "source": "EPSO/AST/158/26 Annex: data processing, analytics and statistics duties; SQL joins"}, {"id": "B4-036", "block": 4, "topic": "SQL", "difficulty": "medium", "question": "Column status in table cases contains: 'open', 'closed', NULL, 'open'. What does this return?\n\nSELECT COUNT(*) FROM cases WHERE status <> 'closed';", "options": {"A": "3", "B": "2", "C": "4", "D": "1"}, "answer": "B", "explanations": {"A": "This counts the NULL row. In SQL, comparisons with NULL are UNKNOWN and fail the WHERE condition. You need OR status IS NULL to keep it.", "B": "NULL <> 'closed' evaluates to UNKNOWN, not TRUE, so the NULL row is filtered out. Only the two 'open' rows are counted.", "C": "This counts every row and ignores the WHERE clause.", "D": "Both 'open' rows are counted, not just one."}, "source": "EPSO/AST/158/26 Annex: data processing, analytics and statistics duties; SQL NULL handling"}, {"id": "B4-037", "block": 4, "topic": "SQL", "difficulty": "hard", "question": "Table sales(region, rep, amount) contains: ('N','a',500), ('N','b',700), ('N','c',700), ('S','d',300), ('S','e',400).\n\nSELECT region, rep FROM (\n  SELECT region, rep,\n         RANK() OVER (PARTITION BY region ORDER BY amount DESC) AS r\n  FROM sales\n) t\nWHERE r = 1;\n\nWhich rows are returned?", "options": {"A": "N-b and S-e", "B": "N-b only", "C": "N-b and N-c", "D": "N-b, N-c and S-e"}, "answer": "D", "explanations": {"A": "That would be the result of ROW_NUMBER(), which breaks ties. RANK() gives tied rows the same rank.", "B": "PARTITION BY region ranks each region separately, so S also has a rank-1 row.", "C": "Without the partition, only the 700 rows would rank first. With PARTITION BY region, S-e is also rank 1.", "D": "Ranks restart in each region. In N, b and c tie on 700 and both get rank 1. In S, e (400) gets rank 1."}, "source": "EPSO/AST/158/26 Annex: data processing, analytics and statistics duties; SQL window functions"}, {"id": "B4-038", "block": 4, "topic": "SQL", "difficulty": "medium", "question": "Table t(day, amount) contains: (1,10), (2,20), (3,NULL), (4,5).\n\nSELECT day,\n       SUM(amount) OVER (ORDER BY day\n         ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running\nFROM t;\n\nWhat is the value of running for day 4?", "options": {"A": "NULL", "B": "5", "C": "35", "D": "30"}, "answer": "C", "explanations": {"A": "Aggregate functions such as SUM skip NULLs. The total becomes NULL only if every value in the window is NULL.", "B": "That would be the value of amount on day 4 alone, not the cumulative total.", "C": "The running totals are 10, 30, 30, 35. SUM ignores the NULL on day 3, so the total stays at 30 and then adds 5.", "D": "30 is the running total for days 2 and 3. Day 4 adds 5."}, "source": "EPSO/AST/158/26 Annex: data processing, analytics and statistics duties; SQL window functions"}, {"id": "B4-039", "block": 4, "topic": "SQL", "difficulty": "medium", "question": "Table monthly(m, v) contains: (1,100), (2,120), (3,90).\n\nSELECT m, v - LAG(v) OVER (ORDER BY m) AS diff FROM monthly ORDER BY m;\n\nWhat are the values of diff, in order?", "options": {"A": "0, 20, −30", "B": "20, −30, NULL", "C": "NULL, 20, −30", "D": "100, 20, −30"}, "answer": "C", "explanations": {"A": "LAG returns NULL, not 0, when there is no previous row, and any arithmetic with NULL gives NULL.", "B": "This looks forward (LEAD) instead of backward.", "C": "LAG(v) returns NULL for the first row (no previous row), so diff is NULL. Then 120 − 100 = 20 and 90 − 120 = −30.", "D": "100 − NULL is NULL, not 100."}, "source": "EPSO/AST/158/26 Annex: data processing, analytics and statistics duties; SQL window functions"}, {"id": "B4-040", "block": 4, "topic": "SQL", "difficulty": "hard", "question": "Column amount in table t contains 50, 100, 150 and NULL.\n\nSELECT SUM(CASE WHEN amount >= 100 THEN 1 ELSE 0 END) AS n_big,\n       AVG(CASE WHEN amount >= 100 THEN amount END) AS avg_big\nFROM t;\n\nWhat does the query return?", "options": {"A": "n_big = 2, avg_big = 62.5", "B": "n_big = 3, avg_big = 100", "C": "n_big = 2, avg_big = 83.3", "D": "n_big = 2, avg_big = 125"}, "answer": "D", "explanations": {"A": "This divides 250 by all 4 rows. AVG skips the NULLs produced by the CASE without ELSE.", "B": "NULL >= 100 is UNKNOWN, so the NULL row goes to ELSE 0 and is not counted.", "C": "This divides 250 by 3. Only the two non-NULL values from the CASE are averaged.", "D": "For 50 and NULL the first CASE gives 0, so n_big = 2. The second CASE has no ELSE, so it returns NULL for those rows, and AVG ignores them: (100 + 150)/2 = 125."}, "source": "EPSO/AST/158/26 Annex: data processing, analytics and statistics duties; SQL conditional aggregation"}, {"id": "B4-041", "block": 4, "topic": "SQL", "difficulty": "medium", "question": "In standard SQL (for example PostgreSQL), what happens when this query is run?\n\nSELECT amount * 1.2 AS gross\nFROM invoices\nWHERE gross > 100;", "options": {"A": "It runs and returns invoices whose gross amount exceeds 100.", "B": "It fails: the alias gross is not yet defined when WHERE is evaluated.", "C": "It runs, but the WHERE clause is silently ignored and all rows are returned.", "D": "It fails, because arithmetic is not allowed in the SELECT list."}, "answer": "B", "explanation
